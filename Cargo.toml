[workspace]
resolver = "3"
members = ["crates/oms-core", "crates/oms-journal", "crates/oms-sim", "crates/oms-api", "crates/oms-node", "crates/xtask", "crates/md-core", "crates/md-bybit", "crates/md-lake", "crates/md-feed", "crates/md-collector", "crates/http-fake", "crates/alert-direct", "crates/obs-push", "crates/md-archiver", "crates/oms-projector", "crates/oms-export", "crates/watcher", "crates/watcher-conformance"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
oms-core = { path = "crates/oms-core" }
oms-journal = { path = "crates/oms-journal" }
oms-sim = { path = "crates/oms-sim" }
oms-api = { path = "crates/oms-api" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
# Nested `if let` + `if` reads more clearly than a let-chain in the decision code.
collapsible_if = "allow"
# The clock and I/O calls listed in clippy.toml. Shell crates make them; a
# pure crate (oms-core, md-core: time and data arrive as inputs, ADR-002)
# turns this lint to deny in its lib.rs (ADR-033 part 3).
disallowed_methods = "allow"

# A panic anywhere ends the process. A thread that died while the others keep
# accepting requests would be worse than a stop: the journal holds the last
# consistent state and the supervisor restarts into recovery. (Test harnesses
# are always built with unwinding, so tests are unaffected.)
[profile.release]
debug = "line-tables-only"
overflow-checks = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"
panic = "abort"

# libzstd is C; unoptimised it compresses the memory tests' hundreds of MB
# too slowly for the default test run. Only this C build changes.
[profile.dev.package.zstd-sys]
opt-level = 3
