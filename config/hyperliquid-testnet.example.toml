# Hyperliquid testnet 예제 설정.
#
# 주의: 이 게이트웨이의 주문 경로는 실제 거래소에서 실행된 적이 없다(사용자 결정 U-01).
# 처음 쓸 때는 docs/operations/runbook.md의 "testnet 첫 실행" 절차를 따른다.
#
# 비밀 키는 이 파일에 적지 않는다. agent 지갑의 개인 키를 환경 변수로 준다:
#   HL_AGENT_PRIVATE_KEY=0x... oms-node run --config config/hyperliquid-testnet.toml
# 자금을 가진 마스터 지갑의 키는 이 시스템 어디에도 넣지 않는다.

data_dir = "../data/hl-testnet"

[http]
listen = "127.0.0.1:8188"
static_dir = "../dashboard"

[venue]
kind = "hyperliquid"
network = "testnet"                     # mainnet은 mainnet_confirmed = true가 있어야 한다
account_address = "0x0000000000000000000000000000000000000000"   # 자금을 가진 계좌의 주소로 바꾼다
agent_key_env = "HL_AGENT_PRIVATE_KEY"
request_timeout_ms = 5000
fills_lag_ms = 2000                     # 체결 조회를 이만큼 과거까지만 완료로 본다 (가정 A-02)
schedule_cancel_secs = 0                # 양수면 프로세스가 멈췄을 때 거래소가 전부 취소한다 (U-05)

[core]
version = 1

# 종목 규칙은 거래소의 규칙과 같거나 더 거칠어야 한다. 시작할 때 거래소의 meta와 대조하고
# 맞지 않으면 링크를 올리지 않는다. 아래 값은 2026-10-02 testnet BTC(szDecimals 5)에 맞춘 것이다.
[core.instruments.BTC]
qty_step = "0.00001"
px_tick = "1"
px_max_sig_figs = 5
min_notional = "10"
max_order_qty = "0.001"
max_order_notional = "200"
price_band_bps = 500                    # 참조 가격에서 5% 넘게 벗어난 지정가는 거절
account_pos_min = "-0.003"
account_pos_max = "0.003"

[core.strategies.demo]
enabled = true
max_open_orders = 5
[core.strategies.demo.limits.BTC]
min = "-0.002"
max = "0.002"

[core.policy]
max_open_orders = 10
max_inflight_sends = 4
max_expiry_horizon_us = 30000000        # 요청의 만료 시각은 최대 30초 앞
absence_margin_us = 10000000            # 만료 + 10초 뒤의 "없음"만 부재로 인정

# 증거금 규칙 (docs/contracts/margin.md, ADR-018). 이 구역이 없으면 규칙이 꺼지고, mainnet은 이 구역 없이는
# 시작하지 않는다. 아래 값은 기본값과 같다. OMS는 거래소의 레버리지와 증거금 방식을 읽기만 하고 바꾸지 않는다:
# 거래소에서 종목마다 격리(isolated)·레버리지 2로 직접 맞춰 둔다. 다르면 그 종목의 일반 주문이 막힌다.
[core.policy.margin]
max_account_leverage = "2.0"            # 계좌 노출이 계좌 가치의 2배를 넘게 되는 일반 주문은 거절
daily_loss_bps = 500                    # 기준 금액보다 5 % 넘게 낮아지면 감소 전용 상태
mm_buffer_bps = 25                      # 격리 증거금이 유지증거금률 + 0.25 %p 아래로 내려가면 감소 전용 상태
margin_max_age_us = 30000000            # 30초보다 오래된 증거금 보고로는 일반 주문을 받지 않는다
stale_cancel_us = 60000000              # 60초 넘게 보고가 없으면 걸려 있는 일반 주문을 취소한다
venue_leverage = 2                      # 거래소에 있어야 하는 종목 레버리지
isolated = true                         # 거래소에 있어야 하는 증거금 방식
# 허용하는 계좌 모드. 거래소가 표준 모드를 어떤 문자열로 답하는지는 확인하지 않았다(가정 T10).
# 비워 두면 모든 일반 주문이 AccountMode로 막힌다. testnet에서 status의 core.margin.account_mode에 보이는 값을
# 확인한 뒤에 적는다. unifiedAccount와 portfolioMargin은 적어도 허용되지 않는다.
account_modes_allowed = []

# 조회 간격의 기본값: [runtime] margin_poll_ms = 5000, venue_setting_poll_ms = 60000.
# 이 설정의 분당 조회 weight는 216 + 종목 수 × 20 = 236이고, 600을 넘으면 시작하지 않는다.
