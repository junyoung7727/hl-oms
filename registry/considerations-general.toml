# 층 1: 일반 소프트웨어 고려사항.
# applicability: 적용 | 조건부 | 비적용
# design: 결정 | 미결 | 해당없음     impl: 구현 | 부분 | 미구현 | 해당없음     verify: 검증 | 부분 | 미검증 | 해당없음
# "검증"은 연결된 주장(claims)의 시험이 통과했다는 뜻이며, 그 범위는 주장에 적힌 조건 안이다.

[[item]]
id = "G-QUAL-01"
layer = "general"
area = "품질"
consideration = "요구사항이 동작 계약과 시험으로 이어지는가"
necessity = "요구와 구현이 따로 변하면 무엇이 보장되는지 아무도 모르게 된다"
sources = ["ISO25010", "BRIEF"]
applicability = "적용"
reason = "기능 적합성은 모든 시스템에 해당한다"
handling = "검토 항목 → 설계 결정 → 계약 → 코드 → 주장 → 시험을 이 registry로 연결하고, `xtask docs`가 끊어진 연결을 오류로 잡는다"
design = "결정"
impl = "구현"
verify = "부분"
adr = []
contracts = []
code = ["crates/xtask/src/registry.rs"]
claims = []
open = "연결의 존재만 검사한다. 연결된 시험이 그 주장을 실제로 뒷받침하는지는 사람이 판단한다. 영향: 연결은 있는데 내용이 어긋난 주장을 생성기가 놓친다. 해소: 구현과 분리된 검토에서 주장과 시험을 대조한다(1회 수행: verification/gap-review.md). 단계: 코드를 바꿀 때마다."

[[item]]
id = "G-QUAL-02"
layer = "general"
area = "품질"
consideration = "성능 목표가 측정 조건을 포함한 수용 기준으로 정해져 있는가"
necessity = "근거 없는 수치는 과잉 최적화나 미달을 낳는다"
sources = ["ISO25010", "BRIEF"]
applicability = "적용"
reason = "성능 효율은 품질 특성이다"
handling = "수용 기준 A-LAT-1, A-LAT-2, A-CAP-1, A-REC-2를 거래소 한도에서 유도했다. 측정 도구는 `xtask perf`"
design = "결정"
impl = "구현"
verify = "검증"
adr = ["ADR-012"]
contracts = []
code = ["crates/xtask/src/perf.rs", "crates/xtask/src/loadgen.rs"]
claims = ["V-PERF-1", "V-PERF-2", "V-PERF-3"]
open = "지연 기준은 장치에 달려 있다. 같은 빌드가 970 EVO Plus 2TB에서는 초당 200건 p99 9.1 ms로 만족했고, 거의 찬 980 500GB에서는 27~32 ms로 넘었다. 영향: 다른 장치에서는 결과가 다를 수 있다. 해소: 운용 장치에서 `xtask fsync-probe`와 `perf`를 다시 돌린다. 단계: 배포 전."

