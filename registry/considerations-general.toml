handling = "가정 A-05로 남긴다. 유실되면 재시작 뒤 열린 주문 대조가 OrphanOrder로 드러낸다"
design = "결정"
impl = "해당없음"
verify = "미검증"
adr = ["ADR-004", "ADR-011"]
contracts = ["C-COMMIT"]
code = []
claims = []
