handling = "단일 노드 + 재시작 복구(사용자 결정). 서버 장애는 수동 복구 절차(운영 문서 §7.6): 마지막 기록까지 있는 저널이면 그것으로, 과거 사본뿐이면 새 인스턴스로 시작한다. 자동 failover와 재해 복구는 범위 밖"
design = "결정"
impl = "부분"
verify = "미검증"
adr = ["ADR-013"]
contracts = []
code = []
claims = []
open = "서버 장애 복구 절차(저널 사본에서 기동)는 문서만 있고 훈련하지 않았다. 저널을 다른 장치로 복사하는 도구가 없다. 영향: 서버를 잃으면 사본 이후의 기록과 전략별 귀속을 잃는다. 과거 사본으로 거래를 재개하면 주문 번호가 다시 쓰인다(A-12). 해소: 운영 문서 §7.6의 절차를 연습하고, 닫힌 세그먼트를 다른 장치로 복사하는 수단을 둔다. 단계: 실거래 전."

