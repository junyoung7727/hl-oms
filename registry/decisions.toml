[[adr]]
id = "ADR-030"
title = "킬 스위치, 운영자가 푸는 보류, 전략 연결 감시, 모니터링 게이트"
file = "docs/adr/ADR-030-kill-switch-holds.md"
problem = "Bybit에는 거래소 쪽 dead-man이 없어 개인 스트림을 잃으면 걸린 주문이 남고, 워처가 감소 전용 주문을 막지 않고 주문을 막을 입력이 없고, 거래소 변경이 확인 한 번으로 풀리고, 워처의 킬이 재시작을 넘어 남지 않고, 죽은 전략의 호가와 워처의 부재를 아무것도 막지 않는다"
alternatives = ["워처가 halt", "일괄 취소 한 번, 확인 없음", "노드 쪽 게이트(전이만 기록)", "전략을 잃으면 모든 전략의 주문 취소", "저널에 남는 래치와 clear_hold, 내구화된 명령이 시작하는 확인 루프, 노드가 감시하고 코어가 거는 전략 보류, 저널에 남는 하트비트를 코어가 판단하는 게이트"]
chosen = "U18b1: KillLatched(모든 주문), WatcherMismatch·VenueChange(일반 주문만)를 상태에서 계산하는 보류로. hold_set·hold_cleared·kill_loop_ended, 거래소 변경은 기존 이벤트에서 apply가 건다. clear_hold의 거절 코드(not_held, note_required, kill_unconfirmed, kill_orders_open, venue_change_pending), 강제 없음. 킬 해제는 코어의 장부에 미체결이 없을 때만(리뷰 S1, 스펙을 고침). 상태 스키마 2: U18b 전의 스냅샷은 건너뛰고 저널 전체를 재생(리뷰 S3). booted가 킬 확인을 지우고 Kill을 다시 요청. Kill·KillStop은 command_for에서만, 내구화 뒤. 일괄 취소가 없는 게이트웨이는 unsupported. 킬 마커는 Boot 전에 읽고(볼 수 없으면 래치) 내구화된 해제 뒤에 지움. mainnet은 [kill] 없이 시작하지 않음. U18b2: 마지막 생존 증거 뒤 kill_after_ms(10초)의 스트림 끊김 트리거(시작 확인 전 무장 안 함, 코어 큐 대기는 증거를 민다), 순수 상태 기계와 주입한 시계의 Bybit 확인 루프(회차마다 일괄 취소 하나, 0건 뒤 30초 감시, 비상 예산 2/1초, 루프 중 생성 거절), P1 10분에 12개 이하와 포지션 묶음, 확인 뒤 새 계기는 kill_rearmed로 확인을 지우고 새 루프(U18b1 리뷰 N3), [alert]가 없으면 알림마다 warn. U18b3: [liveness]에 적힌 전략의 마지막 연결 닫힘 또는 liveness_ms 침묵(ping 포함)을 노드가 Input::Session(Lost)로 한 번 알리고, 코어가 strategy_link_lost와 그 전략의 일반 주문만 규칙 취소·보류, 그 전략의 hello가 내구화된 복구로 풀고 그 뒤에 답함, 시작 때는 걸린 일반 주문이 있는 전략만 무장, mainnet은 사용 중인 전략이 모두 적혀야 시작. U18b4: [core.policy.monitor]가 있으면 monitor.sock(자기 uid, 연결 둘, 연결마다 초당 둘)의 하트비트를 저널에 남기고 코어가 기록 시각으로 판단하는 게이트. 하트비트 30초 없음 또는 그 하트비트에서 W1·W2가 10초 넘게 이전이면 일반 주문 거절(Unmonitored), 60초 더 가면 걸린 일반 주문의 규칙 취소(다한 시도는 다시 묻지 않음, 연결이 올라와 있을 때). 검사의 나이는 그것을 알린 하트비트의 시각에서 잰다(스펙 수정: 틱의 시각이면 10초 규칙이 30초 규칙을 늘 앞선다). 미래의 검사 시각(1초 넘게)은 거절(노드보다 앞선 시각을 찍는 워처를 막는다. 호스트 시계가 뒤로 가면 기록 시각이 멈춰 게이트의 시계도 멈춘다: 알려진 한계, 리뷰 1 M1). 모든 시작과 게이트를 켜는 설정은 감시 안 됨으로. 게이트가 있으면 runtime.tick_ms는 1,000 ms 이하(리뷰 1 S3). mainnet은 게이트 없이 시작하지 않음"
gives_up = "거래소에 닿지 못할 때의 킬 해제, 가상 거래소·Hyperliquid의 자동 일괄 취소, 실행 중 마커 감시, 킬 뒤의 자동 청산"
revisit = "소유자 질문 1~5의 답이 기본값과 다를 때, Bybit가 DCP를 줄 때, 워처 입력 형식이 바뀔 때, 자동 재시작(U-06)"

[[adr]]
id = "ADR-031"
title = "독립 워처: OMS 코드를 쓰지 않는 저널 읽기와 그 증명"
file = "docs/adr/ADR-031-watcher.md"
problem = "OMS의 저널 인코딩·대조·Bybit 해석의 결함을 같은 코드로 만든 워처는 같은 결함으로 같은 답을 내고, mainnet은 워처 없이 거래하지 못하며, 독립성이 사람의 약속이면 편의로 들어온 의존성을 아무도 모른다"
alternatives = ["oms-journal::Tail을 그대로 쓴다", "ADR-011과 C-TAIL만으로 쓴 독자 읽기", "독자 읽기에 커서 저장을 더한다", "독립성을 검토로만 지킨다", "cargo metadata를 읽는 CI 스크립트", "워처를 다른 저장소로"]
chosen = "crate watcher(레지스트리 의존성만, 개발 의존성 http-fake만)와 유일한 다리 watcher-conformance. tools/ci/watcher_independent.sh: cargo metadata --locked --offline --filter-platform <host>와 jq로 선언된 oms-*·md-*(모든 종류와 target), 다른 경로 crate, 호스트 그래프의 도달, 역방향, #[path]·include!·속성 안의 path =·심볼릭 링크, 소스 파일이 패키지 밖인 target. 종료 0/1/2, CI는 Build 뒤, 자체 시험 22건. 독자 읽기 Tail::open/read(cap, max): 읽기 전용, LOCK 없음, 프레임 하나씩, 상한 너머 금지, 회전과 헤더 다시 읽기, 손상은 위치를 두고 오류. Io·Damaged·NoStart는 다시 읽고 UnknownEvent·Schema·Format·Instance는 재시작까지 래치. 커서 저장 없이 시작마다 기록 1부터 재생. 아는 이벤트는 C-TAIL 표를 시험 시각에 파일로 읽어 비교. 저널 상태 JournalState는 C-TAIL 상태 표의 규칙만으로(주문 정보는 purged까지, 체결 바닥은 올라가기만; 확인·결과 불명·종결 표시, 거래소 변경·펀딩 키, 체결 바닥, 보류, 기준일의 행은 U19a2 검토 1 M1에서 표에 더함), 규칙에 맞지 않는 기록은 State 오류로 래치. 자기 Bybit GET 서명과 클라이언트(U19a3): 정렬된 질의, 보낼 수 없는 값은 보내기 전에 거절, 응답 부류 표, 키 거절(401, 10003·10004·10005·10007·10010·33004)은 재시작까지 래치, 403은 응답부터 600초 멈춤, 10초 창 60개의 sans-IO 요청 제한, 보내기 전에 세는 요청. 자기 지표 등록부와 큐 없는 VM 가져오기 클라이언트(obs-push를 쓰지 않음). 시작 확인과 IP 재확인(U19a4b)은 시계를 읽지 않는 sans-IO 단계 기계(poll/on_answer/Step)이고, 키 거절이면 끝내지 않고 요청 없이 떠 있으며, 재확인에서 시작 규칙에 맞지 않는 키는 키 거절과 같은 래치로 모든 Bybit 요청을 멈춘다. 검사 엔진(U19a5)은 sans-IO(poll·on_venue·on_status가 Venue·Status·Mismatch·Heartbeat를 냄)이고 검사는 Logic(첫 요청, 쪽, 비교)만 준다. 라운드는 거래소 → 그 라운드만의 /api/status → 그 상한까지 저널 → 비교, 상태 답은 물은 라운드에만, 상한이 그 요청 때의 last_seq보다 낮으면 래치, 요청마다 기한, 두 라운드 규칙(나이는 확정 라운드에서). W2(U19a6)는 같은 엔진에 Logic 하나로 들어가고, 어린 시각이 첫 sighting도 미루는 엄격한 규칙은 Logic::young_defers_at_first_sighting 하나로만 엔진에 닿는다. 막 닫힌 포지션의 시각은 워처가 그 크기를 처음 본 라운드(seen_at). OMS 연결과 실행(U19a7): 다시 보내기 규칙도 sans-IO 엔진의 것이고(on_admin), 확정된 차이는 held 답만 갚는 빚이며 보류 꺼짐은 최근 답 뒤에 낸 상태 요청의 상한에서만 믿는다. 실행은 단일 스레드 tokio 루프가 sans-IO 부분들(Start, IpCheck, 엔진, 밀어 넣기 타이머)에 100ms마다와 답마다 무엇이 때가 됐는지 묻고 요청마다 태스크를 띄운다. 바이너리의 끝점은 설정에서만. W4(U19a8)도 같은 엔진에 Logic 하나로 들어가고 차이는 Logic의 기본 있는 갈고리(first(now, state), Page::Pause, defers, at_once, failed, judged)로만 닿는다. 워터마크는 확정되지 않은 가장 오래된 행 아래로만 움직이고 뒤로 가지 않으며 훑기의 끝 뒤 execTime은 믿지 않고(unreadable_row), 수량 0 행은 OMS처럼 무시하고, held로 갚고 풀린 W4 정체는 해제 뒤 다시 보내지 않고 거둔다. W3(U19a9)도 같은 엔진에 Logic 하나로 들어가 OMS의 계좌 유지증거금률·일 손실 공식을 워처 설정의 한도로 쓰고(일 손실은 오늘의 UTC 기준만), 정체는 종류뿐이며 나이 없이 두 라운드 연속에서 확정한다. W2는 W4와 나눈 지도에서 W4가 맞춘 가장 새 execTime을 더 새면 거래소의 변경 시각으로 쓴다. 대조 예산은 강제하지 않고 재며, 범위의 W4 규칙(겹침, 모든 커서)을 지켜 큰 부하에서 2.7 req/s를 넘는다(소유자 질문 1)"
gives_up = "이미 시험된 oms-journal::Tail, 재시작 때 저널 전체를 다시 읽는 비용, 다른 플랫폼 의존성 그래프의 검사, 개발 의존성 http-fake 너머의 그래프, 여러 줄 속성의 텍스트 검색, W4가 가득 찬 마지막 쪽 뒤의 행(W2가 본다)과 재시작 뒤의 거둠, 5초에 체결 100개에서의 2.7 req/s(측정 3.2, 정상 상태 3.3), 자정부터 OMS의 새 기준까지의 일 손실 판단"
revisit = "재생 시간이 게이트의 30초에 가까워질 때(U19a2 측정: 100만 건당 약 1.3초, 30초 ≈ 2,200만 건), 워처가 다른 플랫폼에서 돌 때, oms-*·md-*가 아닌 OMS crate가 생길 때, C-TAIL이 바뀔 때, Bybit가 오류 코드·403 대기·IP 한도를 바꿀 때"

[[adr]]
id = "ADR-032"
title = "워처의 직접 알림과 자기 킬: OMS가 조용하면 마커를 쓰고 OMS를 멈춘 뒤 자기 키로 일괄 취소"
file = "docs/adr/ADR-032-watcher-kill-and-alerts.md"
problem = "OMS 프로세스가 죽거나 HTTP에 답하지 않으면 그 미체결 주문은 Bybit에 남고(거래소 쪽 데드맨 없음) 아무도 모른다. OMS의 킬 루프와 직접 알림은 OMS와 같이 죽고, 워처는 메시지를 보내지 않으며, 멈추지 않은 OMS나 래치 없이 다시 시작한 OMS는 워처의 일괄 취소와 반대로 움직인다"
alternatives = ["alert-direct를 링크한다", "워처 자신의 송신기(PR #3 규칙을 다시 씀)", "OMS를 halt로 멈춘다", "watcher_kill, 안 되면 systemctl stop 한 단위", "OMS를 신호로 멈춘다", "마커 없이 멈추고 일괄 취소", "마커를 쓰고 멈춘 뒤 일괄 취소"]
chosen = "워처 자신의 송신기 watcher::alert(독립성 규칙 3이 alert-direct를 막음): 접두어 [WATCH P1], 머리 '[WATCH P1] bybit {name} {MM-DD HH:MM:SS KST}', 3,500 UTF-16 분할(줄 끝, 긴 줄은 문자), 보관 50개(넘치면 오래된 것을 버리고 셈, 큐가 빈 뒤 알림 하나, 보내는 중 버려진 부분은 두 번 지우거나 세지 않음), 2xx와 ok true만 전달, 400·413 버림, 나머지 다시 보냄, 반복 규칙(시작, 300,000 ms마다 최신 문구, 해소: <시작 문구>, 메모리에만). [telegram] token_file: alert-direct와 같은 JSON, 자격 파일의 파일 규칙에 git 저장소 밖, 설정 다음·시작 확인 전에 한 번 읽고 거부는 종료 코드 2, Debug는 token: <hidden>; mainnet은 [telegram] 없이 시작하지 않고 testnet은 warn 한 줄(U19b1a). OMS가 10초 정상 응답이 없으면(W5, 시작 확인 뒤에만 무장, 틈 규칙, 킬 뒤 정상 응답 하나까지 다시 무장하지 않음) K1 킬 마커 → K2 admin.sock watcher_kill → 래치되지 않았으면 K3 그 단위 하나만 systemctl --no-ask-password stop → 그 뒤에만 첫 일괄 취소, 각 단계는 주입된 시계의 기한. 루프는 OMS의 KillLoop을 모형으로 다시 쓴 sans-IO(실패한 일괄 취소 뒤에도 셈, 건수 변화 알림 없이 60초 진행 알림만, 1,000 ms 창에 일괄 취소 둘 이하). 킬 중 엔진은 멈춘다. 저장하지 않는다. ADR-031의 \"파일을 쓰지 않는다\"를 고침: 킬 마커 하나(U19b3)"
gives_up = "이미 시험된 alert-direct(같은 규칙을 두 번 구현), 재시작 너머의 반복 상태와 킬 진행, 코어가 걸리고 HTTP 태스크가 답하는 OMS의 감지(W5가 보지 못함), GIT_DIR로 다른 곳을 가리키는 저장소의 토큰 파일 검사"
revisit = "텔레그램이 응답 규칙을 바꾸거나 둘째 채널을 정할 때, /api/status가 코어 루프를 거치게 될 때, OMS 단위가 Restart=no가 될 때(U20b), Bybit가 이 계좌에 DCP를 줄 때, 워처가 실제 거래소와 텔레그램에서 처음 돌 때"
