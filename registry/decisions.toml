[[adr]]
id = "ADR-030"
title = "킬 스위치, 운영자가 푸는 보류, 전략 연결 감시, 모니터링 게이트"
file = "docs/adr/ADR-030-kill-switch-holds.md"
problem = "Bybit에는 거래소 쪽 dead-man이 없어 개인 스트림을 잃으면 걸린 주문이 남고, 워처가 감소 전용 주문을 막지 않고 주문을 막을 입력이 없고, 거래소 변경이 확인 한 번으로 풀리고, 워처의 킬이 재시작을 넘어 남지 않고, 죽은 전략의 호가와 워처의 부재를 아무것도 막지 않는다"
alternatives = ["워처가 halt", "일괄 취소 한 번, 확인 없음", "노드 쪽 게이트(전이만 기록)", "전략을 잃으면 모든 전략의 주문 취소", "저널에 남는 래치와 clear_hold, 내구화된 명령이 시작하는 확인 루프, 노드가 감시하고 코어가 거는 전략 보류, 저널에 남는 하트비트를 코어가 판단하는 게이트"]
chosen = "U18b1: KillLatched(모든 주문), WatcherMismatch·VenueChange(일반 주문만)를 상태에서 계산하는 보류로. hold_set·hold_cleared·kill_loop_ended, 거래소 변경은 기존 이벤트에서 apply가 건다. clear_hold의 거절 코드(not_held, note_required, kill_unconfirmed, kill_orders_open, venue_change_pending), 강제 없음. 킬 해제는 코어의 장부에 미체결이 없을 때만(리뷰 S1, 스펙을 고침). 상태 스키마 2: U18b 전의 스냅샷은 건너뛰고 저널 전체를 재생(리뷰 S3). booted가 킬 확인을 지우고 Kill을 다시 요청. Kill·KillStop은 command_for에서만, 내구화 뒤. 일괄 취소가 없는 게이트웨이는 unsupported. 킬 마커는 Boot 전에 읽고(볼 수 없으면 래치) 내구화된 해제 뒤에 지움. mainnet은 [kill] 없이 시작하지 않음. U18b2: 마지막 생존 증거 뒤 kill_after_ms(10초)의 스트림 끊김 트리거(시작 확인 전 무장 안 함, 코어 큐 대기는 증거를 민다), 순수 상태 기계와 주입한 시계의 Bybit 확인 루프(회차마다 일괄 취소 하나, 0건 뒤 30초 감시, 비상 예산 2/1초, 루프 중 생성 거절), P1 10분에 12개 이하와 포지션 묶음, 확인 뒤 새 계기는 kill_rearmed로 확인을 지우고 새 루프(U18b1 리뷰 N3), [alert]가 없으면 알림마다 warn. U18b3: [liveness]에 적힌 전략의 마지막 연결 닫힘 또는 liveness_ms 침묵(ping 포함)을 노드가 Input::Session(Lost)로 한 번 알리고, 코어가 strategy_link_lost와 그 전략의 일반 주문만 규칙 취소·보류, 그 전략의 hello가 내구화된 복구로 풀고 그 뒤에 답함, 시작 때는 걸린 일반 주문이 있는 전략만 무장, mainnet은 사용 중인 전략이 모두 적혀야 시작. U18b4: [core.policy.monitor]가 있으면 monitor.sock(자기 uid, 연결 둘, 연결마다 초당 둘)의 하트비트를 저널에 남기고 코어가 기록 시각으로 판단하는 게이트. 하트비트 30초 없음 또는 그 하트비트에서 W1·W2가 10초 넘게 이전이면 일반 주문 거절(Unmonitored), 60초 더 가면 걸린 일반 주문의 규칙 취소(다한 시도는 다시 묻지 않음, 연결이 올라와 있을 때). 검사의 나이는 그것을 알린 하트비트의 시각에서 잰다(스펙 수정: 틱의 시각이면 10초 규칙이 30초 규칙을 늘 앞선다). 미래의 검사 시각(1초 넘게)은 거절(노드보다 앞선 시각을 찍는 워처를 막는다. 호스트 시계가 뒤로 가면 기록 시각이 멈춰 게이트의 시계도 멈춘다: 알려진 한계, 리뷰 1 M1). 모든 시작과 게이트를 켜는 설정은 감시 안 됨으로. 게이트가 있으면 runtime.tick_ms는 1,000 ms 이하(리뷰 1 S3). mainnet은 게이트 없이 시작하지 않음"
gives_up = "거래소에 닿지 못할 때의 킬 해제, 가상 거래소·Hyperliquid의 자동 일괄 취소, 실행 중 마커 감시, 킬 뒤의 자동 청산"
revisit = "소유자 질문 1~5의 답이 기본값과 다를 때, Bybit가 DCP를 줄 때, 워처 입력 형식이 바뀔 때, 자동 재시작(U-06)"

[[adr]]
id = "ADR-031"
title = "독립 워처: OMS 코드를 쓰지 않는 저널 읽기와 그 증명"
file = "docs/adr/ADR-031-watcher.md"
problem = "OMS의 저널 인코딩·대조·Bybit 해석의 결함을 같은 코드로 만든 워처는 같은 결함으로 같은 답을 내고, mainnet은 워처 없이 거래하지 못하며, 독립성이 사람의 약속이면 편의로 들어온 의존성을 아무도 모른다"
alternatives = ["oms-journal::Tail을 그대로 쓴다", "ADR-011과 C-TAIL만으로 쓴 독자 읽기", "독자 읽기에 커서 저장을 더한다", "독립성을 검토로만 지킨다", "cargo metadata를 읽는 CI 스크립트", "워처를 다른 저장소로"]
chosen = "crate watcher(레지스트리 의존성만, 개발 의존성 http-fake만)와 유일한 다리 watcher-conformance. tools/ci/watcher_independent.sh: cargo metadata --locked --offline --filter-platform <host>와 jq로 선언된 oms-*·md-*(모든 종류와 target), 다른 경로 crate, 호스트 그래프의 도달, 역방향, #[path]·include!·속성 안의 path =·심볼릭 링크, 소스 파일이 패키지 밖인 target. 종료 0/1/2, CI는 Build 뒤, 자체 시험 22건. 독자 읽기 Tail::open/read(cap, max): 읽기 전용, LOCK 없음, 프레임 하나씩, 상한 너머 금지, 회전과 헤더 다시 읽기, 손상은 위치를 두고 오류. Io·Damaged·NoStart는 다시 읽고 UnknownEvent·Schema·Format·Instance는 재시작까지 래치. 커서 저장 없이 시작마다 기록 1부터 재생. 아는 이벤트는 C-TAIL 표를 시험 시각에 파일로 읽어 비교. 저널 상태 JournalState는 C-TAIL 상태 표의 규칙만으로(주문 정보는 purged까지, 체결 바닥은 올라가기만; 확인·결과 불명·종결 표시, 거래소 변경·펀딩 키, 체결 바닥, 보류, 기준일의 행은 U19a2 검토 1 M1에서 표에 더함), 규칙에 맞지 않는 기록은 State 오류로 래치. 자기 Bybit GET 서명과 클라이언트(U19a3): 정렬된 질의, 보낼 수 없는 값은 보내기 전에 거절, 응답 부류 표, 키 거절(401, 10003·10004·10005·10007·10010·33004)은 재시작까지 래치, 403은 응답부터 600초 멈춤, 10초 창 60개의 sans-IO 요청 제한, 보내기 전에 세는 요청. 자기 지표 등록부와 큐 없는 VM 가져오기 클라이언트(obs-push를 쓰지 않음). 시작 확인과 IP 재확인(U19a4b)은 시계를 읽지 않는 sans-IO 단계 기계(poll/on_answer/Step)이고, 키 거절이면 끝내지 않고 요청 없이 떠 있으며, 재확인에서 시작 규칙에 맞지 않는 키는 키 거절과 같은 래치로 모든 Bybit 요청을 멈춘다. 검사 엔진(U19a5)은 sans-IO(poll·on_venue·on_status가 Venue·Status·Mismatch·Heartbeat를 냄)이고 검사는 Logic(첫 요청, 쪽, 비교)만 준다. 라운드는 거래소 → 그 라운드만의 /api/status → 그 상한까지 저널 → 비교, 상태 답은 물은 라운드에만, 상한이 그 요청 때의 last_seq보다 낮으면 래치, 요청마다 기한, 두 라운드 규칙(나이는 확정 라운드에서). W2(U19a6)는 같은 엔진에 Logic 하나로 들어가고, 어린 시각이 첫 sighting도 미루는 엄격한 규칙은 Logic::young_defers_at_first_sighting 하나로만 엔진에 닿는다. 막 닫힌 포지션의 시각은 워처가 그 크기를 처음 본 라운드(seen_at). OMS 연결과 실행(U19a7): 다시 보내기 규칙도 sans-IO 엔진의 것이고(on_admin), 확정된 차이는 held 답만 갚는 빚이며 보류 꺼짐은 최근 답 뒤에 낸 상태 요청의 상한에서만 믿는다. 실행은 단일 스레드 tokio 루프가 sans-IO 부분들(Start, IpCheck, 엔진, 밀어 넣기 타이머)에 100ms마다와 답마다 무엇이 때가 됐는지 묻고 요청마다 태스크를 띄운다. 바이너리의 끝점은 설정에서만. W4(U19a8)도 같은 엔진에 Logic 하나로 들어가고 차이는 Logic의 기본 있는 갈고리(first(now, state), Page::Pause, defers, at_once, failed, judged)로만 닿는다. 워터마크는 확정되지 않은 가장 오래된 행 아래로만 움직이고 뒤로 가지 않으며 훑기의 끝 뒤 execTime은 믿지 않고(unreadable_row), 수량 0 행은 OMS처럼 무시하고, held로 갚고 풀린 W4 정체는 해제 뒤 다시 보내지 않고 거둔다. W3(U19a9)도 같은 엔진에 Logic 하나로 들어가 OMS의 계좌 유지증거금률·일 손실 공식을 워처 설정의 한도로 쓰고(일 손실은 오늘의 UTC 기준만), 정체는 종류뿐이며 나이 없이 두 라운드 연속에서 확정한다. W2는 W4와 나눈 지도에서 W4가 맞춘 가장 새 execTime을 더 새면 거래소의 변경 시각으로 쓴다. 대조 예산은 강제하지 않고 재며, 범위의 W4 규칙(겹침, 모든 커서)을 지켜 큰 부하에서 2.7 req/s를 넘는다(소유자 질문 1)"
gives_up = "이미 시험된 oms-journal::Tail, 재시작 때 저널 전체를 다시 읽는 비용, 다른 플랫폼 의존성 그래프의 검사, 개발 의존성 http-fake 너머의 그래프, 여러 줄 속성의 텍스트 검색, W4가 가득 찬 마지막 쪽 뒤의 행(W2가 본다)과 재시작 뒤의 거둠, 5초에 체결 100개에서의 2.7 req/s(측정 3.2, 정상 상태 3.3), 자정부터 OMS의 새 기준까지의 일 손실 판단"
revisit = "재생 시간이 게이트의 30초에 가까워질 때(U19a2 측정: 100만 건당 약 1.3초, 30초 ≈ 2,200만 건), 워처가 다른 플랫폼에서 돌 때, oms-*·md-*가 아닌 OMS crate가 생길 때, C-TAIL이 바뀔 때, Bybit가 오류 코드·403 대기·IP 한도를 바꿀 때"

[[adr]]
id = "ADR-032"
title = "워처의 직접 알림과 자기 킬: OMS가 조용하면 마커를 쓰고 OMS를 멈춘 뒤 자기 키로 일괄 취소"
file = "docs/adr/ADR-032-watcher-kill-and-alerts.md"
problem = "OMS 프로세스가 죽거나 HTTP에 답하지 않으면 그 미체결 주문은 Bybit에 남고(거래소 쪽 데드맨 없음) 아무도 모른다. OMS의 킬 루프와 직접 알림은 OMS와 같이 죽고, 워처는 메시지를 보내지 않으며, 멈추지 않은 OMS나 래치 없이 다시 시작한 OMS는 워처의 일괄 취소와 반대로 움직인다"
alternatives = ["alert-direct를 링크한다", "워처 자신의 송신기(PR #3 규칙을 다시 씀)", "OMS를 halt로 멈춘다", "watcher_kill, 안 되면 systemctl stop 한 단위", "OMS를 신호로 멈춘다", "마커 없이 멈추고 일괄 취소", "마커를 쓰고 멈춘 뒤 일괄 취소"]
chosen = "워처 자신의 송신기 watcher::alert(독립성 규칙 3이 alert-direct를 막음): 접두어 [WATCH P1], 머리 '[WATCH P1] bybit {name} {MM-DD HH:MM:SS KST}', 3,500 UTF-16 분할(줄 끝, 긴 줄은 문자), 보관 50개(넘치면 오래된 것을 버리고 셈, 큐가 빈 뒤 알림 하나, 보내는 중 버려진 부분은 두 번 지우거나 세지 않음), 2xx와 ok true만 전달, 400·413 버림, 나머지 다시 보냄, 반복 규칙(시작, 300,000 ms마다 최신 문구, 해소: <시작 문구>, 메모리에만). [telegram] token_file: alert-direct와 같은 JSON, 자격 파일의 파일 규칙에 git 저장소 밖, 설정 다음·시작 확인 전에 한 번 읽고 거부는 종료 코드 2, Debug는 token: <hidden>; mainnet은 [telegram] 없이 시작하지 않고 testnet은 warn 한 줄(U19b1a). P1 조건(U19b1c): 불일치 P1은 식별자의 확정마다(보내기마다가 아님), 검사마다 첫 것은 바로 그 뒤 60초에 하나·모아서, 키 거부와 공인 IP는 접근자를 틱마다 읽어 반복 규칙으로, 시작 거부는 종료 전에 하나. OMS가 10초 정상 응답이 없으면(W5, 시작 확인 뒤에만 무장, 틈 규칙, 킬 뒤 정상 응답 하나까지 다시 무장하지 않음) K1 킬 마커 → K2 admin.sock watcher_kill → 래치되지 않았으면 K3 그 단위 하나만 systemctl --no-ask-password stop → 그 뒤에만 첫 일괄 취소, 각 단계는 주입된 시계의 기한. 루프는 OMS의 KillLoop을 모형으로 다시 쓴 sans-IO(실패한 일괄 취소 뒤에도 셈, 건수 변화 알림 없이 60초 진행 알림만, 1,000 ms 창에 일괄 취소 둘 이하). 일괄 취소는 서명된 POST 하나뿐(경로와 본문이 상수, 서명은 보내는 바이트 위, 일반 POST 없음)이고, [kill]이면 키는 readOnly 0·ContractTrade Order·Withdraw 없음이어야 시작하며, 킬 알림마다 거래소 포지션 묶음(U19b2a). 킬 중 엔진은 멈춘다. W5와 킬 경로는 뒤로 가지 않는 시계(clock::Steady)를 읽고, 워처가 띄우는 프로그램은 systemctl [--user] --no-ask-password stop -- <oms_unit> 하나뿐이며 mainnet은 [kill] 없이 시작하지 않는다(U19b3a). 킬 순서는 sans-IO Kill(U19b3b): K1 마커(기한 2초; 임시 이름 0600·sync_all·hard_link, 있는 것은 건드리지 않음) → K2 watcher_kill(기한 2 × request_timeout_ms + 1초) → 래치하지 못했을 때만 K3 멈춤(stop_wait_ms) → 루프, 기한이 지난 단계는 실패로 적고 다음으로; halt_owed = 래치도 경로를 확인한 마커와 함께인 멈춤도 없음, 빚이 있으면 루프 동안 5초마다 watcher_kill을 다시 보냄; 루프 전의 중단도 알림 하나. 실행(U19b3c): 시작 확인 끝에 W5 무장, [kill]이 있으면 node.kill_marker가 워처의 마커와 같은 파일이어야 시작(아니면 종료 코드 2), 킬 동안 엔진은 poll하지 않고 검사 나이만 적음(Engine::export_ages), 루프 중 정지 재시도는 K2의 길, 킬 알림은 포지션 묶음과 루프 옆에서 하나씩(16개까지 기다림, 진행 알림만 버림). 저장하지 않는다. ADR-031의 \"파일을 쓰지 않는다\"를 고침: 킬 마커 하나(U19b3)"
gives_up = "이미 시험된 alert-direct(같은 규칙을 두 번 구현), 재시작 너머의 반복 상태와 킬 진행, 코어가 걸리고 HTTP 태스크가 답하는 OMS의 감지(W5가 보지 못함), GIT_DIR로 다른 곳을 가리키는 저장소의 토큰 파일 검사"
revisit = "텔레그램이 응답 규칙을 바꾸거나 둘째 채널을 정할 때, /api/status가 코어 루프를 거치게 될 때, OMS 단위가 Restart=no가 될 때(U20b), Bybit가 이 계좌에 DCP를 줄 때, 워처가 실제 거래소와 텔레그램에서 처음 돌 때"

[[adr]]
id = "ADR-033"
title = "저장소 표준: 검사를 바꾸는 변경은 소유자가 보고, 구조와 돈 코드의 문법은 기계가 막는다"
file = "docs/adr/ADR-033-repository-standards.md"
problem = "변경은 거의 모두 실행기가 쓰고 검사가 통과하면 머지되는데, 검사를 약하게 만드는 변경(허용목록 한 줄, 시험 삭제·ignore, lint·profile 완화)도 그 검사를 통과하고, main에는 보호가 없었다"
alternatives = ["문장 규칙만", "돈 코드 경로 전부를 소유자 확인(PR 48건 중 83%)", "검사를 바꾸는 변경만 소유자 확인(27%), 다른 돈 코드는 하루 한 건 카드", "그에 더해 봇 계정과 CODEOWNERS로 GitHub이 강제"]
chosen = "main-lock ruleset(삭제·강제 push 금지, PR 필수 승인 0명, 필수 검사 check, strict 꺼짐, 우회 없음)과 tools/ci/owner_review.sh <base> [경로 목록]: 규칙 path(tools/ci/owner_review_paths.txt를 .gitignore처럼, 이름 항목은 어느 깊이든; xtask의 layers.rs·registry.rs·main.rs 포함), manifest(lints·profile 표, [[test]]·[[bench]], auto*, 대상의 test·harness·doctest·bench 키, 정확히 [lints] workspace = true가 아닌 새 패키지 manifest, 빠진 workspace 멤버), lint(crates/*/src의 crate 수준과 mod 항목의 lint 속성, 새 crate lib.rs의 cfg_attr(test, allow(clippy::unwrap_used))는 제외), tests(시험 속성 순감소, 파일별로 더한 시험보다 많은 #[ignore]·cfg_attr ignore·tests/ 아래 cfg, any() 또는 낱말 test의 all·not cfg, 없어진 시험 대상 파일, 시험 파일이 남은 채 지운 mod 줄); 종료 코드 0 none, 1 결과, 2 확인 불가(도구 없음, git 읽기 실패, 빈 목록); 실행기가 기준 브랜치의 스크립트와 목록으로 머지 전에 돌리고 결과가 있으면 멈추고 소유자를 부른다. selftest.sh owner review 절 77가지(none 17, 결과 53, 확인 불가 7). 순수 crate는 clippy.toml의 시계 6개와 I/O 진입 함수 21개를 deny"
gives_up = "GitHub의 강제(같은 계정의 다른 머지 경로는 확인을 거치지 않음), 텍스트 검사의 빈틈(이유 문자열 속 ], 두 줄 시험 속성, 같은 파일에서 ignore 하나와 새 시험 하나, 블록 주석으로 감싼 시험, src의 cfg(feature) 위 기존 시험, mod 줄의 cfg, #[path] 모듈, workspace exclude), CI 밖에 남는 core_purity의 나머지(HashMap·HashSet, f64 타입, 목록 밖 std 함수)"
revisit = "실행기용 봇 계정이나 GitHub App을 정할 때, 결과 비율이 한 주 40%를 넘을 때, 다른 머지 경로가 생길 때"

[[adr]]
id = "ADR-034"
title = "Bybit RSA 서명 키"
file = "docs/adr/ADR-034-bybit-rsa-keys.md"
problem = "워처와 OMS의 Bybit 게이트웨이는 HMAC-SHA256으로만 서명하는데, Bybit testnet의 AI 하위 계정은 직접 만든 RSA 키만 내 주어 두 바이너리 모두 소유자의 testnet 키를 쓸 수 없다. hex로 보낸 RSA 서명은 거절되고 키 거절은 재시작까지 래치된다"
alternatives = ["자격 파일에 PEM 파일의 경로", "자격 파일 안에 PEM 글(TOML 여러 줄 문자열)", "PKCS#1과 암호화된 PKCS#8도 받음", "PKCS#8만 받고 다른 형은 변환 명령을 적어 거부", "호출 지점마다 RSA 분기", "crate마다 서명기 하나"]
chosen = "자격 파일(두 바이너리, 같은 모양): api_key와 api_secret(HMAC) 또는 rsa_private_key(PKCS#8 PEM 글) 중 정확히 하나, 둘 다·둘 다 없음은 파일을 인용하지 않는 한 줄로 시작 거부, 모르는 키 거부, 파일 규칙 그대로(D1). PEM은 BEGIN PRIVATE KEY(PKCS#8, 암호화 안 됨)만, PKCS#1과 암호화된 PEM은 'openssl pkcs8 -topk8 -nocrypt -in old.pem -out new.pem'을 적어 거부, 2048비트 미만 거부(ring), 시작할 때 한 번 파싱(D2). crate마다 Signer(HMAC 비밀 | 파싱된 RSA 키 쌍) 하나와 sign(prehash): HMAC은 소문자 hex, RSA는 RSA-SHA256 PKCS#1 v1.5의 표준 base64, 모든 호출 지점(워처 GET·일괄 취소, OMS REST·비공개 스트림·WS Trade auth)이 그것을 지남(D3). 워처는 자기 구현(D4). ring 0.17·base64 0.23은 이미 Cargo.lock에 있어 새 패키지 없음(D5). Debug는 비밀도 키도 찍지 않음(D6). 서명 실패는 보내지 않은 요청(D7). RSA 요청에는 X-BAPI-SIGN-TYPE을 보내지 않음(측정한 요청의 모양, 판단)"
gives_up = "암호화된 키 파일(무인 실행에서 암호를 물을 곳이 없다), 키 회전, Ed25519"
revisit = "Bybit가 HMAC 키를 다시 주거나 RSA 서명·머리글 규칙을 바꿀 때, 키 회전이나 암호화된 키 파일이 필요할 때"

[[adr]]
id = "ADR-035"
title = "관측 스택과 시세 단위의 배치 파일, 그리고 그 검사"
file = "docs/adr/ADR-035-observability-deployment-files.md"
problem = "수집기·봉인·아카이버는 코드와 단위 틀만 있었고, 관측 스택이 이 PC에서 어디에 데이터를 두고 메모리를 얼마까지 쓰며 어떤 규칙이 무엇을 알리는지 없었다. 검사가 없으면 없는 지표를 쓴 규칙이 영원히 조용하고, 수집기 단위가 편집 한 번에 Restart=always나 메모리 보호를 잃어도 모른다"
alternatives = ["계획 이름 그대로 평범한 단위에 거래소마다 ExecStart 한 줄", "거래소마다 템플릿과 일일 작업 잠금", "YAML과 YAML crate", "손으로 쓴 YAML 부분 파서", "JSON 문법으로 쓴 YAML을 serde_json으로", "xtask 하위 명령 deploy-check", "CI 단계(vmalert·amtool 내려받기)", "xtask 통합 시험", "Grafana 알림", "지표 긁어 오기"]
chosen = "파일만 deploy/observability/ 아래, 설치 지도 install.toml(단위 → /etc/systemd/system, bin → /usr/local/lib/hl-oms-obs 0755, 설정 → /etc/hl-oms-obs 0644), YAML 소비자는 JSON 문법(D0). 수집기: Restart=always, RestartSec=2, 시작 횟수 제한 없음, 재시작 지연 늘림 없음, trading.slice, OOMScoreAdjust=-900, MemorySwapMax=0, MemoryMin=MemoryMax의 절반, IOWeight=1000; 슬라이스 CPUWeight=1000, MemoryMin ≥ 단위 합(D3). 거래소마다 템플릿, 모든 일일 작업은 flock /run/lock/hl-oms-daily.lock 아래 TimeoutStartSec=6h, 잠금 사용자는 모두 root; 봉인 매시 5분 1G, 아카이버 01:10 4G, 감사 02:30 4G(9일 verify 고리와 종료 코드 2·5, 경로 줄 둘), 타이머 Persistent(D4). 검사는 xtask 통합 시험 tests/deploy(소유자 경로를 건드리지 않음, 주장 없음)(D6). 지표 목록은 소스 문자열과 고정된 qdp metrics.json에 묶임(D7). 비밀은 파일 경로만, dead-man은 연동 없는 수신자(D8). Grafana는 거부하는 자리 표시 주소 192.0.2.1(D9)"
gives_up = "JSON의 주석, 도구 자신의 문법 검사(사람이 바이너리로 돌림), 재시작 지연(시작하자마자 죽는 수집기는 2초마다 다시 접속), 하루 약 500만 행을 넘는 토픽의 L1(4G에서 죽고 뒤 날짜를 막음), 우리 서비스의 메모리·단위 상태 지표(실패한 일일 작업은 systemctl --failed로만)"
revisit = "systemd가 재시작 횟수의 초기화를 문서로 밝힐 때, 아카이버가 4G를 넘는 날이 나오거나 lake_l1_build_lag_days가 생길 때, 우리 서비스의 상태 내보내기가 생길 때, 둘째 거래소를 더할 때"

[[adr]]
id = "ADR-036"
title = "OMS·워처·프로젝터·내보내기의 배치 파일과 워처의 정지 권한"
file = "docs/adr/ADR-036-oms-deployment-files.md"
problem = "OMS, 워처, 프로젝터, 내보내기는 이 PC에서 어떻게 도는지 적힌 단위가 없었고, 런북의 OMS 예시는 Restart=on-failure라 워처가 멈춘 OMS가 사람 없이 돌아오며, 워처의 K3(systemctl stop)를 허락하는 규칙이 없어 늘 실패했다. 저널 마운트가 빠지면 OMS가 빈 새 저널로 시작하고, 킬 마커의 자리도 정해지지 않았다"
alternatives = ["root 워처", "사용자 단위(systemctl --user)", "sudoers 한 줄", "polkit 규칙 하나", "OMS Restart=on-failure와 시작 횟수 제한", "OMS Restart=no, [Install] 없음", "OMS 부팅 때 활성화", "워처를 부팅 때 활성화하지 않음", "워처 부팅 때 활성화", "RequiresMountsFor=만", "Condition…MountPoint", "AssertPathIsMountPoint="]
chosen = "OMS와 워처는 같은 사용자 hloms(소켓 uid 검사), OMS UMask=0027, 프로젝터는 hlobs에 보조 그룹 hloms, 내보내기는 root. oms-node.service: Restart=no, 재시작·감시 키 없음, [Install] 없음, Type=simple, TimeoutStopSec=60(워처 stop_wait_ms 10초와 일부러 다름); 다른 단위는 After=/Before=로만 이름을 씀, oms-node.timer/.socket/.path 없음. watcher.service: Restart=on-failure, RestartSec=5, RestartPreventExitStatus=2, After=oms-node.service만, 부팅 때 활성화(재부팅 뒤 꺼진 OMS를 킬해 남은 주문을 일괄 취소, 사람이 OMS를 띄울 때까지 OmsDown·WatcherKillHaltOwed P1, 늦은 정지 래치를 본 뒤 clear-hold). polkit 규칙 50-hl-oms-watcher-stop.rules: hloms의 oms-node.service stop만 YES. 네 단위 모두 RequiresMountsFor와 AssertPathIsMountPoint=/mnt/nvme/hl-oms-journal, 데이터 디렉터리는 OMS만 씀. 킬 마커는 StateDirectory=hl-oms(0700)의 /var/lib/hl-oms/kill.marker. 격리(NoNewPrivileges, ProtectSystem=strict, ProtectHome, PrivateTmp), OMS·워처 LimitCORE=0. 상한 512M·100M·100M·4G, OMS·워처는 TN 표 8-6a 보호, 슬라이스 MemoryMin=818M. oms-export.service는 일일 작업 잠금 아래 03:30 UTC 타이머, ReadWritePaths는 레이크 trading과 /run/lock. 배치 검사 U20~U24와 U3·U4·U5·U6·U7·U14·U19·P1 확장"
gives_up = "충돌한 OMS가 사람 없이 돌아오는 것(밤의 충돌 뒤 사람이 올 때까지 거래가 멈춤), OMS와 워처의 자격 파일 분리, 저널이 마운트되지 않은 재부팅의 킬(워처도 뜨지 않음), 내보내기 종료 코드 1의 알림(실패한 단위로만 보임), 운영자 설정 파일과 단위의 일치 검사"
revisit = "설치 확인에서 polkit 규칙이 stop을 허락하지 않거나 다른 것을 허락할 때(A-22), 소켓 uid 규칙이 바뀔 때, OMS가 sd_notify를 보내게 될 때, 워처나 프로젝터가 100M에 닿을 때, 둘째 OMS나 둘째 거래소를 이 PC에 둘 때"

[[adr]]
id = "ADR-037"
title = "OMS·프로젝터·저널 알림 규칙과 보류 알림 등급"
file = "docs/adr/ADR-037-oms-alert-rules.md"
problem = "프로젝터가 oms_*, projector_*, journal_disk_free_bytes를 넣지만 읽는 규칙이 없어 OMS가 죽거나 저널 디스크가 차도 스택이 알리지 않았다. 보류 사유는 뜻이 달라(래치, 시작마다 켜지는 unmonitored, 스스로 풀림, 운영자) 같은 P1이면 정상 시작마다 페이지가 오고, oms_holds는 저널의 마지막 상태라 꺼진 OMS의 unmonitored가 30분마다 P1을 되풀이할 수 있었다. MdObsPushDropping은 프로젝터의 손실까지 시세 알림으로 보냈다"
alternatives = ["보류마다 같은 P1", "래치만 P1", "등급 넷(래치, 관문, 지나감, 운영자)", "관문·지나감을 OMS 생존과 무관하게", "관문·지나감만 oms_up = 1일 때", "모든 등급을 oms_up = 1일 때", "OMS가 꺼진 동안 시세 알림 억제", "시세 알림 억제 없음", "프로젝터가 죽으면 OMS 알림을 모두 억제", "프로젝터가 유일한 작성자인 저널 계열 알림만 억제"]
chosen = "oms.rules.json: journal_disk_days_left 기록(레이크와 같은 모양, 1분), 남은 일수 < 7 P2·< 2 P1(10분, 12시간 준비), 거래 거래소마다 JournalDiskGaugeMissing(5분 부재 P2)·OmsDown(30초 동안 oms_up 0, P1, W5 10초보다 김)·ProjectorDown(2분 부재 P2), 한도 넘음 P1·10% 안 P2, parked fill, 프로젝터 자신의 다섯. 보류 등급: 래치 kill_latched|watcher_mismatch|venue_change|reducing|mismatch|storage_low 곧바로 P1, 관문 unmonitored 2분 P1, 지나감 link_down|resync|in_doubt|no_config|venue_setting|account_mode 5분 P1, 운영자 operator_account P3; 관문과 지나감만 OMS가 살아 있을 때(30초 창의 oms_up, 곧 OmsDown이 아닐 때). venues.toml trading = [bybit]. 억제 규칙 둘째: ProjectorDown이 같은 거래소의 P2·P3 JournalDiskGaugeMissing을 막음. OMS가 꺼진 동안 시세 알림은 막지 않음(범위와 다름, Q4). MdObsPushDropping은 service=md-collector만, 프로젝터는 ProjectorObsPushDropping. 배치 검사: 지표 목록에 프로젝터 23개, R6 거래 거래소 셋, R7 저널, R10 억제 둘의 순서·낡은 이름·수집기 패턴, R12 보류 등급, R13 거래 거래소 = 워처 라벨"
gives_up = "프로젝터가 죽은 동안의 스택 쪽 OMS 생존(OmsDown도 울리지 않고 ProjectorDown P2만), 걸린 OMS의 지나가는 보류(OmsDown으로만 보임), OMS 장애 때의 적은 문자(시세 알림을 막지 않음), 운영자 설정 상한(poll_ms, disk_every_ms, export_ms)의 검사"
revisit = "보류 사유를 더하거나 뜻을 바꿀 때, OMS가 스스로 지표를 넣게 될 때, 주간 검토에서 2분·5분이 맞지 않을 때, 둘째 거래 거래소를 더할 때"

[[adr]]
id = "ADR-038"
title = "워처 알림 규칙, OmsDown 억제 규칙, 거래·사건 대시보드"
file = "docs/adr/ADR-038-watcher-alerts-trading-dashboards.md"
problem = "워처가 watcher_* 계열을 넣지만 읽는 규칙이 없어 워처가 죽거나 키가 만료돼도 스택이 알리지 않았다. OMS가 꺼지면 워처의 검사 경과·하트비트·W5 무장 알림이 원인 하나에 함께 울린다. 설계 §8.4의 거래 화면 D1과 사건 타임라인 D4가 없었고, 내보내기 종료 코드 1은 매일 확인 명령에도 없었다"
alternatives = ["OMS가 꺼진 동안 워처 알림을 모두 억제", "OMS를 따라 나빠지는 셋만 억제", "억제 없음", "열린 알림을 Alertmanager에서", "열린 알림을 vmalert의 ALERTS에서", "D4에 모든 이벤트", "두 패널과 뺀 목록으로 나누고 검사가 분할을 지킴", "워처 P1을 규칙 파일에만", "검사가 워처 P1의 식과 등급을 고정"]
chosen = "watcher.rules.json(그룹 watcher 10초): 거래 거래소마다 WatcherDown(watcher_up 1분 부재 P1), 곧바로 P1인 WatcherMismatchActive·WatcherKillActive·WatcherKillHaltOwed·WatcherAuthRejected, P2인 WatcherApiKeyExpiring(< 14일)·WatcherPublicIpNotOk·WatcherCheckStale·WatcherHeartbeatStale·WatcherW5Unarmed·WatcherJournalError·WatcherAlertsFailing·WatcherAlertsDropped. 셋째 억제 규칙: OmsDown이 같은 거래소의 P2·P3 WatcherCheckStale|WatcherHeartbeatStale|WatcherW5Unarmed를 막음. D1 d1-trading(한도와 거리 표, 열린 알림은 ALERTS), D4 d4-events(VictoriaLogs의 주문·체결 19종과 정지·킬·불일치 23종, 뺀 9종, 프로젝터 경고, 알림). D3의 매일 확인 명령에 'oms-export*'. 배치 검사: 지표 목록에 워처 26개, R6 WatcherDown, R7 키 규칙과 워처 P1 넷·P2 일곱, R10 억제 셋, G6 명령, G8 D1·D4와 그 고정 패널(D1 한도 표의 변환 포함), G10 이벤트 종류의 분할"
gives_up = "걸린 OMS 동안 다른 이유로 고장 난 워처 검사의 P2(OmsDown P1만), 재부팅 뒤 OMS를 띄울 때까지 30분마다의 OmsDown·WatcherKillHaltOwed, 워처 export_ms 상한의 검사, D4에서 뺀 9종(하트비트, 기준가 등)과 워처 로그"
revisit = "저널 이벤트 종류를 더할 때, 워처가 VictoriaLogs에 줄을 넣게 될 때, 주간 검토에서 워처 알림의 시간이나 억제 대상이 맞지 않을 때, 둘째 거래 거래소를 더할 때"

[[adr]]
id = "ADR-039"
title = "OMS·워처 합동 프로세스 시험"
file = "docs/adr/ADR-039-oms-watcher-joint-tests.md"
problem = "OMS와 독립 워처는 각자 상대의 가짜에만 대고 시험했고, 두 실제 프로그램을 함께 띄운 시험이 없었다. 저널 파일과 C-TAIL 표, /api/status, admin.sock·monitor.sock, 킬 마커 경로, 같은 거래소 계좌에서 두 프로그램이 실제로 합의하는지 보이지 않았다. 두 바이너리는 각자의 시스템 시계로 돌고, 띄운 바이너리가 실제 Bybit·Telegram·systemctl에 닿으면 안 된다"
alternatives = ["새 crate", "watcher-conformance", "두 라이브러리를 한 프로세스에 링크", "감싸개 바이너리", "시험 안에서 cargo로 워처 빌드", "oms-node 통합 시험 + 기능 joint + xtask joint"]
chosen = "crates/oms-node/tests/joint.rs(기능 joint = failpoints, required-features), 리그 tests/joint_rig/와 상태가 있는 가짜 Bybit tests/bybit_fake/, 가짜 Telegram·VictoriaMetrics·systemctl, loopback만. Oms::start만 oms-node 명령을 만들고 두 배선 변수를 넣음, 워처는 --version이 ' test-endpoints'로 끝날 때만 설정을 받음, 리그 전제 조건 실패는 'joint rig precondition:'. xtask joint: OMS_TEST_DIR 규칙(설정, 절대, git 밖, 58바이트 이하, 없으면 0700으로 만듦), 세 빌드와 복사, 한 번에 시험 하나씩 N번, 실행 판정과 고아 프로세스 검사. verify 기본 묶음 joint. J1은 배포 기본 시간값"
gives_up = "두 프로세스의 주입 시계 하나(실시간과 예산), 실제 systemd·polkit(A-22), 실제 Bybit의 시각과 비동기 일괄 취소, OMS_TEST_DIR 없는 xtask verify의 통과"
revisit = "실제 Bybit testnet의 합동 실행(소유자 허가 뒤), 둘째 거래소의 워처, 두 프로그램이 같은 주입 시계를 받을 수 있게 될 때"
