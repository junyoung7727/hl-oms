chosen = "스레드 oms-alert: 100 ms마다 치명 래치를 먼저 보고, durable_seq가 바뀌었거나 1초가 지나면 공개된 읽기 모델에서 조건(차단 사유의 와일드카드 없는 match, 전략 중지, 불일치 종류별, 증거금 신선도, 게이트웨이 막힘)을 계산해 alert-direct의 set으로. 래치와 운영자 행위는 유예 0, 지나가는 상태는 30초. 치명 알림은 사유와 마지막 내구 seq만, 그 뒤 평가 없음. 종료 전 exit_flush_ms(15초) 전송 대기. 상태 파일 없음. mainnet은 [alert] 없이 시작하지 않음"
