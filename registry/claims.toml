[[claim]]
id = "V-LIVE-1"
statement = "[liveness]에 적힌 전략의 마지막 거래 연결이 닫히거나, 그 전략의 어느 연결에서도 liveness_ms 동안 요청이 없으면(ping도 요청이다), 노드는 다음 hello까지 한 번 Input::Session(Lost)를 넣고, 코어는 strategy_link_lost와 같은 기록에서 그 전략의 걸린 일반 주문 가운데 취소 요청이 없는 것마다 규칙 strategy_link의 취소를 요청한다. 그 전략의 감소 전용 주문과 다른 전략의 주문은 취소하지 않는다. 프로세스에서: a(5,000 ms)와 b가 적혔을 때 a의 연결을 닫으면 거래소에서 a의 일반 주문만 취소되고 a의 감소 전용과 b의 일반 주문은 남는다. ping만 8초 보내면 잃음이 없고, 멈추면 마지막 요청 5초 뒤에서 7초 사이에 잃음이 기록된다. 두 연결 가운데 하나가 닫혀도 잃음이 없고 마지막이 닫히면 있다. 운영 소켓의 hello는 세지 않는다. 한 연결이 다른 전략으로 다시 hello하면 앞 전략에서는 닫힌 연결이다: 그것이 a의 마지막 연결이면 곧바로 last trading connection closed로 잃음이 되고 a의 일반 주문이 취소된다. 노드의 표에서: 정확히 liveness_ms의 침묵은 잃음이 아니고 1 ms 넘으면 잃음이며, 침묵은 마지막 요청이나 마지막 hello부터 잰다. 같은 연결의 두 번째 hello는 연결 수를 다시 세지 않는다"
why = "전략 프로세스가 죽으면 그 호가가 거래소에 남고, 전에는 OMS가 아무것도 취소하지 않았다(설계 R5 SHOULD 7). 한 전략의 죽음이 다른 전략의 주문이나 포지션을 줄이는 주문을 건드리면 안 된다"
level = "단위, 통합"
scope = "코어 시험(H 하네스, 매 입력 재실행 대조), 노드의 표(시간이 입력, 큐는 주입한 함수), 실제 oms-node·simvenue 프로세스 셋(실제 시간)"
real = "oms-core의 결정과 apply, oms-node의 liveness 표, 서버의 연결 처리와 250 ms 타이머, 커밋 단계, 저널, 가상 거래소 프로세스"
simulated = "거래소(simvenue), 전략(시험의 클라이언트), 시간(표 시험에서만 인자)"
faults = "연결 닫힘, 열린 채 침묵, ping만, 두 번째 연결, 운영 소켓의 hello, 다른 전략으로 다시 hello, 경계의 침묵"
criterion = "거래소에 남은 열린 주문의 집합, 저널의 cancel_requested{by: rule strategy_link} 목록, strategy_link_lost 수와 기록된 때(마지막 요청 뒤 5~7초), status.strategies.<s>.link. 넣은 결함과 잡은 시험: 모든 전략의 일반 주문 취소(M162), 감소 전용 취소(M163), ping을 세지 않음(M164), 운영 연결을 셈(M168), 다른 전략으로 hello해도 앞 전략에서 셈(M172), 저장소 밖 mut.py의 경계·시계·닫힘 결함"
tests = ["node-unit/closing_the_last_connection_cancels_that_strategys_plain_orders_only", "node-unit/five_seconds_without_a_request_cancel_and_a_ping_keeps_it_alive", "node-unit/a_second_connection_keeps_the_strategy_alive", "core/a_lost_strategy_gets_cancel_requests_for_its_plain_orders_only", "node-unit/liveness::tests::no_request_for_liveness_ms_reports_a_loss_and_any_request_keeps_it_alive", "node-unit/liveness::tests::the_last_close_reports_one_loss_until_the_next_hello", "node-unit/liveness::tests::two_connections_count_and_only_the_last_close_reports", "node-unit/a_hello_for_another_strategy_loses_the_first_on_that_connection", "node-unit/liveness::tests::a_hello_for_another_strategy_closes_the_connection_for_the_first"]
repro = "cargo test -p oms-node --test liveness; cargo test -p oms-node --lib liveness::; cargo test -p oms-core --test strategy_link"
supports = "C-LIVE L1~L4, ADR-030 §7(U18b3)"
not_covered = "실제 거래소. 취소가 거래소에서 거절되거나 시도가 다한 경우(C-CANCEL의 경로). 노드가 오래 멈췄다 깨어난 경우(단조 시계). 노드가 줄을 읽지 않는 동안(연결의 window나 출력 채널이 가득)은 침묵으로 치므로, 코어나 저널이 liveness_ms보다 오래 멈추면 ping하던 전략도 멈춤이 끝날 때 잃음이 된다. 치명 종료 때 끊기는 연결의 닫힘이 잃음을 큐에 넣을 수 있어, 저널 끝에 전략이 일으키지 않은 strategy_link_lost가 있을 수 있다(다음 hello가 복구한다). 잃음을 큐에 넣었다는 warn 줄은 표의 잠금을 쥔 채 쓰므로, 로그가 느리면 모든 연결의 요청 기록이 그만큼 기다린다"

[[claim]]
