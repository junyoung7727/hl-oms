scope = "마지막 기록의 모든 절단 위치, 임의 크기·배치·절단 위치(property test 64회), 쓰레기·0 꼬리, 중간 비트 반전, 세그먼트 누락, 회전 중 중단. 실제 노드에서 꼬리와 중간 손상 각 1회"
real = "저널 파일(파일을 직접 조작해 손상을 만든다)"
simulated = "장애 자체. 실제 전원 장애가 만드는 파일 모양이 아니다"
faults = "절단, 덧붙은 쓰레기, 비트 반전, 파일 삭제"
criterion = "복구된 기록 수 = 절단 지점 이전에 완전히 들어간 프레임 수. 중간 손상 뒤 파일 내용이 그대로"
tests = ["journal/every_truncation_of_the_last_record_recovers_the_prefix", "journal/recovery_returns_the_longest_valid_prefix", "journal/garbage_and_zero_tails_are_truncated", "journal/damage_in_the_middle_is_refused_and_nothing_is_modified", "journal/a_missing_middle_segment_is_a_gap", "journal/an_incomplete_newest_segment_is_removed_and_preserved", "journal/truncation_can_be_disabled", "journal/damage_in_the_last_record_is_treated_as_an_incomplete_tail", "journal/rotation_keeps_sequences_consecutive_across_segments", "journal/verify_all_reads_without_modifying", "journal/records_are_durable_only_after_sync", "journal/appends_must_be_consecutive", "e2e/journal_damage_is_handled_by_position", "journal/a_foreign_instance_journal_is_refused_without_being_modified", "journal/a_snapshot_newer_than_the_journal_is_refused_without_modifying_it", "journal/a_snapshot_without_any_segment_is_not_accepted_silently", "journal/header_only_newest_segment_is_clean", "journal/stale_and_out_of_order_frames_are_classified_conservatively", "journal/an_incomplete_newest_segment_after_a_snapshot_at_the_boundary_is_set_aside"]
repro = "cargo test -p oms-journal && cargo test -p oms-node --test e2e journal_damage"
supports = "C-JOURNAL"
not_covered = "전원 장애가 실제로 남기는 파일 모양. 마지막 기록만의 손상은 꼬리로 처리된다는 한계를 시험이 고정한다"

