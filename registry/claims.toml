[[claim]]
id = "V-WATCH-11"
statement = "워처의 [telegram]은 token_file 하나만 받고(모르는 키 거부) mainnet은 그것 없이 시작하지 않는다(testnet은 warn 한 줄). 토큰 파일은 설정의 경로 규칙과 자격 파일의 파일 규칙(링크 아님, 일반 파일, 실효 uid 소유, 정확히 0600·0400)을 여는 핸들에 적용하고, 적힌 경로나 가리키는 곳이 git 저장소 안이면 읽기 전에 거부하며, {\"token\": \"<digits>:<[A-Za-z0-9_-]+>\", \"chat_id\": 비지 않은 문자열 또는 정수} 말고는 거부한다. 거부는 내용과 토큰을 인용하지 않고, 실행은 그것을 시작 확인 전에 종료 코드 2로 끝내며 요청을 보내지 않는다. 읽은 값과 설정의 Debug는 토큰을 보이지 않는다. 메시지는 [WATCH P1] bybit {name} {MM-DD HH:MM:SS KST}로 시작하고, split은 각 부분을 3,500 UTF-16 단위 이하로 줄 끝에서(긴 줄은 문자 단위로, 이모지를 쪼개지 않고) 자르며 글자를 잃지 않는다(부분 경계와 맨 앞의 빈 줄은 사라질 수 있고, 빈 부분은 만들지 않는다). Outbox는 50개를 넘으면 가장 오래된 부분을 버리고 세고, 큐가 빈 뒤 알림 하나로 그 수를 알리며, 보내는 중 버려진 부분을 두 번 지우거나 세지 않는다. outcome은 2xx와 ok true만 Delivered, 400·413은 Refused(버리고 셈), 나머지는 Retry(두고 흘려보내기를 끝냄)다. Repeat는 시작 한 번, 300,000 ms마다 최신 문구 한 번, 해소: <시작 문구> 한 번을 낸다. 송신 태스크(alert::spawn, U19b1b)는 경로를 순서대로 써서 네트워크 오류면 다음 경로(DNS 다음 고정 주소)로 가고, HTTP 답이 결정하며, 답한 경로가 다음부터 맨 앞이다. 부분을 순서대로 하나씩 보내고 Retry에서 그 부분을 두고 흘려보내기를 끝낸다. 새 메시지가 Notify로 바로 깨우고, 그 밖에는 흘려보내기가 끝난 주입된 시계 + 5,000 ms에 실행의 틱(Handle::tick)만 깨운다(자기 타이머 없음). 답이 오지 않는 요청은 실제 시간 10,000 ms의 요청 한도에서 실패로 세고 그 부분을 둔다. 로그 줄은 경로와 원인을 적고 토큰과 URL을 적지 않는다. finish(5,000)은 마지막 흘려보내기를 실제 시간 5,000 ms 안에서 하고 남은 부분을 한 줄로 센다. 네 지표(queued, delivered, dropped, failures)가 이것을 따른다. P1 조건(U19b1c): 엔진은 라운드마다 새로 확정한 식별자의 내용을 Action::Confirmed 하나로 그 라운드의 Mismatch보다 앞에 내고 다시 보내기는 내지 않는다. 불일치 P1은 확정마다이고 검사마다 첫 것은 바로, 그 뒤 마지막 메시지에서 60,000 ms에 하나이며 그 사이 확정은 모아(내용 다섯, 각 600 UTF-16 단위, 나머지는 수) 다음 메시지로 간다. Client::auth_stop은 래치를 건 첫 답(retMsg, HTTP 401의 본문)이나 규칙 멈춤의 이유를 바꾸지 않고 들며, 실행은 틱마다 그것과 start::PublicIp(게이지가 0인 이유)를 반복 규칙에 줘서 다시 보내지 않는 답(10010·10003·33004·401 포함)마다 답 뒤의 첫 틱에 하나, 5분마다 하나, 공인 IP는 해소 하나를 보낸다. 송신기는 시작 확인 전에 뜨고(2단계의 키 거부도 알림), 시작 거부는 P1 하나를 보내고 5,000 ms 안에 흘려보낸 뒤 종료 코드 2, 종료는 60초 간격 안에 모인 불일치 메시지를 간격과 상관없이 넣고 U19a 단계 뒤 흘려보낸다. 시작 거부의 이유는 200자로 자른다. 실행의 틱이 송신기의 다시 보내기를 깨운다. [telegram]이 없으면 모든 P1(불일치, 키 거부, 시작 거부)은 warn 한 줄이다. mainnet_confirmed 검사가 [telegram] 검사보다 먼저다"
why = "토큰이 오류·로그·Debug·git 저장소에 나오면 누구나 그 봇으로 운영자 채팅에 쓸 수 있다. mainnet의 워처가 [telegram] 없이 돌면 OMS가 죽었을 때 아무도 모른다(설계 §7.7). 보관함이 새 부분을 버리면 가장 최근의 P1(대개 가장 중요한 것)을 잃고, 400을 다시 보내면 낫지 않는 메시지가 큐를 막으며, 500을 버리면 텔레그램이 잠깐 아플 때 P1을 잃는다. 반복 규칙이 매번 보내면 지속 조건 하나가 채팅을 덮는다. 4,096 UTF-16을 넘는 메시지는 텔레그램이 거부한다. DNS가 막힌 곳에서 고정 경로로 가지 않으면 OMS가 죽었다는 P1이 닿지 않는다. 송신이 자기 실제 시간 타이머로 돌면 수동 시계 시험이 간격을 증명하지 못하고, 종료가 한도 없이 기다리면 워처가 멈추지 않는다"
level = "단위(순수 함수, 파일 시스템)와 통합(runtime::run과 송신 태스크, loopback 가짜, 실제 시간)"
scope = "watcher::alert의 순수 부분, Config::from_toml, creds::load_token과 token_file_rules(시험 디렉터리 OMS_TEST_DIR의 파일, 링크, FIFO, .git 디렉터리와 worktree의 .git 파일), runtime::run의 시작(http-fake), alert::spawn의 송신 태스크(런타임 없이, http-fake와 dead_addr, telegram.invalid의 고정 경로), U19b1c의 P1 조건(엔진 rig와 수동 시계, Start·IpCheck를 손으로, 클라이언트는 http-fake)과 runtime::run의 연결(loopback 텔레그램 가짜, 수동 시계와 실제 시계): 시험 29개"
real = "워처의 alert(Token, message, kst, split, Outbox, outcome, Repeat, Route, spawn, Handle, Task, MismatchNotices, Alerts, mismatch_text, auth_text, public_ip_text, refusal_text), engine::Action::Confirmed, rest::Client::auth_stop, start::PublicIp, config, creds, runtime::run, Endpoints::of"
simulated = "텔레그램(http-fake, 평문 http; 고정 경로는 telegram.invalid를 가짜 주소로; 실행 시험은 Route::direct 하나), Bybit(http-fake, 시작 거부 시험만), 시계(분할·보관함·반복은 시각 인자, 송신 태스크는 수동 시계와 시험이 부르는 틱, 실행 시험은 수동 시계와 실제 100ms 틱)"
faults = "정확히 3,500 단위와 하나 넘음, 한글 3,500자, 이모지 1,751개, 한 단위 남고 이모지, 8,000자 한 줄, 정확히 두 부분인 줄, 섞인 긴 텍스트, 부분 경계와 맨 앞의 빈 줄, 경계의 줄바꿈; 51번째 부분, 보내는 중 넘쳐 버려진 부분의 전달과 거부, 알림을 보낸 뒤의 새 버림; 200·ok false·400·413·401·429·500·502·읽을 수 없는 본문; 5분 전·5분 정각·해소·다시 시작; 그룹·다른 사용자·실행·set-id 비트, 다른 소유자, 링크, 디렉터리, FIFO, 없는 파일, 데이터 디렉터리 안(링크로 가린 경우도), 상대 경로, .., 저장소 안(.git 디렉터리, worktree의 .git 파일, 저장소를 가리키는 링크), 객체 아닌 JSON, 형식이 틀린 토큰, 빈·소수 chat_id, mainnet에 [telegram] 없음, 모르는 키, 0640 토큰 파일로 시작; 연결 거부되는 첫 경로, 두 경로 모두 연결 거부, 500·502 뒤 200, 400과 버림 알림, 기한 1 ms 전의 틱과 틱 없는 시계 이동, 종료 때 남은 부분, 답하지 않는 텔레그램의 요청 한도와 그때의 종료. 한 라운드에 두 식별자 확정, 계속 보는 라운드, 해제 뒤 다시 보내기, 사라졌다 돌아온 식별자, 60초 1 ms 전과 정각, 두 검사, 시계가 뒤로 감, W4 확정 300개와 600 단위 넘는 내용, 이름 64자; 10010·10003·33004·10004(여러 줄 retMsg)·HTTP 401, 뒤의 규칙 멈춤, 규칙 멈춤 먼저; 목록 밖 주소, 재확인의 맞는 주소와 query-api 502; 시작 2단계의 10010과 텔레그램 500 뒤 다시 보내기, 마스터 키 시작 거부(답하는 텔레그램, 답하지 않는 텔레그램, [telegram] 없음), 실행 전체의 남의 주문, 60초 안의 두 번째 확정 뒤 종료([telegram] 있음과 없음), 300자 시작 거부 이유. 변이 M255~M264와 시험 밖 변이 17개(U19b1a), 19개(U19b1b), 16개(U19b1c; 첫 실행 15개, 놓친 하나는 시험을 더해 잡음)와 5개(U19b1c 리뷰 1)"
criterion = "각 부분은 3,500 단위 이하이고 비지 않으며, 줄바꿈을 뺀 내용이 원문과 같고 정한 곳에서 잘린다(경계와 맨 앞의 빈 줄은 빈 부분이 되지 않는다). Outbox의 순서·len·dropped·dropped_total과 알림 문구가 정한 값이다. outcome이 정한 부류와 문구를 낸다. Repeat가 정한 시각에만 정한 문구를 낸다. 설정과 토큰 파일의 거부 줄은 정한 이유를 담고 토큰·내용을 담지 않으며 한 줄이다. 받는 파일은 정한 Token이 된다. 거부된 토큰 파일로 시작한 실행은 종료 코드 2, error 줄 하나, 요청 0개다. testnet에 [telegram]이 없으면 warn 줄이 정확히 하나다. 송신 태스크 시험: 가짜가 받은 요청의 수·순서·경로·본문, next_flush의 값, 네 지표의 값, 로그 줄에 토큰이 없음, finish의 반환값과 그 줄, 답하지 않는 가짜에서 finish(5,000)이 4.9~7초에 돌아옴, 답하지 않는 가짜에 보낸 요청이 9.5~13초에 실패 하나(원인 timed out)와 next_flush를 남김. U19b1c: Confirmed의 수·순서·내용, MismatchNotices가 정한 시각에만 정한 문구, auth_stop의 code·http·text, 가짜 텔레그램이 받은 sendMessage의 수와 문구(정확히 하나, 반복은 5분 뒤), 시작 거부의 종료 코드 2 전 메시지 하나와 답하지 않는 텔레그램에서 4.5~9초, [telegram] 없을 때의 warn 줄 수(불일치는 내용까지), 종료 뒤 가짜가 받은 불일치 메시지 둘, drain 뒤 빈 MismatchNotices, 시작 거부 문구의 200자"
tests = ["watcher/a_confirmation_emits_one_confirmed_action_per_identity", "watcher/mismatch_notices_are_at_most_one_per_check_per_60_s_and_collect_the_rest", "watcher/an_auth_answer_sends_one_watch_p1_at_once", "watcher/public_ip_ok_0_sends_one_watch_p1_and_a_clear", "watcher/a_confirmed_mismatch_sends_one_watch_p1", "watcher/auth_stop_keeps_the_first_text", "watcher/a_key_rejected_at_start_is_told_on_telegram", "watcher/a_start_refusal_after_the_sender_is_up_sends_one_watch_p1", "watcher/a_confirmed_mismatch_is_told_on_telegram_once", "watcher/a_mismatch_collected_inside_the_pace_is_sent_at_shutdown", "watcher/mismatch_notices_drain_tells_what_the_pace_holds", "watcher/the_start_refusal_reason_is_cut_to_200_characters", "watcher/a_recheck_that_fails_a_start_rule_stops_every_bybit_request", "watcher/a_network_error_moves_to_the_pinned_route", "watcher/the_token_is_never_in_a_log_line", "watcher/the_sender_task_flushes_on_the_manual_clock", "watcher/a_retry_keeps_the_part_for_the_next_flush", "watcher/shutdown_flushes_within_5_s_and_counts_the_rest", "watcher/set_queues_what_the_repeat_rule_gives", "watcher/a_request_without_an_answer_fails_after_10_s", "watcher/messages_split_at_3500_utf16_units_at_line_ends", "watcher/the_outbox_keeps_50_parts_and_reports_the_drops_once", "watcher/answers_400_and_413_drop_the_part_and_other_answers_keep_it", "watcher/the_repeat_rule_sends_start_every_5_min_and_clear", "watcher/the_token_is_never_in_debug", "watcher/a_message_has_the_watch_p1_header_with_the_name_and_kst", "watcher/telegram_is_validated_and_required_on_mainnet", "watcher/the_token_file_must_be_owner_only_outside_any_repository", "watcher/a_start_refusal_ends_the_run_with_exit_code_2", "watcher/the_config_is_validated_and_mainnet_needs_confirmation"]
repro = "cargo test -p watcher --test alert --test config --test creds --test runtime --test engine --test client"
supports = "C-WATCH 10부, ADR-032"
not_covered = "실제 텔레그램, 실제 DNS, 실제 TLS(고정 경로의 SNI와 인증서)에 보낸 적이 없다. 리디렉션을 따르지 않는 것은 시험하지 않았다. 송신 태스크 시험은 실제 시간을 기다린다(경계 있는 대기, 종료 시험 약 5초, 요청 한도 시험 약 10초). 연결 한도(3초)는 loopback에서 막힌 연결을 만들 수 없어 시험하지 않았다. 종료 한도에서 태스크를 abort하는 것은 시험하지 않았다(시험의 런타임이 바로 끝나 차이가 보이지 않는다). 토큰 파일의 저장소 검사는 조상 디렉터리의 .git만 본다(GIT_DIR·core.worktree로 둔 저장소, 읽을 수 없는 디렉터리는 보지 못함). root로 돌면 권한 시험은 일찍 끝난다. 시험 디렉터리(OMS_TEST_DIR 또는 임시 디렉터리)의 조상에 .git이 있으면 토큰 파일 시험은 저장소 규칙 하나만 보고 끝난다(M260은 거기서 살아남는다; CI의 /tmp와 실행기의 /mnt/nvme/gitproject/.cargo-target 아래는 해당하지 않음). chat_id가 틀리면(텔레그램 400 chat not found) 모든 부분과 버림 알림이 Refused로 세어질 뿐 사람에게 닿지 않는다(C-WATCH 10부 알려진 한계). U19b1c: 송신 태스크가 먼저 끝났을 때의 error 줄(그 길을 만들 수 없음), 흔들리는 반향의 public_ip 시작·해소 쌍의 수(반복 규칙이 묶지 않음, C-WATCH 10부), 실행 시험의 실제 시간 대기(약 3~6초). 배달 뒤의 시간 초과는 같은 부분을 두 번 보낼 수 있다(잃는 것보다 낫다). 시험 없음: 재확인의 규칙 멈춤은 watcher_public_ip_ok를 0으로 두지만 Start·IpCheck·실행이 나눠 쓰는 PublicIp 칸은 바꾸지 않아, 그 사건은 auth P1 하나만 알린다. retCode 10004의 retMsg는 서명한 문자열(origin_string[<timestamp><api_key>…])을 담으므로 auth P1이 그 200자 안의 API 키 아이디를 텔레그램에도 보낼 수 있다(비밀은 담지 않는다). 잠금이 독이 들면(Client::auth_stop, PublicIp::get) None으로 읽혀 public_ip에 거짓 해소가 가고 auth의 반복이 멈춘다(잠금을 쥔 채 패닉하는 길은 찾지 못했다). 재확인이 반향 실패 뒤 규칙 멈춤으로 끝나면 PublicIp 칸이 더 바뀌지 않아, 재시작까지 auth와 옛 이유의 public_ip P1이 각각 5분마다 간다. 불일치 메시지는 내용을 '; '로 잇는데 내용 자체도 '; '를 담아 채팅에서 경계가 잘 보이지 않는다(읽기만의 문제). 텔레그램이 안 되는 동안 로그 줄이 흘려보내기마다(5초마다) 경로 수만큼 나온다(경로 둘이면 시간당 약 1,440줄). 주입된 시계가 뒤로 가면 다음 흘려보내기(next_flush)가 그만큼 늦다(새 메시지는 바로 간다). 종료 한도에 끊긴 요청은 텔레그램이 이미 받았을 수 있고(로그는 그 부분을 버렸다고 센다), 첫 경로의 연결이 3초 막히면 두 번째 경로에 남는 종료 한도는 약 2초다. 새 메시지는 언제나 송신 태스크를 깨우므로 남은 부분은 5,000 ms 간격이나 429의 retry_after보다 일찍 다시 가고, 그 빈도는 부르는 쪽의 빈도로 묶인다. 시험 없음: alert::spawn은 경로가 없으면 Err이고, 실행은 [telegram]이 있는데 경로가 없으면 종료 코드 2로 끝난다. 시험 없음: 빈 텍스트의 split은 빈 부분 하나를 주므로 Outbox::add('')는 빈 부분 하나를 넣고(텔레그램이 400으로 거부한다고 본다), 송신 태스크는 빈 텍스트로 add를 부르지 않는다. 불일치 알림의 간격과 반복 규칙도 원래 시계를 읽어, 시계가 Δ만큼 뒤로 가면 다음 메시지가 Δ만큼 늦다(새 메시지는 바로 간다)"

[[claim]]
id = "V-WATCH-12"
statement = "워처의 서명된 POST는 Client::cancel_all 하나뿐이다: 경로 /v5/order/cancel-all과 본문 {\"category\":\"linear\",\"settleCoin\":\"USDT\"}는 상수이고, 서명은 timestamp + api_key + recv_window + 보내는 본문의 바이트 위에 하며(거래소의 POST 예와 독립 HMAC 값), 머리글 다섯과 Content-Type application/json을 달고, 요청 제한·403 멈춤·키 래치를 지나며 보내기 전에 watcher_requests_total에 센다. 답은 success가 없거나 \"1\"이면 result.list의 길이, \"0\"이면 refused, 목록이 아니거나 다른 값이면 unreadable이다. crates/watcher/src의 글자에는 .post(가 rest.rs·metrics.rs·alert.rs에 하나씩만 있고 Method::·.request(·.put(·.patch(·.delete(는 없다. [kill]은 round_ms·watch_ms·watch_every_ms·notice_ms를 OMS의 kill_* 기본값과 범위로 받고, 그것이 있으면 시작 2단계와 재확인은 readOnly 0(정수), ContractTrade의 Order, 어느 목록에도 Withdraw 없음을 요구한다(시작은 종료 2, 재확인은 재시작까지 모든 Bybit 요청과 일괄 취소를 멈춤). 읽히는 규칙 하나가 맞지 않으면 다른 필드나 목록을 읽을 수 없어도 거부하고, 읽히는 규칙이 모두 맞는데 읽을 수 없는 것이 있으면 시작은 5초 뒤, 재확인은 ip_check_ms 뒤 다시 묻는다(재확인 실패, 멈춤 아님). [kill]이 없으면 그것을 읽지 않는다. Dec::percent_floor는 0.01 %로 내리고 넘치면 None이다. 킬 알림의 포지션 묶음은 기호마다 방향·수량·미실현손익·마크·마크에서 강제청산가까지의 거리(내림)를 적고, 청산가가 비었거나 0이거나 마크가 0 이하면 모름, 크기 0인 행은 빼고 크기를 읽을 수 없는 행은 수량 모름으로 보이며(포지션 없음이라 하지 않음) 20행 뒤는 수로 센다. 포지션 읽기는 5쪽까지, 읽기 시작 + request_timeout_ms + 11,000 ms의 기한 때나 뒤에 답한 쪽에서 끝내고 다음 쪽을 보내지 않으며, 래치나 멈춤이면 묻지 않는다. 알림 문구는 워처 킬로 시작하고, 마지막 알림의 줄은 StopOutcome 다섯을 따르며 래치와 경로를 확인한 마커의 멈춤만 clear-hold를 말하고, 키 래치와 403 멈춤의 진행 문구는 정한 줄이며, 중단 알림은 포지션 조회 안 함(워처 종료 중)으로 끝난다. sans-IO KillLoop(U19b2b)는 보낸 모든 일괄 취소 뒤(실패해도) 세고, 보내지 않은 것 뒤에는 세지 않고 다음 라운드를 기다리며, 세기 오류는 0이 아니고, n > 0이면 t_r + round_ms까지 기다리며, 첫 0의 z부터 watch_every_ms마다 세어 z + watch_ms 때나 뒤에 낸 세기의 0에서만 끝난다(지켜봄의 늦은 주문은 곧바로 일괄 취소, C5에 들어올 때마다 새 z, watch_ms가 watch_every_ms의 배수가 아니어도 마지막 세기는 z + watch_ms, 지켜봄의 늦은 주문이 연 라운드는 그 세기의 시각에 시작). 두 번째 start는 아무것도 하지 않는다. 요청 둘이 함께 열리지 않고, 어느 [t, t + 1,000) ms에도 일괄 취소를 둘 넘게 내지 않으며(설정에 맞는 타이밍에서는 예산이 잡지 않고 두 일괄 취소가 1,000 ms보다 가깝지 않다), 요청의 기한은 낸 시각 + request_timeout_ms + 11,000 ms이고 세기는 기한 전에 답한 쪽마다 그것을 옮기며, 기한 때나 뒤의 답·쪽은 기한 뒤(세기 오류, 일괄 취소 Failed)이고 그 뒤의 같은 req_id 답과 쪽은 버리며(버린 세기의 쪽은 지금 열린 세기의 기한을 옮기지 않는다), next_wake는 기한·라운드·지켜봄·예산의 시각과 다음 진행 표시 중 가장 이른 것이다. 알림은 시작, 시작에 묶인 notice_ms 표시마다 진행 하나(건수가 같아도; 바뀐 건수의 알림은 없다), 끝에서 곧바로 마지막, 중단 하나와 끝이고, 10분 동안 조회가 실패해도 600초 창마다 12개 이하(시작 1 + 진행 10 + 마지막 1)다. U19b2c의 세기는 /v5/order/realtime linear USDT의 모든 쪽을 W1의 쪽 규칙으로 20쪽까지 읽고(20쪽째에도 커서가 있으면 세기 오류), orderStatus가 New·PartiallyFilled·Untriggered인 행을 orderLinkId와 상관없이 세며(남의 주문도), orderStatus가 없거나 읽을 수 없는 쪽은 세기 오류다. 세기 태스크는 루프가 그 세기를 낸 시각(첫 실행이 아님), 그 뒤 쪽마다 답한 시각 + request_timeout_ms + 11,000 ms의 기한을 스스로 지켜 기한 때나 뒤에 답한 쪽 뒤에는 묻지 않는다. 일괄 취소가 나갔는지는 보내기 전 상태로 가린다(래치 NotSent(Latched), 403 멈춤 동안 NotSent(Paused)이고 멈춤이 끝나면 다시 보냄, 연결 못 함 NotSent(Local), 그 밖은 Failed). kill::Inflight는 루프의 요청마다 태스크 하나를 돌리고 루프의 기한(open_request) 때나 뒤에, 또는 루프가 버린 요청이면 곧바로 끊고 그 태스크가 보낸 것을 루프에 주지 않으며, 새 요청 전에 산 태스크를 끊고, Inflight가 사라질 때 모두 끊는다. http-fake와 수동 시계의 시험 장치에서 일괄 취소 뒤 한 건이 남거나 5xx가 와도 루프는 0을 확인할 때까지 되풀이하고 어느 [t, t + 1,000) ms에도 일괄 취소가 거래소에 둘 넘게 닿지 않는다. 킬 알림의 초는 ms를 정확히 쓴다(12,500 → 12.5). cancel_all_calls는 일괄 취소의 답(Done·Failed, 기한 뒤 포함)에서 세고 버린 늦은 답은 세지 않는다. 세기 태스크는 기한 전에 돌아온 쪽 요청마다 on_page를 부르고, 클라이언트가 보내지 않은 요청(래치, 멈춤)도 한 쪽으로 알린 뒤 그 오류를 세기 결과로 준다"
why = "일반 POST가 있으면 Order 권한을 가진 워처 키가 주문을 낼 길이 생긴다. 서명한 바이트와 보낸 본문이 다르면 거래소가 서명을 거부해 OMS가 사라진 때의 일괄 취소가 나가지 않는다. 읽기 전용이거나 Order가 없는 키는 킬 때에야 실패하고, 출금 권한이 있는 키는 워처가 털리면 돈이 나간다. 강제청산가까지의 거리를 올림하거나 빈 청산가를 0으로 읽으면 사람이 위험을 작게 본다. 끝나지 않는 포지션 읽기는 킬 알림을 막는다. 실패한 일괄 취소 뒤에 세지 않으면, 미체결이 없을 때 일괄 취소를 거부하는 거래소에서 루프가 끝나지 않는다. 실패한 세기를 0으로 읽거나 첫 0이나 늦은 답에서 끝내면 늦게 접수된 주문이 남는다. 예산이 없으면 바뀐 길이 초당 여러 번 일괄 취소를 보내고, 기한이 없거나 쪽이 옮기지 않으면 걸린 요청이 루프를 멈추거나 긴 세기가 실패한다. 바뀔 때마다 알리면 10분에 12개를 넘는다. 남의 주문을 세지 않으면 수동 주문을 남긴 채 끝나고, 늦은 쪽 뒤에 묻는 세기는 끊기 전에 요청을 하나 더 보내며, 기한에 끊지 않으면 걸린 요청 옆에서 다음 요청이 돌아 요청 제한을 쓰고, 보낸 뒤의 오류로 보냄을 가리면 보내지 않은 일괄 취소를 보낸 것으로 센다"
level = "단위(순수 함수)와 통합(실제 Client, loopback 가짜, 수동 시계); 루프는 sans-IO 상태 기계(손으로 준 시각, 시드 무작위 답 순서); 세기·Inflight·시험 장치는 통합(실제 Client와 tokio 태스크, loopback 가짜, 수동 시계, 실제 시간으로 기다린 뒤에만 시계를 옮김)"
scope = "watcher::sign의 POST 서명, rest::Client::cancel_all(http-fake), crates/watcher/src의 소스 글자, config::Kill, start::Start와 IpCheck의 [kill] 키 규칙(손으로와 http-fake), decimal::Dec::percent_floor, kill::notice_text·position_block(순수), kill::read_positions(http-fake, on_request로 수동 시계를 옮김); kill::KillLoop(sans-IO, 손으로 몬 순서와 시드 xorshift 답 순서 10,000개 × 두 타이밍): 시험 35개; kill::count_open, cancel_answer, Inflight, KillLoop::open_request·arrived(http-fake, tests/common/kill_rig.rs): 시험 10개 더. 시험 장치는 수동 시계, 실제 Client, 경로마다 정한 http-fake 답을 쓰고, 걸음마다 abort_due → poll → 낸 요청 시작(태스크가 열려 있으면 시험 실패) → 열린 요청이 낼 것을 실제 시간 5초 안에 기다림(넘으면 실패) → 시계를 min(next_wake, now + 100)으로 옮기며, 걸음 상한은 20,000이다"
