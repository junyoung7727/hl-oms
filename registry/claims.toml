not_covered = "멈춤은 셸 스크립트로만, 마커 쓰기는 시험 디렉터리에서만 돌았다. 16개를 넘게 기다리는 알림의 버리기는 단위 시험(runtime::tests)만 보고 실행 시험은 보지 못한다(설정 범위에서 큐가 16에 닿지 않음). 기다리던 메시지를 틱 전에 다루기는 실행 시험이 보지 못한다(경쟁의 창을 좁힐 뿐). 킬 중 엔진 멈춤 때문에 래치된 OMS가 30초 뒤 hold:unmonitored를 내는 것은 진짜 OMS로 보지 않았다. 마커 쓰기를 거는 진짜 디스크와 정전 뒤 마커가 남는지(sync_all)는 시험하지 않았다(정전을 흉내 내지 않음). 코어가 걸리고 HTTP 태스크가 답하는 OMS는 W5가 보지 못한다(소유자 질문 11). 진짜 systemctl과 그 권한(U20b가 주는 그 단위 하나의 stop), systemd가 클라이언트를 죽인 뒤에도 멈춤 작업을 끝내는지, 워처가 진짜 OMS 프로세스를 멈춘 적은 없다(U20b와 testnet). 실제 OMS의 admin.sock에 watcher_kill을 보낸 적이 없다(시험의 UnixListener; OMS 쪽 규칙은 U18b1의 시험). 시계가 뒤로 간 걸음과 다음 읽기 사이의 진행은 Steady가 걸음에 묻는다(최대 한 틱). 틈 규칙의 한계 4,000 ms는 판단이고 실제 부하에서 재지 않았다. 종료 때 K1의 결과를 기다리는 것과 main.rs의 shutdown_timeout(1,000 ms)은 시험하지 않았다(K1은 시험 디렉터리에서 곧 끝나고, 걸린 디스크를 흉내 내지 않음). 거부 전의 watcher_kill을 기다리는 동안 킬을 멈추는 것(그동안 킬의 재시도가 둘째 연결을 열지 않음)은 실행 시험이 보지 못한다(그 몇 초 안에 킬이 무언가를 내는 경우를 만들지 않음); 거부가 킬 자신의 K2를 기다리는 것(둘째 연결 없음)과 그 기한은 본다. W5의 빚진 정지의 답을 그 id로 가리는 것은 시험이 가리지 못한다(기한에 끊긴 빚진 정지의 답이 채널에 남은 채 다음 것이 시작될 때만 뜻이 있음). OMS를 기다리는 동안의 탐침 답을 마커 경로로 보지 않는 것은 실행 시험이 가리지 못한다(그 시험에서 킬 중 W5는 탐침을 보내지 않음). 600초 시험은 메시지 수만 보고 포지션 묶음의 문구는 보지 않는다(빠른 시계에서 읽기가 시간 초과일 수 있음). silence_ms의 한계는 결함 하나(잃은 탐침 하나, 또는 틈보다 짧은 멈춤 하나)만 막으므로, 둘이 겹치거나 OMS의 답이 request_timeout_ms에 가까운 채 멈춤이 거듭되면 건강한 OMS를 킬할 수 있다. 워처가 새 킬 마커를 쓴 바로 뒤에 온 운영자의 clear_hold kill은 그 마커를 지우고, 시작·마지막 알림은 워처가 볼 때 마커가 있었는지만 말한다. 머리와 마커 문구의 마지막 정상 응답은 원래 시계 − silent_ms라 틈 뒤의 킬에서는 실제보다 늦은 시각을 말한다(W5가 센 침묵의 시작으로 읽는다). 하드 링크를 지원하지 않는 파일 시스템(일부 FUSE·SMB 마운트)에서는 킬마다 마커 쓰기가 Failed이고 마커가 없으므로, 마커는 보통의 로컬 파일 시스템에 두어야 한다. 마지막 알림의 포지션 읽기는 Ended 뒤라 엔진의 라운드와 같은 요청 가드를 나눈다. 403 멈춤의 끝은 원래 시계라 그 멈춤 중에 시계가 Δ만큼 뒤로 가면 멈춤이 Δ만큼 길어지고, 킬 경로는 그 끝을 Steady와 견주므로 마지막 Δ 동안 클라이언트를 불러 보내는 것 없이 Paused·NotRead 대신 Failed·Local·조회 실패로 보인다. marker_checked와 answered는 이 프로세스에서 본 것만이고 쏠 때 Setup에 옮겨 적으므로, 시작의 상태 답보다 먼저 쏜 킬은 그 킬 동안 시작의 답이 규칙을 지나도 끝까지 경로 확인 못 함이고 정지를 빚진다. 10분 12개 상한은 루프의 킬 알림만 센다: 지속 조건(auth, public_ip, marker_path)은 각각 1 + ⌊T / 5분⌋ 이하를, 빚진 정지는 루프 동안 1 이하나 루프 뒤 2 이하를 더하고(둘이 함께는 없음), 종료 때 기다리던 알림은 한꺼번에 간다(16개 큐보다 많지 않음). [kill]이 없으면(testnet만) W5가 꺼져 워처는 OMS를 멈추지도 그 침묵을 알리지도 않고, OMS 자신의 모니터링 게이트와 관측 스택만 남는다. 시작 확인이 다시 묻는 동안(쓸 수 있는 답이 없으면 5,000 ms마다, HTTP 403 뒤에는 600초 뒤) W5는 무장되지 않고 워처가 시작에 걸렸다는 P1도 없어, 그때 죽은 OMS는 워처 쪽에서 아무도 알리지 않는다(watcher_w5_armed = 0만 보인다). 거부가 기다린 watcher_kill이 킬 자신의 K2이고 그것이 래치하면 그 답을 Kill에 주지 않으므로, 중단 알림의 머리는 OMS 정지: 진행 중이고 바로 뒤의 거부 P1은 늦은 정지: latched라 서로 어긋난다(거부 P1이 맞다). 거부가 watcher_kill을 기다리는 동안 SIGTERM이 오면 그 watcher_kill의 결과는 로그에도 메시지에도 남지 않고, W5의 빚진 정지가 나가 있는 동안의 SIGTERM도 늦은 정지와 늦은 정지 실패 어느 것도 보내지 않는다. 루프 뒤 빚진 watcher_kill이 계속 실패하면 정상 탐침 답마다(기본 1초) 다시 보내고 그때마다 로그 두 줄을 쓴다: P1은 첫 실패의 하나뿐이지만 로그는 사람이 손볼 때까지 초당 약 두 줄씩 는다(속도 제한 없음)"

