[[claim]]
id = "V-HOLD-6"
statement = "킬 래치·워처 불일치·거래소 변경의 상태 필드, Boot의 kill_marker, 워처 입력과 새 이벤트 셋은 기록 스키마를 올리지 않는다: 비어 있으면 쓰지 않아 옛 상태의 바이트가 그대로이고, 이들이 든 저널은 라이브 상태로 복구되며 verify --re-decide를 통과한다. 상태 스키마는 2로 올랐다: U18b 전의 스냅샷(상태 스키마 1, venue_change 없음)은 사유와 함께 건너뛰고 저널을 처음부터 재생해, 거래소 변경 보류가 스냅샷의 유무에 따라 달라지지 않는다. 이벤트 필드 표는 새 이벤트의 모든 필드를 적는다. 알림 조건 hold:kill_latched·hold:watcher_mismatch·hold:venue_change는 유예 0이고, 킬 문장은 출처·메모·확인 상태를 담으며, 워처 불일치와 거래소 변경의 문장은 증거금 정책이 있을 때만 감소 전용을 받는다고 말하며, Alerts::notice는 접두어를 붙여 한 번 보낸다. [kill] marker는 절대 경로, 데이터 디렉터리 밖, 읽을 때 디렉터리가 있어야 하고, mainnet은 그것 없이 시작하지 않는다"
why = "기존 저널은 읽히고 기존 시험의 기대값이 바뀌지 않아야 하며(스펙 완료 기준), 복구한 보류가 스냅샷의 유무에 따라 달라지면 안 되고(리뷰 S3), 워처(U19a)는 필드 표만으로 만든다. 래치는 사람에게 곧바로 알려야 한다(C-ALERT)"
level = "단위, 통합"
scope = "저널 하나를 쓰고 복구·재결정, 필드 표 대조, 알림 조건 표와 loopback 가짜 텔레그램, 설정 검증"
real = "oms-node 복구와 verify, 알림 스레드와 alert-direct(loopback HTTP), 설정 읽기"
simulated = "텔레그램(http-fake), 거래소 입력(시험이 넣음)"
faults = "옛 상태, 상대 경로, 데이터 디렉터리 안의 마커, 없는 디렉터리, mainnet에 [kill] 없음"
criterion = "RECORD_SCHEMA = 2, STATE_SCHEMA = 2, 다이제스트 같음, 재결정 통과, 직렬화에 필드 없음, 건너뛴 스냅샷의 사유와 재생한 기록 수, 필드 표의 행, 알림 문장의 부분과 유예, 설정 오류 문장. 넣은 결함과 잡은 시험: 킬 알림이 지나가는 상태의 유예를 기다림(M140, alerts::tests::every_hold_reason_has_a_text_and_the_grace_of_the_table)"
tests = ["node-unit/kill_holds_liveness_and_heartbeats_recover_to_the_live_state", "node-unit/a_snapshot_of_state_schema_1_is_skipped_and_the_journal_replays_the_venue_change", "node-unit/alerts::tests::the_plain_only_hold_texts_follow_the_margin_policy", "core/the_field_table_lists_every_field_the_encoder_writes", "node-unit/alerts::tests::every_hold_reason_has_a_text_and_the_grace_of_the_table", "node-unit/a_kill_latch_is_told_at_once_and_a_notice_goes_out_once", "node-unit/config::tests::the_kill_marker_is_validated_and_required_on_mainnet"]
repro = "cargo test -p oms-node --test record_schema --test alerts; cargo test -p oms-node --lib alerts:: config::; cargo test -p oms-core --test event_fields"
supports = "C-HOLD의 상태와 알림, C-TAIL 필드 표, C-ALERT 조건 표, ADR-030 §7"
not_covered = "실제 텔레그램. 실행 파일 단위의 mainnet 시작 거부(설정 검증 함수만)"

[[claim]]
id = "V-KILL-1"
statement = "Bybit 게이트웨이는 개인 스트림의 마지막 생존 증거(구독 확인, pong, 시작 확인의 첫 통과) 뒤 kill_after_ms가 지나도록 연결이 내려가 있으면 끊김 하나에 한 번 StreamLost를 보내고, 코어는 래치가 없으면 hold_set{kill, source: stream}과 Kill 명령을 한 기록으로 낸다. 마지막 pong 전에는 걸리지 않고, ping에 답하는 조용한 스트림, 기한 전에 다시 구독된 연결, 시작 확인 전의 끊김, 코어 큐를 기다린 시간은 킬을 부르지 않는다. 프로세스에서: 반쯤 열린 개인 스트림(ping 1초, kill_after 10초)은 마지막 pong 9초 뒤에는 디스크에 hold_set이 없고 11초까지 하나 있으며, 가짜 거래소의 첫 일괄 취소는 그 기록이 이미 저널 파일에 있을 때 온다. 다시 시작해도 래치가 남고, 새 프로세스의 루프가 끝나기 전 clear-hold는 kill_unconfirmed로 거절되며 끝난 뒤 받아들여지고 일반 주문이 다시 받아진다. StreamLost의 detail은 스트림이 마지막으로 끝난 이유를 담는다"
why = "Bybit에는 거래소 쪽 dead-man이 없어 OMS가 체결·주문 통보를 잃은 채 주문을 걸어 둘 수 있다. 확인하지 않은 계좌로 일괄 취소를 보내면 안 되고(시작 확인 전 무장 금지), 느린 코어를 끊김으로 읽으면 안 된다"
level = "단위, 통합"
scope = "게이트웨이 시험 다섯(가짜 WS·http-fake, 실제 짧은 tokio 시간), 코어 시험 하나, 실제 oms-node 프로세스 하나(가짜 Bybit WS·REST, 재시작 한 번)"
real = "Bybit 게이트웨이(스트림 루프, health_poll 감시, 시작 확인), oms-core, oms-node 프로세스(커밋 단계, 저널, 운영 소켓)"
simulated = "Bybit 개인·공개 스트림(가짜 WS 서버), REST(http-fake), 끊김의 모양(시험이 pong을 멈추거나 소켓을 닫음)"
faults = "반쯤 열린 연결, 닫힌 소켓, 기한 전 재연결, 시작 확인 실패, 코어 큐가 가득 참, 루프 도중 프로세스 종료"
criterion = "StreamLost가 나온 시각(마지막 pong 기준 창), 나오지 않음, hold_set의 출처와 메모, 가짜 거래소가 첫 일괄 취소를 받는 순간 읽은 저널 파일의 킬 이벤트(http-fake on_request), 재시작 뒤 holds, clear-hold의 응답. 넣은 결함과 잡은 시험: 연결이 내려간 때부터 잼(M141), 큐 대기 보정 없음(M142), 시작 확인 전 무장(M143), 끊김을 무시하는 코어(저장소 밖 mut.py stream-lost-ignored)"
tests = ["node-unit/the_kill_fires_kill_after_the_last_pong_and_not_before", "node-unit/a_quiet_stream_that_answers_pings_never_fires_the_kill", "node-unit/a_reconnect_before_the_deadline_does_not_fire", "node-unit/the_kill_is_not_armed_before_the_boot_checks_pass", "node-unit/time_waiting_on_the_core_queue_does_not_fire_the_kill", "core/a_stream_loss_latches_the_kill_and_asks_for_the_loop", "pipeline/a_ten_second_stream_outage_latches_kill_through_a_restart_until_clear_hold_kill"]
repro = "cargo test -p oms-node --lib venue::bybit::gateway::tests::; cargo test -p oms-core --test holds stream; cargo test -p oms-node --features failpoints --test bybit_node a_ten_second"
