not_covered = "실제 Bybit 스트림. 첫 일괄 취소와 fsync의 순서: 이 시험은 파일에 쓰인 기록만 본다(쓰기와 fsync 사이에 Kill을 푸는 M130은 여기서 잡히지 않고, pipeline::a_kill_command_leaves_only_after_the_latch_is_durable가 잡는다). 구독은 되지만 pong에 한 번도 답하지 않는 연결의 되풀이(C-KILL 알려진 한계). 코어 입력 큐가 오래 막힌 동안의 실제 끊김(대기 시간만큼 킬이 늦어진다)"

[[claim]]
id = "V-KILL-2"
statement = "킬 루프는 일괄 취소 뒤 거래소의 미체결을 세어 0이 될 때까지 회차의 시작부터 kill_round_ms마다 일괄 취소를 되풀이하고, 첫 0 뒤 kill_watch_every_ms마다 kill_watch_ms 동안 다시 세어 모두 0일 때만 KillLoopEnded{confirmed}를 보낸다. 실패한 셈은 0이 아니고, 감시 중의 늦은 주문은 곧바로 회차로 돌아간다. 거래소가 첫 일괄 취소 뒤 주문 하나를 남기거나 5xx로 답해도 0을 확인할 때까지 되풀이하고, 어느 1초 창에도 일괄 취소는 둘을 넘지 않으며(비상 예산 2/1초, 회차가 100 ms여도), 생성이나 단건 취소는 하나도 나가지 않는다. 막힘(IP 차단 등)에는 요청을 보내지 않고 막힘 문장으로 회차가 실패하며, 예산을 기다리는 동안 생긴 막힘도 그 요청을 집에 둔다. 셈은 모든 쪽의 열린 행(New, PartiallyFilled, Untriggered)을 orderLinkId와 상관없이 세고, 상태를 읽을 수 없는 행, 실패한 쪽, 20쪽 넘음은 오류다. 정지(IP 차단 뒤, 키 거부) 중에는 셈을 보내지 않는다. 감시는 첫 0 + kill_watch_ms에 나간 셈으로만 끝난다(그 전에 나가 늦게 답한 셈으로는 끝나지 않는다). cancel-all은 result.success가 「1」일 때만 성공이고, 500건을 취소했으면 남은 주문이 있을 수 있다고 알린다"
why = "일괄 취소는 비동기이고 한 번에 500개까지라 한 번으로는 0을 보장하지 않는다. 래치 전에 나간 생성은 6초 안에 처리되므로 30초 감시로 늦은 접수를 잡는다. 같은 UID의 워처 루프와 합쳐 거래소 한도 안에 있어야 한다"
level = "단위, 통합(드라이버)"
scope = "순수 상태 기계(시간이 입력), 드라이버를 수동 시계와 http-fake(cancel-all, realtime, position/list) 위에서 100 ms 걸음으로"
real = "kill.rs의 KillLoop와 run 드라이버, Rest·Queries의 실제 요청 코드와 서명, RateBudget"
simulated = "Bybit REST(http-fake), 시계(수동), 막힘(시험이 정함)"
faults = "주문 하나 남음, cancel-all 5xx 두 번, 셈 실패, 감시 중 늦은 주문, 짧은 회차, 막힘, 예산 대기 중 막힘, 상태별 행과 남의 주문, 상태 없는 행, 끝없는 쪽, 정지, 늦게 답한 감시 셈"
criterion = "fake가 받은 POST의 루프 시각 목록, 1초 창마다의 개수, 셈 시각 목록, KillLoopEnded의 시각과 회차·호출 수. 넣은 결함과 잡은 시험: 실패한 셈을 0으로(M144), 감시 건너뜀(M145), 늦은 주문 무시(M146), 예산 안 씀(M147), 기다리지 않는 회차(M152), 막힘을 묻지 않음(M151), New만 셈(M155), 읽을 수 없는 행을 건너뜀(M156), 정지 중 셈(M157), 늦은 답으로 감시를 끝냄(M159)"
tests = ["node-unit/one_order_left_after_the_first_cancel_all_repeats_until_zero_then_watches_30_s", "node-unit/a_5xx_cancel_all_repeats_until_zero_and_never_exceeds_two_per_second", "node-unit/the_emergency_budget_holds_two_per_second_with_a_short_round", "node-unit/a_block_that_appears_during_the_budget_wait_keeps_the_cancel_all_home", "node-unit/a_failed_count_is_never_zero", "node-unit/the_machine_watches_30_s_after_the_first_zero", "node-unit/a_late_order_in_the_watch_restarts_the_rounds", "node-unit/a_blocked_gateway_sends_no_cancel_all_and_says_why", "node-unit/the_kill_count_is_every_open_row_of_every_page_and_never_a_guess", "node-unit/while_requests_are_paused_no_count_and_no_position_read_go_out", "node-unit/a_slow_watch_check_answered_after_the_end_is_not_the_last_check", "node-unit/venue::bybit::tests::cancel_all_fails_unless_the_venue_says_success_and_flags_the_cap"]
repro = "cargo test -p oms-node --lib venue::bybit::kill::tests:: venue::bybit::gateway::tests::a_blocked venue::bybit::query::tests::the_kill_count"
supports = "C-KILL의 확인 루프(K6~K8), ADR-030 §7(U18b2)"
not_covered = "실제 Bybit의 일괄 취소와 한도(문서의 한도만). 1,000건이 넘는 미체결(셈 오류 경로는 코드만). 워처 루프(U19b)와 합친 초당 2"

[[claim]]
id = "V-KILL-3"
statement = "킬 루프의 P1은 시작, 알려진 수의 바뀜, kill_notice_ms마다의 반복, 마지막(0건 확인 뒤 감시를 마침)뿐이고 모르는 수는 바뀜이 아니다. 10분 동안 셈이 실패하면 정확히 시작 1 + 반복 10 + 마지막 1 = 12개이고, 드라이버와 Alerts를 loopback 가짜 텔레그램에 붙여도 '킬 루프'가 든 요청은 12개 이하다. 모든 알림은 태그, 회차, 남은 수(모르면 이유), 일괄 취소 수와 바로 전에 읽은 포지션 묶음(심볼마다 수량, 미실현손익, 마크, 마크에서 강제청산가까지의 거리 %, 0.01 %에서 내림, 청산가가 없으면 모름, 크기 0은 뺌, 조회 실패는 실패라고)을 담는다. 알림은 루프 옆에서 순서대로 나가서, 포지션 조회가 답하지 않아도 첫 일괄 취소와 감시 중 늦은 주문의 일괄 취소는 기다리지 않는다. 느린 조회 뒤에서 기다리는 알림은 하나이고 가장 새 수의 것이 남으며, 마지막 알림은 KillLoopEnded보다 먼저 나간다. status의 notices는 보낸 알림 수다. 일괄 취소가 나갈 수 없는 동안(정지, 막힘)은 포지션을 읽지 않고 그렇다고 말한다"
why = "운영자는 끊긴 동안 포지션의 위험을 알아야 하지만 알림 폭주는 신호를 묻는다(TN 표 7-8 C4: 10분에 12개)"
level = "단위, 통합(드라이버)"
scope = "순수 기계의 10분 실패, 바뀜·반복 규칙, 드라이버와 가짜 텔레그램, 포지션 두 심볼(청산가 빈 값 하나)과 크기 0 하나, 실패한 포지션 조회, 서식 함수"
real = "KillLoop, run 드라이버, Alerts와 alert-direct(loopback HTTP), position_block·liq_distance"
simulated = "텔레그램(http-fake), Bybit REST(http-fake), 시계(수동)"
