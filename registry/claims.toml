statement = "StrategyLink는 그 전략의 일반 주문만 거절한다: holds(Some(s))에만 있고 holds(None)과 다른 전략의 목록에는 없다. 증거금 정책이 있으면 그 전략의 감소 전용 주문은 받고, 없으면 모든 보류처럼 감소 전용도 거절한다. 걸린 동안의 잃음은 기록하지 않고 첫 이유와 시각이 남으며, 설정에 없는 전략의 잃음은 bad_request로 기록하지 않는다. 그 전략이 없는 설정이 활성화되면 보류가 사라진다. 표 7-7의 시험에서 StrategyLink 줄은 일반 주문 거절, 감소 전용 받음이다"
