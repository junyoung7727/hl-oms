tests = ["core/fia_7_1_reservation_follows_potential_fills", "core/concurrent_requests_cannot_double_spend_headroom", "core/open_orders_on_the_other_side_do_not_create_headroom", "core/strategy_reduction_is_not_account_reduction", "core/capacity_limits_bound_open_orders_and_outstanding_sends"]
repro = "cargo test -p oms-core --test scenarios"
