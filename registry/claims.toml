[[claim]]
id = "V-TAIL-1"
statement = "꼬리 읽기는 디스크에 더 많은 기록이 있어도 호출자가 준 내구화 번호보다 큰 기록을 돌려주지 않고, 작은 세그먼트로 회전한 저널을 끊김 없이 순서대로 읽으며, 커서 다음 번호부터 다시 시작한다. 쓰는 쪽이 잠금을 쥔 동안에도 읽고, 읽는 동안 새 쓰는 쪽이 잠금을 잡을 수 있다(잠금을 잡지 않는다). 상한 이하의 손상된 프레임이나 번호가 튀는 프레임에서는 그 앞 기록을 돌려준 뒤 오류를 내고 위치를 움직이지 않으며, 커서 앞의 손상도 오류로 알린다(끝에서 쓰는 중인 프레임은 기다린다). 기록 스키마가 바뀌어 열린 새 세그먼트와, 헤더만 있다가 새 스키마 헤더로 다시 쓰인 세그먼트를 따라가고 기록마다 스키마를 알려 준다. 엿보기는 상한 너머의 유효한 프레임을 위치를 움직이지 않고 보여 주며 잘린 마지막 프레임에서 오류 없이 멈춘다"
why = "프로젝터와 감시자가 OMS를 방해하지 않고, 아직 내구화되지 않아 복구가 다시 쓸 수 있는 기록을 확정된 것처럼 내보내지 않는다는 전제"
level = "단위"
scope = "기록 최대 90개, 세그먼트 256바이트(회전 3개 이상)와 1 MiB, 스키마 1→2, 시험 9개"
real = "oms-journal Writer와 Tail, 실제 파일"
simulated = "손상(바이트 뒤집기), 잘린 꼬리(파일 길이 줄이기)"
faults = "체크섬 손상, 잘린 마지막 프레임, 번호가 튀는 유효 프레임, 커서 앞 손상, 쓰는 쪽 교체, 스키마 변경, 헤더만 있는 세그먼트"
criterion = "돌려준 번호 목록과 payload, 오류 종류, next_seq, 세그먼트 수"
tests = ["journal/the_tail_never_returns_a_record_above_the_durable_cap", "journal/the_tail_follows_segment_rotation_and_starts_after_a_cursor", "journal/the_tail_never_takes_the_lock", "journal/a_damaged_durable_frame_stops_the_tail_without_moving_it", "journal/peek_beyond_shows_valid_frames_past_the_cap_without_moving", "journal/a_frame_with_the_wrong_sequence_comes_after_the_good_records", "journal/damage_before_the_cursor_is_an_error", "journal/the_tail_follows_a_schema_change_to_a_new_segment", "journal/the_tail_reads_a_header_only_segment_rewritten_with_a_new_schema"]
repro = "cargo test -p oms-journal --test tail"
supports = "C-TAIL"
not_covered = "실행 중인 OMS 프로세스와 함께 읽는 것(프로세스 수준은 U14b 프로젝터 시험), 헤더를 다시 쓰는 rename 순간의 경합, 네트워크 파일 시스템, 복구가 마지막 세그먼트를 fsync한다는 것(페이지 캐시 유실은 흉내 낼 수 없다)"

