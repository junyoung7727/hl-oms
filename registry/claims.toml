# 검증 주장. 각 주장은 "무엇을, 어떤 조건에서, 무엇으로 확인했고, 무엇은 확인하지 않았는가"를 적는다.
# tests 는 "<suite>/<시험 이름>" 이며 suite 는 `xtask verify`의 묶음 이름이다.
# level: 단위 | 속성 | 시뮬레이션 | 프로세스 내부 | 프로세스 | 실제 거래소(읽기 전용) | 측정 | 변이 | 소스 검사
# 결과(통과 여부)는 여기 적지 않는다. `xtask verify`의 결과 파일에서 읽어 온다.

[[claim]]
id = "V-NUM-1"
statement = "십진 문자열과 1e-8 정수 사이의 변환은 정확하며, 표현할 수 없는 입력은 반올림하지 않고 거부한다. 전략 이름은 [A-Za-z0-9_.:-]의 1~32자만 받는다. 문자열 식별자는 만들 때와 역직렬화할 때 같은 검사로 거부한다"
why = "수치 오류는 모든 한도 검사를 무력화한다"
level = "단위"
scope = "손으로 쓴 예제와, 모든 i64 값에 대한 왕복(property test, 기본 256회)"
real = "num.rs의 실제 함수"
simulated = "없음"
faults = "잘못된 형식(지수, +, 쉼표, 소수 9자리, 범위 초과, 음수 수량)"
criterion = "기대값은 손으로 계산해 시험에 적었다"
tests = ["core/num::tests::parses_business_examples", "core/num::tests::rejects_instead_of_rounding", "core/num::tests::formats_canonically", "core/num::tests::format_parse_roundtrip", "core/num::tests::serde_roundtrip_is_exact", "core/num::tests::significant_digits_examples", "core/ids::tests::rejects_invalid_identifiers", "core/ids::tests::venue_client_id_roundtrip"]
repro = "cargo test -p oms-core --lib"
supports = "ADR-009의 표현 정확성"
not_covered = "다른 로캘이나 유니코드 숫자. 입력은 ASCII로 가정한다. 시험 없음: 클라이언트 주문 ID의 64자 상한(시험은 문자 집합 밖의 문자 거부만 본다). 시험 없음: 종목 ID의 1~32자와 문자 집합 검사"

[[claim]]
id = "V-NUM-2"
statement = "한도 비교용 금액은 정확한 곱 이상인 가장 작은 1e-8 단위 값이고, 넘치면 보고된다"
why = "노출을 과소 계산하면 한도가 뚫린다"
level = "속성"
scope = "가격 0~2e7, 수량 0~2e4 범위의 임의 값(property test)"
