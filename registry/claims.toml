[[claim]]
id = "V-CFG-1"
statement = "설정은 버전이 커야 활성화되고, 같은 버전에 다른 내용이면 시작을 거부한다. 노출이 남은 종목·전략은 제거할 수 없다. mainnet은 증거금 정책(policy.margin) 없이는 시작하지 않고, 정책의 값이 C-MARGIN 설정 표의 범위를 벗어나면 어느 거래소 설정에서도 시작하지 않는다. 저장소의 Hyperliquid 예제 설정은 증거금 정책(소유자가 정한 값)을 담고 검사를 통과한다. Hyperliquid 설정에 증거금 정책이 있으면 설정에서 계산한 분당 조회 weight(216 + 종목마다 20, 기본 간격)가 600을 넘을 때 시작하지 않는다"
why = "설정 변경이 추적되지 않으면 사고 분석이 불가능하다"
level = "프로세스"
scope = "코어 예제, 실제 노드 1회, 노드 설정 검사의 단위 시험(증거금 정책)"
real = "oms-core, oms-node"
simulated = "없음"
faults = "버전을 올리지 않은 변경. 정책 없는 mainnet 설정, 0인 한도, 신선도 한도보다 크지 않은 보고 끊김 취소 한도, 종목 20개, 짧은 조회 간격"
criterion = "종료 코드 3과 오류 문구"
tests = ["core/configuration_changes_are_validated_against_existing_exposure", "e2e/configuration_changes_need_a_new_version", "core/f10_config_validation_enforces_the_parked_fill_wait_rule", "node-unit/config::tests::mainnet_is_refused_without_a_margin_policy_and_bad_margin_values_are_refused", "node-unit/config::tests::example_config_with_a_margin_policy_loads", "node-unit/config::tests::steady_state_query_weight_is_computed_from_config_and_a_budget_above_600_is_refused"]
repro = "cargo test -p oms-node --test e2e configuration_changes && cargo test -p oms-node --lib config::tests"
supports = "요구 R13, C-BOOT"
not_covered = "설정 파일의 그 밖의 검증 규칙. 조회 weight는 문서의 weight 표로 계산한 값이고 거래소가 실제로 세는 값과 대조하지 않았다. 정상 상태가 아닌 조회(답을 받지 못한 동안 간격마다 되묻는 계좌 모드 조회, 링크 세션이 시작할 때 포지션 있는 종목의 설정 조회, 주문 상태 조회)와 주문·취소는 예산 계산에 없다. 답이 없는 거래소 설정 조회는 종목마다 간격에 한 번이라 계산 안에 있다(V-MARGIN-11의 대조기 시험). 증거금 정책이 없는 설정에는 예산 검사를 하지 않는다. account_modes_allowed의 내용(목록에 무엇을 적든 설정은 읽힌다. 허용 여부는 코어가 판정한다: V-MARGIN-9)"

