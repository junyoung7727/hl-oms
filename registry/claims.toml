[[claim]]
id = "V-WATCH-2"
statement = "워처의 독자 읽기와 저널 상태가 코어와 같은 집합을 세운다: 코어가 결정하고 oms-journal이 쓴 저널을 기록마다 읽어, 열린 주문 집합, 열린 주문마다 종목·방향·수량·전략·클라이언트 ID·거래소 주문 번호·누적 체결·결과 불명·거래소 종결, 종목마다 포지션, 체결·거래소 변경·펀딩 키와 그 거래소 시각, 체결 바닥, 킬 보류와 워처 불일치 보류, 일 기준값이 같은 기록을 재생한 코어와 같다. 시나리오들이 C-TAIL 표의 이벤트를 모두 쓴다. 닫힌 주문의 정보는 purged까지 남아 늦은 체결의 방향과 종목을 주고, 펀딩은 포지션을 바꾸지 않으며, 체결 바닥은 내려가지 않고 booted는 키를 잊지 않으며, 규칙에 맞지 않는 기록(모르는 주문의 체결, 열린 주문의 purged, 형식이 틀린 필드, 순서가 어긋난 기록)은 래치되는 오류다. 독자는 journal-<20자리>.oj만 읽기 전용으로 열고 LOCK을 열지 않으며 아무것도 만들거나 이름을 바꾸거나 쓰지 않아, OMS의 쓰는 쪽이 잠금을 쥔 동안 읽어도 디렉터리가 그대로이고 잠금이 쓰는 쪽에 남는다. 독자는 위치(세그먼트 첫 번호, 바이트 오프셋, 다음 번호)에서 16바이트 프레임 머리와 그 길이의 payload를 하나씩 읽어 max_records, 상한, 파일 끝에서 멈추고 세그먼트를 통째로 읽거나 나머지를 다시 읽지 않는다. 독자는 다음 번호가 상한보다 크면 읽지 않아 상한 너머의 쓰는 중인 프레임이나 쓰레기는 오류가 아니다. 세그먼트 헤더는 매직, 64 KiB 이하의 길이, CRC, format 1, record_schema 1·2, 기다리는 다음 번호인 first_seq, 모든 세그먼트에 같은 instance_id를 요구하고, 프레임을 아직 읽지 않은 세그먼트는 호출마다 헤더를 다시 읽는다. 프레임은 16 MiB 이하의 길이, 번호와 payload의 CRC-32, 기다리는 번호를 요구하고, payload는 seq가 프레임 번호와 같고 at이 앞 기록보다 작지 않으며 events가 키 하나인 객체의 목록인 JSON 객체여야 한다. 독자는 세그먼트 끝에서 다음 번호로 시작하는 세그먼트를 열어 회전과 스키마 변경을 따라간다. 워처는 상태를 저장하지 않고 시작마다 기록 1부터 읽으며, 가장 작은 세그먼트가 1에서 시작하지 않으면 NoStart다. 호출당 기록 수 MAX_RECORDS는 10,000이다(판단). 좋은 기록 뒤에 오류가 오면 그 호출은 좋은 기록을 돌려주고 다음 호출이 오류를 내며, 위치는 오류 앞에 머물러 파일이 바뀔 때까지 같은 오류를 낸다. Damaged·NoStart·Io는 위치를 움직이지 않고 다음 호출이 같은 자리에서 다시 읽어 재시작 없이 낫는다. UnknownEvent·Schema·Format·Instance는 래치되는 오류다. 래치된 Tail은 파일을 고쳐도 같은 오류만 내고 프로세스가 다시 시작해야 다시 읽는다. KNOWN은 C-TAIL 필드 표의 이벤트 51개이고, 시험이 tail.md를 읽어 양쪽 방향으로 비교하므로 OMS가 이벤트를 더하면 워처가 배울 때까지 실패한다. 소수 Dec(i128, 10^8 배)는 선택적 -, 숫자, 선택적 .과 1~8자리만 받고 지수, +, 9자리 이상, 빈 문자열, 앞뒤 공백은 거절하며, 덧셈·뺄셈·부호 바꿈은 정확하고 넘치면 오류다. Base32Pair는 13자리-13자리의 소문자 0-9a-v이고 첫 자리가 f 이하이며(인스턴스 0x0123456789abcdef, 주문 42 → 028q5cu4qnjff-000000000001a), 코어의 형식과 같게 부호화하고 거절한다"
why = "OMS의 저널 인코딩이나 집합 계산의 결함을 같은 코드가 확인하면 확인이 아니다(ADR-031). 워처의 W1·W2·W4는 이 집합과 거래소를 비교하므로, 집합이 코어와 다르면 거짓 불일치나 놓친 불일치가 된다"
level = "단위, 통합"
scope = "메모리에서 만든 기록의 규칙 시험 10개. 핵심 시험 도구(H)로 코어를 움직이는 시나리오 열 개(이벤트 51개 모두, 4 KiB 세그먼트 회전 포함), 기록마다 비교"
real = "oms-core의 결정과 재생, oms-journal::Writer가 쓴 파일, 워처의 Tail과 JournalState"
simulated = "거래소 입력(시험 도구가 만든 Venue 입력)"
faults = "닫힌 뒤의 체결, 파킹과 풀림, 결과 불명과 부재, 누락 체결, 거래소 변경 네 종류와 미분류 실행, 킬 재무장, 정리와 재시작으로 올라간 체결 바닥. 변이 M185~M187, M210, M231(모두 잡힘)"
criterion = "모든 시나리오의 모든 기록 뒤에 위의 비교가 같고, 쓴 이벤트 이름의 합집합이 tail.md 표의 이름과 같다. 규칙 시험은 그 값과 오류를 정확히 단언한다"
tests = ["watcher/the_watcher_sets_equal_the_core_on_journals_with_every_event_kind", "watcher/the_sets_follow_the_field_table", "watcher/a_fill_after_close_uses_the_kept_order_info", "watcher/purged_forgets_closed_orders_and_old_keys", "watcher/purging_an_unknown_order_stops_the_state", "watcher/the_fill_floor_never_goes_down", "watcher/the_fact_time_moves_only_on_the_compared_order_events", "watcher/funding_never_changes_a_position", "watcher/venue_terminal_marks_the_order_terminal_and_moves_its_fact_time", "watcher/an_instrument_the_journal_never_changed_has_no_change_time", "watcher/records_that_break_the_rules_stop_the_state", "watcher/the_watcher_reads_while_the_oms_writer_holds_the_lock", "watcher/a_large_segment_is_read_frame_by_frame_in_bounded_calls", "watcher/the_reader_never_returns_a_record_above_the_durable_cap", "watcher/frames_and_headers_follow_adr_011", "watcher/schema_1_and_2_are_read", "watcher/a_header_only_segment_rewritten_with_a_new_schema_is_read_again", "watcher/a_damaged_frame_at_or_below_the_cap_stops_without_moving", "watcher/the_reader_follows_segment_rotation_and_a_schema_change", "watcher/io_damage_and_no_start_are_retried_and_the_other_errors_latch", "watcher/an_unknown_event_stops_the_reader", "watcher/events::tests::the_known_events_are_the_rows_of_the_tail_table", "watcher/decimal::tests::decimals_parse_exactly_and_refuse_other_forms", "watcher/wire_id::tests::base32_pair_matches_the_documented_vector", "watcher/the_watcher_base32_pair_equals_the_core_form"]
repro = "cargo test -p watcher --test state && cargo test -p watcher-conformance"
supports = "C-WATCH 2부, C-TAIL, ADR-031"
not_covered = "fact_at과 last_change_at은 코어에 같은 값이 없어 규칙 시험으로만 본다. 코어가 쓰지 않는 기록(규칙 위반)은 적합성 시나리오에 없다. 살아 있는 키보다 높은 바닥의 booted(코어의 boot는 첫 부팅에만 바닥을 새로 정하고, 그때는 키가 없다), 아는 거래소 주문 번호 뒤의 null 확인(코어는 한 번만 확인한다), 닫힌 주문의 거래소 종결 표시(열린 주문만 비교)도 규칙 시험으로만 본다. 재생 속도(100만 건당 약 1.3초)는 측정이고 기준이 아니며, 페이지 캐시에 있는 파일로만 쟀다. 세그먼트 목록을 읽는 순간과 파일을 여는 순간 사이의 경합은 시험하지 않았다(저널이 세그먼트를 지우는 것은 복구 수리가 내구 번호 위의 꼬리 세그먼트를 지울 때뿐이고, 그 변화는 없는 세그먼트로 다시 읽힌다). 한 번의 read는 기록 수(최대 10,000)로만 묶이고 바이트로는 묶이지 않아, 기록 하나가 16 MiB까지인 만큼 한 호출이 붙잡는 메모리의 이론상 상한은 매우 크다. 저널 상태의 메모리는 OMS의 purged가 묶을 뿐 다른 한도가 없다(판단: OMS의 메모리 상태도 같은 크기다). 재생 속도는 측정이고 기준이 아니다: 기록 10만 건(21.4 MB)을 i9-14900K(release)에서 3회 133~134 ms에 읽었다(cargo test --release -p watcher --test replay -- --ignored, 보고만 한다)"

[[claim]]
id = "V-WATCH-3"
statement = "워처의 자기 Bybit 클라이언트는 GET을 거래소 문서대로 서명하고(정렬된 질의, 보낼 수 없는 값은 보내기 전에 거절, 머리글 다섯, 보내는 순간의 시계), 응답을 부류로 나누며(not_sent, no_answer, rate_limited, clock, refused, auth, ip_banned; unreadable은 검사가 만든다), 키 거절(HTTP 401, retCode 10003·10004·10005·10007·10010·33004) 뒤에는 프로세스가 다시 시작할 때까지 Bybit에 아무 요청도 보내지 않고, HTTP 403 뒤에는 응답 순간부터 600초 동안 모든 요청과 IP 반향을 보내지 않으며, 어느 10초 창에서도 60개를 넘겨 보내지 않고 넘는 요청은 버리지 않고 기다린다. 요청은 보내기 전에 세고, 지표는 VictoriaMetrics 가져오기 JSON 한 줄씩(watcher_up 포함) 큐 없이 밀어 넣는다. retCode 0이면 result를, 없으면 null을 돌려준다. 클라이언트 안에서는 다시 시도하지 않고 다음 라운드가 다시 묻는다. watcher_auth_rejected는 클라이언트를 만들 때 0, 래치할 때 1이다. 시계가 뒤로 가면 가드의 옛 기록이 창에 남아 시계가 그 값을 다시 지날 때까지 막는다. 지표 등록부는 모든 계열에 venue=bybit·host·watcher 이름표를 붙이고 이름표를 정렬하며, 값이 유한하지 않은 계열과 지운 게이지는 보내지 않는다. 실패한 밀어 넣기의 로그는 첫 실패와 그 뒤 1분에 한 번까지만 쓴다"
why = "OMS의 Bybit 해석 결함을 같은 코드로 확인하면 확인이 아니다(ADR-031). 거절된 키로 계속 보내거나 403 뒤에 일찍 보내면 OMS와 같이 쓰는 IP가 더 오래 막히고, 폭주 루프는 그 IP 한도를 먹는다"
level = "단위, 통합(loopback)"
scope = "서명 함수와 질의 문자열, 수동 시계 위의 가드(1분 폭주 루프 포함), loopback 가짜 Bybit·반향·VM에 붙인 클라이언트와 내보내기(부류마다 한 번, 거절 코드 일곱 각각 10분, 403 전후, 가득 찬 가드의 대기)"
real = "reqwest(rustls), hmac·sha2, 클라이언트와 등록부 코드, loopback TCP"
simulated = "Bybit, IP 반향, VictoriaMetrics(http-fake), 시계(수동)"
faults = "연결 거절, 응답 없음, 연결 닫힘, 5xx, 읽을 수 없는 본문, retCode 없음·문자열, 10016, 429, 10006, 10002, 다른 retCode, 거절 코드 일곱, 403(응답이 500 ms 늦음), 가드에서 기다리는 동안 온 10010·403, 리다이렉트 301·302·307·308, 줄바꿈과 U+2028·U+2029가 든 긴 retMsg, 본문이 잘린 401·403·429·500·200, 동시에 나간 두 요청의 10010, 반향의 403, VM의 503·닫힘·500. 변이 M188, M191, M192, M232, M233, M234"
criterion = "서명이 거래소 예시·RFC 4231·Python hmac 값과 같다. 부류와 카운터가 표대로다. 거절 뒤 10분 동안 가짜가 받는 요청이 하나뿐이고 오류 줄이 하나다. 403 뒤 응답 + 599,999 ms까지 어떤 요청도 가짜에 닿지 않고 응답 + 600,000 ms에 간다. 어느 10초 창도 60 이하이고 거절된 요청은 받은 순간에 간다. 가드에서 기다리던 요청은 그 사이 온 키 거절·403 뒤 보내지 않는다. 리다이렉트를 따르지 않는다. 본문이 잘린 401·403도 래치·멈춤을 걸고 다음 요청을 보내지 않는다. 동시에 거절된 두 요청의 오류 줄은 하나다. 거래소의 글은 오류와 로그에 200자 한 줄로 들어간다. 실패한 밀어 넣기는 다음 본문에 남지 않는다"
tests = ["watcher/the_strings_to_sign_and_signatures_match_independent_values", "watcher/query_strings_are_sorted_and_unsafe_values_refused", "watcher/every_request_carries_the_five_headers_and_the_signed_query", "watcher/answers_are_classified", "watcher/auth_answers_are_never_retried", "watcher/http_403_pauses_every_request_for_600_s", "watcher/the_guard_holds_requests_beyond_60_in_10_s", "watcher/a_request_beyond_the_guard_waits_for_the_window", "watcher/a_request_waiting_at_the_guard_sees_a_later_rejection_or_pause", "watcher/a_redirect_is_not_followed", "watcher/a_status_counts_when_its_body_is_cut", "watcher/two_rejections_in_flight_write_one_error_line", "watcher/the_import_lines_are_victoria_metrics_json", "watcher/a_failed_push_is_dropped"]
repro = "cargo test -p watcher --test sign --test client --test metrics"
supports = "C-WATCH 3부, ADR-031"
not_covered = "실제 Bybit와 실제 VictoriaMetrics(워처를 테스트넷에 붙여 돌리지 않았다). 응답 형식은 문서와 OMS의 분류에서 왔다. 가드는 이 프로세스의 요청만 센다(OMS의 요청은 모른다). 이 클라이언트를 부르는 시작 확인, 검사, 밀어 넣기 타이머와 종료 때의 마지막 밀어 넣기는 V-WATCH-4·V-WATCH-5·V-WATCH-7이 본다. 카운터는 프로세스마다 0에서 시작한다(재시작 뒤에는 VM의 증가율 함수가 처리한다). 10004의 retMsg는 거래소가 서명한 문자열(origin_string)을 담으므로 키 거절의 오류 줄에 API 키(비밀이 아니다)가 200자 안에서 나올 수 있다. 응답 본문을 읽는 데 크기 상한이 없고 request_timeout_ms × 대역폭만 묶는다. 연결 제한 3초는 request_timeout_ms가 3,000 이하이면(기본 2,000) 전체 제한에 가려져 매달린 연결이 not_sent가 아니라 no_answer가 되고, 연결 제한의 부류는 시험하지 않았다. 질의 값에 %를 허용하므로 깨진 퍼센트 열은 그대로 가고 거래소가 10004로 답하면 재시작까지 래치하며, 값은 코드의 상수, 검사된 설정, 거래소 커서에서만 온다. 지역 주소 IPv4만과 프록시 없음은 loopback 가짜로 보일 수 없어 시험하지 않았다. retCode는 2xx 본문에서만 읽어 401·403·429가 아닌 2xx 아닌 상태는 본문의 retCode와 상관없이 no_answer이고, retCode가 든 그런 본문은 시험하지 않았다"

[[claim]]
id = "V-WATCH-4"
statement = "워처의 설정 파일은 스펙 표의 모든 필드를 그 기본값과 검사대로 읽는다: 모르는 키와 표는 거부하고, mainnet은 mainnet_confirmed = true일 때만 받으며, 범위는 양 끝을 포함하고, status_url과 vm_url은 loopback만, ip_echo_url은 https만, 자격 파일은 절대 경로이고 ..이 없으며 링크를 따라 봐도 데이터 디렉터리 밖이다. 자격 파일은 링크를 따르지 않고 FIFO를 기다리지 않는 한 핸들로, 이 프로세스의 uid가 소유하고 권한이 정확히 0600 또는 0400인 일반 파일일 때만, api_key와 api_secret 둘만 비어 있지 않게 읽는다. 모든 거부는 한 줄이고, 자격 파일의 오류는 내용을 인용하지 않으며 비밀은 어디에도 찍히지 않는다. 시작 확인(U19a4b)은 query-api의 마스터 키, 다른 userID, IP에 묶이지 않은 키([]·*)와 행이 없거나 USDT로 정산되지 않는 기호를 종료 2의 이유 한 줄로 거부하고, 키 거절(auth)이면 끝내지 않고 요청 없이 떠 있으며, 그 밖의 답은 답의 시각 + 5초(403이면 + 600초)에 다시 묻는다. watcher_api_key_days_left는 expiredAt까지의 날을 내림하고 해당 없음(없음, null, 1970-01-02 이하)이면 내보내지 않는다. watcher_public_ip_ok는 반향의 주소가 마지막으로 통과한 ips에 있을 때만 1이다. IP 재확인은 지난 재확인의 마지막 답 + ip_check_ms마다 돌고, 실패하면 0으로 두고 남은 날을 지키며, 시작 규칙에 더는 맞지 않는 키는 재시작까지 모든 Bybit 요청을 멈추고 0으로 둔다. 재확인이나 5단계에서 키가 거절되면 Bybit에는 묻지 않고 반향만 ip_check_ms마다 이어 간다. 요청이 답을 기다리지 않을 때 온 답은 아무것도 바꾸지 않는다. network는 testnet 또는 mainnet이고 REST 주소는 각각 https://api-testnet.bybit.com, https://api.bybit.com이다. 5단계에서는 실패한 그 기호만 다시 묻고 앞의 기호는 다시 묻지 않는다. 5단계 요청은 category와 symbol만 보내고(settleCoin 없음) 답에서 symbol이 같은 행을 고른다"
why = "틀린 키 이름이 기본값으로 조용히 바뀌거나 단어 하나로 mainnet에 붙거나, 다른 사용자가 읽을 수 있는 키 파일이나 OMS 데이터 디렉터리 안의 키 파일로 시작하면 워처의 독립성과 키 분리(설계 §7.4)가 깨진다. 거부의 이유가 여러 줄이면 시작 거부 한 줄(스펙)을 지키지 못한다. 마스터 키나 다른 계정의 키, USDC 기호로 시작하면 워처가 OMS와 다른 계정이나 자기 조회(category=linear, settleCoin=USDT)가 보지 못하는 주문을 본다. 남은 날을 올리면 만료 경보가 하루 늦고, 403 뒤 일찍 다시 물으면 OMS와 함께 쓰는 IP의 차단을 늘린다"
level = "단위"
scope = "필수 필드만의 설정과 기본값, 필드마다의 거부와 수용(범위 16개의 양 끝과 그 밖), 파일 읽기, 링크로 가린 디렉터리와 ..로 쓴 소켓. OMS_TEST_DIR 아래 실제 파일의 권한 열둘, 다른 소유자(메타데이터 규칙 함수, 그리고 root가 소유한 /etc/hostname을 creds::load로), 심볼릭 링크, 디렉터리, FIFO, 내용 여덟 가지, 데이터 디렉터리 안·링크로 가린 경우. 시작 확인과 IP 재확인의 sans-IO 단계를 수동 시계로, 부류마다의 답과 기다림, 거부 뒤와 키 거절 뒤의 요청 없음은 loopback 가짜 Bybit·반향과 실제 클라이언트로"
real = "toml·serde, 파일 시스템(open O_NOFOLLOW|O_NONBLOCK, fstat, canonicalize), rustix geteuid, 워처 자신의 Client(시작 확인 시험의 http-fake 경로)"
simulated = "시험이 만든 다른 소유자의 파일(root만 만들 수 있어 규칙 함수에 다른 uid를 주고, 실제 파일은 /etc/hostname으로 본다). 거래소 query-api·instruments-info 답(문서의 예로 만든 가짜)과 IP 반향"
faults = "모르는 키·표, 빠진 필수 필드, 틀린 형식의 값, mainnet 미확인, 범위 밖, loopback 아닌 주소, 앞뒤 공백·탭·줄바꿈이 든 URL, 사용자가 든 URL, 상대 경로와 .., 데이터 디렉터리 안의 자격 파일(링크로 가린 경우 포함), 같은 곳을 가리키는 두 소켓, 권한 0644 등 열, 다른 소유자의 실제 파일, 링크, 디렉터리, FIFO, 빈 키, 다른 키, TOML 아님, UTF-8 아님. 변이 M193, M235~M237. 시작 확인: 마스터 키, 다른 uid, ips []·*·주소 없음, 읽을 수 없는 키 답 여섯, USDC·소문자·빈 정산 코인, 기호 없음, 부류마다의 실패(not_sent, no_answer, rate_limited, clock, refused, ip_banned, unreadable), 키 거절 다섯(10010, 10003, 33004, HTTP 401, 5단계 10004), 읽을 수 없는 expiredAt 열하나, 반향 실패·주소 아닌 본문, 재확인의 실패·규칙 위반·10010(그 뒤 반향만, 바뀐 IP), 기다리는 요청 없이 온 답. 변이 M189, M190, M225, M238"
criterion = "받는 설정은 표의 값이고 거부는 그 이유를 담은 한 줄이다. 자격 파일은 0600·0400만 받고 나머지 경우마다 그 이유로 거부하며, 어떤 오류에도 비밀 문자열이 없다. FIFO는 5초 안에 거부된다. 시작: 거부는 정한 이유 한 줄이고 그 뒤 요청이 없다. 다시 묻기는 Wait {until_ms} = 답 + 5,000ms(403은 + 600,000ms)이고 그 전에는 poll이 요청을 내지 않는다. expiredAt = 지금 + 10일이면 10, + 10일 − 1시간이면 9. 재확인은 지난 마지막 답 + ip_check_ms에 query-api를 낸다. 규칙 위반 뒤 모든 경로가 보내지지 않고 auth로 끝나며 가짜에 요청이 더 오지 않고 watcher_public_ip_ok = 0이다. 키 거절 뒤에는 ip_check_ms마다 반향 하나만 가고, 같은 IP면 1, 다른 IP면 0이다. 기다리는 요청 없이 온 답 뒤에는 같은 Step, 같은 다음 요청과 시각이다"
tests = ["watcher/the_config_is_validated_and_mainnet_needs_confirmation", "watcher/the_config_file_is_read_and_its_refusals_name_the_file", "watcher/the_credentials_file_must_be_owner_only_and_outside_the_data_dir", "watcher/a_traded_symbol_that_does_not_settle_in_usdt_refuses_the_start", "watcher/a_key_that_expires_in_10_days_gives_days_left_10", "watcher/a_symbol_missing_from_instruments_info_refuses_the_start", "watcher/a_master_key_another_uid_or_a_key_bound_to_no_ip_refuses_the_start", "watcher/the_documented_epoch_expiry_exports_no_days_left", "watcher/the_public_ip_is_rechecked_every_60_s", "watcher/query_api_answers_other_than_auth_or_a_refusal_retry_every_5_s", "watcher/an_echo_failure_or_a_body_that_is_not_an_address_gives_public_ip_ok_0", "watcher/settle_coin_answers_other_than_auth_or_a_refusal_retry_every_5_s", "watcher/an_auth_answer_at_start_stays_up_without_requests", "watcher/a_failed_recheck_sets_public_ip_ok_0_and_keeps_days_left", "watcher/a_recheck_with_another_uid_a_master_key_or_no_bound_ip_stops_every_request", "watcher/an_answer_without_a_request_in_flight_changes_nothing"]
repro = "cargo test -p watcher --test config --test creds --test start"
supports = "C-WATCH 4부(설정, 자격 파일, 시작 확인, IP 재확인), ADR-031"
not_covered = "시험이 만든 다른 소유자의 파일(root가 필요하다; 규칙 함수와 /etc/hostname으로 본다, 그 파일이 없거나 시험의 uid가 소유하면 건너뛴다), root로 돈 시험(바로 끝난다), 끊어진 심볼릭 링크로 같은 곳을 가리키는 두 소켓. 자격 파일이 있는 디렉터리의 권한, 상위 디렉터리의 링크, 읽은 뒤의 경로 변경, 키 값의 모양. 워처 키에 출금 권한이 없다는 것(운영 문서에만 적었다). 시작 확인과 재확인을 실제 Bybit와 실제 반향에 대해 돌린 적은 없다(워처를 테스트넷에 붙여 돌리지 않았다). 묶이지 않은 키의 ips 모양(Q4에 없음), readOnly와 permissions(보지 않음). 바이너리와 실행 코드가 시작 확인을 돌리는 것과 OMS가 꺼진 동안의 재확인은 V-WATCH-7이 본다. Start와 IpCheck는 답을 기다리는 요청에 기한을 두지 않아, 답을 잃으면(작업이 취소되면) 게이지가 조용히 그대로 남는다. 거래 중이 아닌 기호를 instruments-info가 빼는지는 확인하지 않았다: 빼면 시작이 종료 2로 거부되어 재시작이 되풀이되므로 운영자가 symbols에서 그 기호를 빼거나 OMS로 정리한다. 키가 거절된 뒤에는 query-api를 묻지 않아 watcher_api_key_days_left가 마지막 값에서 줄지 않으므로 그 문턱의 경보는 울리지 않고, 이때의 신호는 watcher_auth_rejected = 1이다. watcher_auth_rejected = 1과 watcher_public_ip_ok = 0이 함께 보이는 원인은 바뀐 공인 IP, 실패한 반향(반향 고장이나 403 멈춤), 시작 규칙 위반 셋이라 두 게이지만으로 원인을 단정할 수 없고, 경보 문구는 경고·오류 줄을 보라고 적는다"

[[claim]]
id = "V-WATCH-5"
statement = "워처의 검사 엔진은 첫 라운드와 첫 하트비트를 start_ms에 내고, 한 검사의 라운드를 겹치지 않으며 늦은 라운드는 한 번만 돌린다. 라운드는 거래소 쪽을 모두 읽은 뒤에만 그 라운드만의 상태 요청을 내고, 그 답은 물은 라운드만 쓰며, 그 상한까지 저널을 읽은 뒤 비교한다. 다른 인스턴스의 상태와 그 요청을 낼 때 읽은 기록보다 낮은 상한은 읽기를 재시작까지 래치하고 그 뒤 라운드는 아무것도 묻지 않는다. 다시 읽는 저널 오류는 다음 라운드에 낫고 watcher_journal_error를 0으로 돌린다. 기한(낸 시각 + request_timeout_ms + 11초)까지 답이 없는 요청은 라운드를 실패로 닫고 늦은 답은 버린다. 차이는 지난 완료 라운드와 이번 라운드에 같은 정체로 있고 이번 라운드에서 min_age_ms 이상 늙었을 때만 확정되며(실패한 라운드는 지난 완료 라운드의 sighting을 바꾸지 않는다), 두 번 보았지만 어린 차이는 라운드를 성공으로 치지 않는다. 확정은 정체마다 한 번 세고(한 라운드에 두 번 실린 정체도 하나) 1024바이트 이하의 detail을 실은 Mismatch 하나를 내며, watcher_mismatch_active는 라운드가 그것을 보지 않으면 내려간다. W1은 OMS의 쪽 규칙대로 열린 주문을 읽고(커서 없는 가득 찬 쪽, 같은 커서, 필드 없는 행은 unreadable, 20쪽 한도), 모르는 주문(foreign), 저널에서 닫힘, 거래소 종결 뒤에도 열림, 종목·방향 다름, 확인된 주문의 거래소 부재를 차이로 보고, 확인되지 않았거나 결과 불명이거나 거래소 종결된 주문의 부재는 비교하지 않는다. 나이는 주문의 fact_at(다른 이벤트로 움직이지 않음) 또는 첫 sighting이다. W1은 order/realtime을 category=linear, settleCoin=USDT, limit=50으로 묻는다"
why = "한 번 본 차이나 막 기록된 저널 항목으로 울리면 체결이 오가는 중에 거짓 보류가 걸리고, 두 번 본 어린 차이를 성공으로 치면 하트비트가 아무것도 확정하지 않는 동안 신선한 W1을 알린다. 저널을 거래소보다 먼저 읽거나 다른 라운드의 상한을 쓰면 OMS가 방금 보낸 주문을 모르는 주문으로 본다. 답 하나를 잃어 라운드가 영영 열리면 검사가 멈춘다"
level = "단위(sans-IO, 수동 시계)"
scope = "엔진 시험 도구(프로세스 안의 모델 거래소, 시험 저널 쓰기, 지연 0의 답 또는 시험이 손으로 답함): W1 시험 13개, 엔진 시험 10개. 두 검사의 라운드가 함께 열린 경우는 W1과 W2(U19a5에서는 시험의 대역 검사, U19a6부터 실제 W2의 빈 쪽)"
real = "워처의 Engine, W1, Tail, JournalState, 지표 등록부, ADR-011 형식으로 쓴 저널 파일"
simulated = "Bybit의 order/realtime 쪽(모델 거래소와 스크립트한 쪽), OMS의 /api/status(시험 저널의 마지막 기록 또는 정한 상한), 시계(수동)"
faults = "한 라운드만 보인 차이, 보였다 안 보였다 하는 차이, 1.5초·1µs 모자란·정확히 2초인 저널 항목, 확인되지 않음·결과 불명·거래소 종결 주문, 빈·남의·다른 인스턴스·모르는 orderLinkId, 종목·방향 다름, 두 쪽 사이에 저널에 들어온 51개 주문, 250ms마다 같은 주문의 체결, 커서 없는 가득 찬 쪽, 같은 커서, orderId 없는 행, 목록 아닌 list, 21쪽, 커서 있는 빈 쪽, 답 없는 거래소·상태 요청, 기한 뒤의 늦은 답, 상태 요청에 온 거래소 답, 거꾸로 온 상태 답, 답 없음·durable_seq 없음·16자리가 아닌 instance_id, 다른 인스턴스, 내려간 상한, 파일보다 높은 상한(빠진 세그먼트), 모르는 이벤트, 1200바이트의 orderLinkId, 30개 동시 확정, 실패한 라운드, 보았다·실패(거래소 무응답, OMS 무응답)·보았다, 두 쪽에 실린 같은 주문, 1µs 늦게 확인된 missing_at_venue 주문. 변이 M194, M195, M198, M211~M214, M219, M224, M229, M239~M242와 시험 밖 변이 28개(모두 잡힘, U19a5 보고와 검토 1 수정)"
criterion = "확정은 정한 라운드(시각)에만 오고 Mismatch의 detail이 정확히 그 문자열이다. 그 전 라운드에는 Mismatch가 없다. 미룬 라운드 뒤 성공 시각과 하트비트의 W1이 움직이지 않는다. 상태 요청은 마지막 쪽의 답 뒤에만 나온다. 기한 1ms 전에는 라운드가 열려 있고 기한에 실패한다. 래치 뒤 다섯 라운드 동안 거래소 요청이 없고 래치 줄은 하나다. detail은 1024바이트 이하이고 글자 경계에서 잘린다"
tests = ["watcher/a_one_round_difference_does_not_alarm", "watcher/a_two_round_difference_older_than_2_s_alarms", "watcher/a_journal_entry_younger_than_2_s_does_not_alarm", "watcher/an_unacked_order_missing_at_the_venue_is_not_compared", "watcher/a_foreign_order_at_the_venue_is_a_mismatch", "watcher/an_order_closed_in_the_journal_and_open_at_the_venue_is_a_mismatch", "watcher/the_venue_is_read_before_the_journal", "watcher/a_difference_whose_order_keeps_receiving_events_is_confirmed_by_its_fact_age", "watcher/a_young_difference_seen_twice_defers_the_round", "watcher/a_full_page_without_a_cursor_or_an_unchanged_cursor_fails_the_round", "watcher/an_order_ended_at_the_venue_in_the_journal_and_not_listed_agrees", "watcher/an_order_ended_in_the_journal_and_still_open_at_the_venue_is_open_after_terminal", "watcher/a_late_round_runs_once_and_rounds_do_not_overlap", "watcher/the_first_rounds_and_heartbeat_are_due_at_start", "watcher/a_retried_journal_error_heals_and_a_latched_one_fails_every_round", "watcher/a_status_of_another_instance_or_a_cap_below_the_read_before_the_request_stops_the_reader", "watcher/status_answers_in_reverse_order_are_each_used_by_their_own_round", "watcher/the_detail_is_at_most_1024_bytes", "watcher/a_confirmed_identity_is_counted_once", "watcher/a_request_without_an_answer_fails_its_round_at_the_deadline_and_a_late_answer_is_ignored", "watcher/mismatch_active_counts_the_confirmed_differences_a_round_still_sees", "watcher/a_failed_round_keeps_the_sightings_of_the_last_completed_round", "watcher/an_order_listed_on_two_pages_is_one_difference"]
repro = "cargo test -p watcher --test w1 --test engine"
supports = "C-WATCH 5부, ADR-031"
not_covered = "실행 코드가 엔진을 돌리는 것, Mismatch를 admin.sock에 보내는 것과 다시 보내기·빚, 하트비트를 monitor.sock에 보내는 것은 V-WATCH-7이 본다. 실제 Bybit의 order/realtime 응답(워처를 테스트넷에 붙여 돌리지 않았다)과 열린 주문의 orderLinkId 유일성(문서로 확인하지 않음). 지워진(purged) 주문은 foreign으로 보인다(종류만 다르다). 시계가 뒤로 가는 경우는 saturating_sub으로 멈추는 것을 코드로만 본다. W1은 수량을 비교하지 않는다(정정과 부분 체결이 바꾸고, 체결은 W2와 W4가 본다). 라운드마다 정체가 바뀌는 차이(두 라운드 안에 새 orderId로 바뀌는 남의 주문)는 확정되지 않고 라운드는 성공하며, watcher_differences가 오래 0이 아닌 것으로만 드러난다. 숫자가 든 실패 이유 줄(the journal read stopped at record N, below the cap M)은 이유가 라운드마다 바뀌므로 밀린 동안 라운드마다(1초에 한 줄) 쓴다"

[[claim]]
id = "V-WATCH-6"
statement = "워처의 W2는 position/list(category=linear, settleCoin=USDT, 200개씩 5쪽까지)를 W1의 쪽 규칙으로 읽고(커서 없는 가득 찬 쪽, 같은 커서, 한 기호의 두 행(헤지 모드), 모르는 방향, 소수가 아닌 크기, 크기 있는 빈·없는 방향, 음수 크기, 기호 없는 행은 unreadable, 6쪽째는 실패), 기호마다 d = 거래소 − 저널(체결 + 외부 체결 + 거래소 변경 + 조정)을 차이 (W2, position, 기호, d)로 본다(범위를 넘은 d는 값 overflow인 차이). 다른 d는 처음부터 센다. 저널의 마지막 변경 시각과 거래소의 최근 변경 시각(updatedTime, 없으면 그 크기를 처음 본 라운드 seen_at) 중 알려진 것이 min_age_ms보다 어리면 첫 sighting이어도 미루고 라운드는 성공이 아니며, 모르는 시각은 늙음이라 저널이 바꾼 적 없는 기호의 거래소 포지션은 두 번째 라운드에 확정된다. 행이 없는 기호는 크기 0으로 보아 막 닫힌 포지션도 처음 0으로 본 라운드부터 2초 미루고, 첫 완전한 읽기의 크기에는 seen_at이 없으며, 모든 쪽을 읽은 뒤 실패한 라운드의 크기는 마지막 거래소 답의 시각으로 남고, 쪽 사이에서 실패한 라운드는 아무것도 남기지 않는다. 초당 5번의 체결이 60초 이어지는 동안 Mismatch가 없고, 체결이 멈춘 뒤 심은 차이는 라운드의 어느 위상에서도 3초 안에 확정된다"
why = "체결이 오가는 동안 W2가 울리면 거짓 보류가 걸리고, 어린 차이를 성공으로 치면 아무것도 확정하지 않는 동안 하트비트가 신선한 W2를 알린다. 모르는 시각을 어림으로 보면 OMS가 모르는 포지션(수동 거래, 놓친 체결)을 영영 확정하지 못하고, 막 닫힌 포지션을 늙게 보면 OMS가 기록하기 전에 확정한다. 다른 두 값을 확정하면 움직이는 포지션에 보류를 건다"
level = "단위(sans-IO, 수동 시계)"
scope = "엔진 시험 도구(프로세스 안의 모델 거래소: 열린 주문과 포지션 목록, 경로마다의 스크립트; 시험 저널 쓰기; 상태 무응답; 지연 0의 답): W2 시험 14개, W1과 함께 돈다"
real = "워처의 Engine, W2, W1, Tail, JournalState, 지표 등록부, ADR-011 형식으로 쓴 저널 파일"
simulated = "Bybit의 position/list 쪽(모델 거래소와 스크립트한 쪽), OMS의 /api/status(시험 저널의 마지막 기록 또는 무응답), 시계(수동), 체결 흐름(200ms마다 거래소, 300ms 뒤 저널; 판단(모델 아님))"
faults = "저널이 모르는 기호의 거래소 포지션, 거래소가 모르는 저널 포지션, 라운드마다 바뀌는 d, 0.5초·정확히 2초·1µs 모자란 저널 변경, 100ms 전에 바뀐 updatedTime, 한 쪽과 두 쪽의 헤지 모드 행, 커서 없는 가득 찬 쪽, 같은 커서, Long 방향, 1e3 크기, 기호 없는 행, 6쪽, 거래소 무응답, 크기 있는 빈 방향과 없는 방향, 음수 크기, 크기 0인 빈 방향, 커서 있는 빈 쪽, 1쪽 뒤에 잃은 2쪽, 소수 범위를 넘는 d, 첫 라운드의 무응답과 읽을 수 없는 쪽, 뒤에 나타난 기호, 거래소에서 닫힌 포지션(저널이 1.5초에 따라감, 따라가지 않음), updatedTime 없이 라운드마다 바뀌는 크기, OMS 무응답 중 본 크기, 60초 동안 초당 5번의 체결, 위상 0~900ms와 읽기 1ms 뒤에 심은 차이. 변이 M196, M197, M218, M223, M243~M245와 시험 밖 변이 22개(모두 잡힘, U19a6 보고와 검토 1 수정)"
criterion = "확정은 정한 라운드(시각)에만 오고 Mismatch의 detail이 정확히 그 문자열이다. 미룬 라운드 동안 W2 성공 시각과 하트비트의 W2가 움직이지 않고 watcher_check_age_s{W2}가 정확히 자란다. 체결 60초 동안 Mismatch 0개. 심은 차이의 확정은 라운드 시작의 심기에 +2,000ms, 위상 p에 +3,000 − p ms, 읽기 1ms 뒤의 심기에 +2,999ms"
tests = ["watcher/five_fills_per_second_for_60_s_give_no_mismatch", "watcher/a_difference_planted_after_the_fills_stop_is_confirmed_within_3_s", "watcher/a_changing_difference_restarts_the_count", "watcher/a_deferred_round_is_not_a_success", "watcher/a_venue_position_in_a_symbol_the_journal_never_changed_is_confirmed_on_the_second_round", "watcher/a_young_journal_change_defers_even_at_the_first_sighting", "watcher/hedge_mode_rows_are_unreadable", "watcher/bad_pages_and_rows_fail_the_round", "watcher/a_closed_venue_position_defers_until_2_s_after_it_was_first_seen_flat", "watcher/a_difference_that_changes_every_round_without_a_venue_time_is_not_a_success", "watcher/sizes_found_at_the_first_round_have_no_seen_time", "watcher/a_size_seen_by_a_round_that_then_fails_keeps_its_seen_time", "watcher/a_round_that_failed_between_pages_leaves_no_observation", "watcher/a_difference_too_large_to_subtract_is_still_a_difference"]
repro = "cargo test -p watcher --test w2"
supports = "C-WATCH 6부, ADR-031"
not_covered = "W4의 마지막 execTime으로의 대체(U19a9). 실제 Bybit의 position/list 응답과 updatedTime이 무엇에 움직이는지(워처를 테스트넷에 붙여 돌리지 않았다). 라운드 도중 쪽 사이를 옮긴 행은 헤지 모드와 구별하지 못한다(unreadable). 호스트 시계가 거래소보다 앞선 경우는 문서의 한계일 뿐 시험하지 않았다. 주차된 체결은 세지 않는다(소유자 질문 4). updatedTime이 크기 변경에 움직이지 않으면 막 바뀐 크기를 늙게 본다(검토 1 N4, testnet 항목). 시험 도구의 지연 0으로는 비교 시계와 마지막 거래소 답의 시계를 구별하지 못한다. W2의 기호별 관찰 목록은 완전한 읽기에서 거래소가 보인 기호마다 하나라 거래소의 linear 기호 수(판단: 수백 개)로 묶이고, 저널에만 있는 기호는 항목이 없어 {0, 없음}과 같다. positionIdx는 읽지 않아 헤지 모드에서 한쪽만 열린 계좌는 통과하고, side 'None'은 unreadable이지만 시험하지 않았고 Bybit가 그 값을 보내는지도 확인하지 않았다. W2는 크기만 비교하고 진입가, 레버리지, 증거금은 비교하지 않는다"

[[claim]]
id = "V-WATCH-7"
statement = "워처의 엔진은 확정된 차이를 그것을 실은 보내기가 \"held\"로 답할 때까지 빚으로 두고(\"already held\", 보류를 보이는 저널, 실패는 갚지 않고, 라운드가 더 보지 않아도 확정 때의 detail로 보낸다), 저널 상태가 그 검사의 최근 held/already held 답 뒤에 낸 상태 요청의 상한에서 보류 꺼짐을 보일 때, 지난 보내기 시작부터 mismatch_resend_ms가 지났을 때, 그 검사의 보내기가 진행 중이 아닐 때만 보낸다(보고가 없는 보내기는 낸 시각 + 2 × request_timeout_ms + 1초에 실패하고, 그 뒤에 온 늦은 보고는 번호가 달라 아무것도 갚지 않는다). W1·W2는 라운드가 아직 보는 확정된 차이를 해제 뒤 다시 보낸다. admin.sock 클라이언트는 hello 다음 watcher_mismatch를 보내고 두 답을 읽는다. monitor.sock 클라이언트는 연결 하나를 유지하고 hello를 먼저, 그다음 W1~W4의 성공 시각(없으면 null)을 보내며, 끊김·답 없음 뒤 다음 하트비트에 다시 연다. 실행은 설정을 읽은 때부터 지표를 밀어 넣고, 시작 확인, /api/status 기다림, 재생 동안에도 IP를 다시 확인하고, 재확인에서 시작 규칙에 맞지 않는 키는 모든 Bybit 요청을 멈추며, OMS가 답하지 않으면 아무것도 판단하지 않고, 시작 거부는 코드 2, shutdown 입력은 새 라운드 없이 마지막 밀어 넣기와 모니터 연결 닫음 뒤 0으로 끝난다. 'recorded' 답이면 watcher_heartbeat_ok_ts를 그 하트비트의 시계(epoch 초)로 둔다. 하트비트의 오류 답은 연결을 그대로 두고 error 줄을 1분에 하나까지 쓴다"
why = "빚을 잃으면 OMS의 메모가 이름하지 않는 차이가 사라지고, 답 앞의 상한으로 보류 꺼짐을 믿으면 보류가 걸린 줄 모르고 보내거나 거둔다. 진행 중 보내기가 둘이면 held가 무엇을 갚는지 모른다. 하트비트가 다른 검사의 시각을 실으면 게이트가 틀리게 열리고, hello 없는 하트비트는 거절된다. OMS가 내려간 동안 판단하면 저널 없이 확정한다"
level = "단위(sans-IO, 수동 시계)와 통합(loopback 가짜, 실제 시간 하나)"
scope = "엔진 시험 도구(모델 거래소, 시험 저널, 시험 도구의 OMS가 watcher_mismatch에 답하고 hold_set을 씀), 가짜 admin.sock·monitor.sock(UnixListener), runtime::run과 http-fake의 Bybit·반향·/api/status·VictoriaMetrics, 바이너리의 --version과 네트워크 전 거부: 시험 20개"
real = "워처의 Engine, W1, W2, oms::admin_send, oms::Monitor, oms::Status, runtime::run, rest::Client, start::Start·IpCheck, metrics::Exporter, ADR-011 형식으로 쓴 저널 파일, Unix 소켓과 loopback HTTP"
simulated = "OMS(소켓 답과 hold_set을 쓰는 시험 도구, /api/status), Bybit와 IP 반향과 VM(http-fake), 시계(수동, 종단 시험만 실제)"
faults = "첫 보내기 실패(unavailable), 사라진 차이, 다른 보내기가 건 보류, 저널이 아직 못 본 보류와 already held, 늦은 첫 답, 보고 없는 보내기, 기한 뒤에 온 늦은 held, 상한 아래에서 끝난 재생, 재확인의 마스터 키, 답 앞에 낸 상태 요청의 상한, 없는 소켓, bad_request·overloaded 답, 닫힌 연결, 답 없는 하트비트, W2만 실패, 상태 500·무응답, 401 키, 마스터 키, 0644 자격 파일, Location 있는 302. 변이 M199, M200, M201, M220, M226, M228, M246과 시험 밖 변이 25개(모두 잡힘, U19a7 보고와 검토 1 수정)"
criterion = "보내기는 정한 시각(라운드)에만, 정한 detail로, 정한 수만큼 온다. 하트비트 줄의 W1·W2는 그 순간 엔진의 성공 시각과 같고 첫 것은 모두 null. 소켓 줄은 hello가 먼저이고 정확히 그 문자열이다. 종단 시험에서 W1·W2가 있는 하트비트, W1 불일치, 서명된 네 경로, watcher_up이 든 밀어 넣기, 코드 0"
tests = ["watcher/a_confirmed_mismatch_is_sent_once_and_again_after_a_clear", "watcher/a_confirmed_mismatch_is_sent_until_answered_even_after_the_difference_is_gone", "watcher/a_difference_confirmed_under_a_hold_is_sent_after_the_clear", "watcher/a_second_send_waits_for_the_first_answer", "watcher/a_hold_seen_off_at_a_cap_sampled_before_the_answer_does_not_send", "watcher/a_late_report_of_one_send_pays_only_what_that_send_carried", "watcher/the_admin_client_says_hello_and_reads_both_replies", "watcher/heartbeats_carry_the_success_time_of_each_check", "watcher/the_heartbeat_says_hello_first_and_reconnects", "watcher/a_reply_that_does_not_come_in_time_reopens_the_connection", "watcher/the_watcher_runs_against_loopback_fakes_end_to_end", "watcher/without_an_answering_oms_nothing_is_judged", "watcher/the_shutdown_input_ends_cleanly", "watcher/the_ip_recheck_runs_while_the_oms_is_down", "watcher/the_ip_recheck_runs_during_the_boot_replay", "watcher/a_recheck_that_fails_a_start_rule_stops_every_bybit_request", "watcher/a_key_rejected_at_start_is_exported", "watcher/the_status_client_sends_the_loopback_host_and_follows_no_redirect", "watcher/a_start_refusal_ends_the_run_with_exit_code_2", "watcher/version_prints_and_anything_else_exits_2"]
repro = "cargo test -p watcher --test admin --test heartbeat --test runtime --test binary"
supports = "C-WATCH 7부, ADR-031, C-LIVE 2부, C-HOLD"
not_covered = "실제 oms-node 프로세스와 실제 Bybit에 붙여 돈 적이 없다(워처를 테스트넷에 붙여 돌리지 않았다). SIGTERM·SIGINT에서 shutdown 입력으로의 연결(main.rs)은 시험하지 않았다. 빚은 메모리에만 있어 재시작하면 잃는다. W3·W4의 보내기와 하트비트 시각은 V-WATCH-8·V-WATCH-9가 본다. 재생 중에는 하트비트가 없다(소유자 질문 9). 종단 시험만 실제 시간이고 짧은 간격(500ms)으로 돌았다. 보류가 오래 걸려 있는 동안 빚 목록에는 크기 한도가 없다(값이 계속 바뀌는 W2 차이로 w2_ms 1000에서 하루 많아야 약 43,000개·43MB, 판단). the_shutdown_input_ends_cleanly는 마지막 밀어 넣기 하나와 코드 0만 단언하고, 모니터 연결 닫힘과 종료 뒤 라운드 없음은 run이 돌아온 뒤에 보아 Runtime::stop 없이도 성립하며, 진행 중 요청을 request_timeout_ms까지 기다리는 것은 단언하지 않는다"

[[claim]]
id = "V-WATCH-8"
statement = "워처의 W4는 execution/list를 고정된 끝(첫 쪽의 시계)과 시작 max(워터마크 − w4_overlap_ms, ⌈체결 바닥/1000⌉)(7일로 자름)의 창으로 훑고, 라운드마다 w4_max_pages쪽까지 읽어 더 긴 훑기는 다음 라운드가 같은 창과 커서로 이으며(성공 시각은 끝난 훑기에서만), 빈 쪽이나 빈 커서에서 끝내고, 바뀌지 않은 커서와 읽을 수 없는 쪽은 라운드를 실패시켜 같은 커서로 다시 읽되 연달아 3번이나 50라운드면 같은 시작과 새 끝으로 다시 시작한다. 행은 execType으로 먼저 나눠 Trade는 저널 체결과, AdlTrade·BustTrade·Delivery·Settle은 저널 거래소 변경과 키 <symbol>:<execId>로 비교하고, Funding은 비교하지 않으며, 모르는 형은 끝난 훑기에서 바로 확정하고, 형이 필요로 하는 필드가 없는 행과 execTime이 훑기의 끝보다 뒤인 행은 unreadable_row, 바닥 아래 행과 수량 0인 Trade·거래소 변경 행은 무시한다. 차이는 두 훑기와 execTime 나이로 확정하고 어린 차이는 훑기를 실패시키지 않는다. 워터마크는 확정되지 않은 가장 오래된 행(execTime 없는 행은 모든 행보다 오래됨) 아래의 가장 새 행으로만, 뒤로 가지 않게 움직인다. held 답(already held는 갚지 않는다)으로 갚고 그 답 뒤에 낸 상한에서 보류 꺼짐을 본 W4 정체는 거두어 다시 보내지도 세지도 않는다. 처음 워터마크는 첫 훑기 때의 now − w4_initial_lookback_ms(기본 600초)이고 ⌈체결 바닥/1000⌉보다 낮지 않다"
why = "쪽 상한이 없으면 큰 창이 예산을 넘기고, 이은 훑기가 1쪽부터면 끝나지 않는다. 겹침이 없으면 늦게 실린 행을 놓치고, 워터마크가 확정되지 않은 행을 지나면 그 행을 다시 읽지 않는다. Funding을 체결로 보거나 ADL을 체결과 맞추면 맞는 저널에서 보류가 걸린다. 모르는 형이 두 번째 훑기를 기다리면 OMS가 분류하지 못한 실행의 확정이 늦다. 해제 뒤 W4를 다시 보내면 조용한 계좌에서 운영자가 보류를 풀 수 없고, 답 앞의 상한이나 held 없이 거두면 어느 메모에도 없는 차이가 사라진다. 끝 뒤의 execTime을 워터마크로 믿으면 그 뒤 창이 [end, end]가 되어 W4가 조용히 멈추고, 수량 0 행을 비교하면 OMS가 기록하지 않는 행으로 거짓 보류가 걸린다"
level = "단위(sans-IO, 수동 시계)와 통합(loopback 가짜, 실제 시간 하나)"
scope = "엔진 시험 도구(프로세스 안의 모델 거래소의 체결 목록: 창 안을 새것부터 100개씩, 커서 e<번호>; 시험 저널; 시험 도구의 OMS가 watcher_mismatch에 답하고 hold_set을 씀), 종단 시험의 http-fake execution/list: 시험 34개"
real = "워처의 Engine, W4, W1, W2, ADR-011 형식으로 쓴 저널 파일, 종단 시험의 runtime::run과 rest::Client"
simulated = "Bybit execution/list(모델 거래소와 대본 쪽), OMS(시험 도구), 시계(수동, 종단 시험만 실제)"
faults = "250행 3쪽, 1,200행 12쪽(마지막 쪽 가득 참·빈 커서), 빈 쪽, 바뀌지 않은 커서, 연달아 실패한 쪽 3번, 멈춘 라운드 사이의 실패, 50라운드 안 끝난 훑기, 7일 넘는 빈 창, 늦게 실린 행, 사라진 새 행(워터마크 뒤로), 펀딩 행(수량·방향 있음과 없음), ADL·BustTrade(있음·없음·다른 종류), 다른 수량의 체결, 모르는 형(한 쪽과 여러 라운드), 수량·키·execTime 없는 행, 바닥 아래와 바닥 위 행, 어린 차이 두 번, 해제 뒤 조용한 계좌, 창을 떠났다 돌아온 행, 바뀐 값, 답 앞에 낸 상한, 다른 검사의 보류 아래 확정, 끝 뒤의 execTime, 수량 0인 Trade·Settle·AdlTrade, W1의 held 뒤 W4의 already held, 연달아 실패한 라운드 9번. 변이 M202~M208, M215~M217, M222, M227, M247~M250과 시험 밖 변이 27개(모두 잡힘, U19a8 보고)"
criterion = "W4의 Mismatch는 정한 훑기(라운드)에만, 정한 detail로, 정한 수만큼 온다. 요청의 startTime·endTime·cursor가 규칙의 값과 같고, 쪽 수가 정한 수이며, W4의 성공 시각과 watcher_check_age_s{W4}·watcher_differences{W4}·watcher_mismatch_active{W4}가 정한 값이다"
tests = ["watcher/a_missing_trade_needs_two_sweeps", "watcher/the_sweep_starts_10_s_before_the_last_confirmed_exec_time", "watcher/a_round_of_250_executions_is_compared_in_full_over_3_pages", "watcher/a_row_loaded_late_inside_the_overlap_is_compared", "watcher/the_watermark_never_moves_back", "watcher/executions_1200_are_compared_over_two_rounds_and_the_w4_age_rises_between", "watcher/an_empty_page_ends_the_sweep", "watcher/an_unchanged_cursor_is_a_failed_page", "watcher/a_failed_page_three_rounds_in_a_row_restarts_the_sweep_with_a_new_end", "watcher/a_sweep_not_complete_after_50_rounds_restarts", "watcher/an_adl_trade_the_journal_lacks_is_a_mismatch", "watcher/a_trade_or_venue_change_with_other_details_is_a_difference", "watcher/funding_rows_beside_known_fills_are_no_mismatch_while_a_position_is_held", "watcher/an_unknown_exec_type_is_a_mismatch_at_once", "watcher/an_unknown_exec_type_in_a_multi_round_sweep_is_confirmed_when_the_sweep_completes", "watcher/a_funding_row_without_side_or_qty_is_ignored", "watcher/a_trade_row_without_qty_is_an_unreadable_row_and_needs_two_sweeps", "watcher/a_row_without_a_key_is_named_by_its_text", "watcher/an_unconfirmed_row_without_a_readable_exec_time_holds_the_watermark", "watcher/a_trade_at_the_fill_floor_millisecond_is_ignored", "watcher/an_empty_window_logs_once_per_state_change", "watcher/the_newest_agreeing_exec_time_is_kept_per_symbol", "watcher/a_confirmed_row_is_not_sent_again_after_clear_hold_in_a_quiet_account", "watcher/a_dismissed_row_that_leaves_the_window_and_a_changed_value_are_sent_anew", "watcher/a_hold_seen_at_a_cap_sampled_before_the_answer_does_not_dismiss", "watcher/a_row_confirmed_under_an_older_hold_is_sent_once_after_that_hold_is_cleared", "watcher/a_young_difference_seen_twice_does_not_fail_the_sweep", "watcher/a_trade_at_the_floor_itself_is_compared", "watcher/a_round_that_reads_a_page_ends_the_run_of_failed_rounds", "watcher/a_row_after_the_sweeps_end_is_an_unreadable_row_and_does_not_blind_w4", "watcher/a_trade_or_venue_change_of_quantity_0_is_ignored_as_the_oms_ignores_it", "watcher/an_already_held_answer_to_a_w4_send_does_not_pay_it", "watcher/the_restart_warn_line_is_logged_once_per_run_of_failed_rounds", "watcher/the_watcher_runs_against_loopback_fakes_end_to_end"]
repro = "cargo test -p watcher --test w4 --test runtime"
supports = "C-WATCH 8부, ADR-031"
not_covered = "W4의 가득 찬 마지막 쪽 한계: 거래소가 행이 더 있는데 가득 찬 쪽을 빈 커서로 끝내면 그 행은 비교하지 않는다(W2가 포지션으로 본다, 소유자 질문 11). 실제 Bybit execution/list의 응답, Funding·ADL 행의 모양, 빈 nextPageCursor의 뜻(facts Q9.9, 설계 R3 T15; 워처를 테스트넷에 붙여 돌리지 않았다). w4_initial_lookback_ms보다 오래 내려가 있던 뒤의 오래된 체결. 거둔 정체는 메모리에만 있어 재시작 뒤 다시 확정된다. 하트비트의 W4 시각은 V-WATCH-9, 예산은 V-WATCH-10이 본다. 자주 실패하는 거래소에서는 긴 훑기가 끝나지 못하고 다시 시작을 되풀이할 수 있고, 그동안 watcher_check_age_s{W4}만 오르며 다른 것은 그것을 알리지 않는다. W4는 execTime(거래소 시계)의 나이를 이 호스트의 시계로 재므로, 거래소보다 min_age_ms 이상 앞선 호스트 시계는 W4의 확정을 앞당긴다(시험하지 않았다)"

[[claim]]
id = "V-WATCH-9"
statement = "워처의 W3은 w3_ms마다 wallet-balance?accountType=UNIFIED의 UNIFIED 계좌 하나(정확히 하나, 세 필드가 저널 소수, 유지증거금이 음수가 아님; 아니면 unreadable로 라운드 실패)를 OMS의 공식으로 판단한다: account_mm_rate는 maintenance > 0이고 maintenance × 10 000 ≥ account_mm_rate_max_bps × margin_balance(같으면 건다), daily_loss는 저널의 일 기준값이 오늘의 UTC 날이고 (base − totalEquity) × 10 000 > daily_loss_bps × base(오늘의 기준이 없으면 판단하지 않는다). 정체는 종류뿐이고 두 라운드 연속에서 나이 없이 확정하며, 위반이 남아 있으면 해제 뒤 다시 보낸다. W2는 W4가 마지막으로 맞춘 그 기호의 execTime이 updatedTime이나 seen_at보다 새면 그것을 거래소의 변경 시각으로 쓴다. 하트비트의 W3·W4는 그 검사의 마지막 성공 시각이고, 실행은 W2(W4의 시각 지도와 함께), W3, W4를 돌리며 엔진 전에는 네 검사의 나이를 boot_ms부터 내보낸다. W4의 시각은 체결이 막 맞은 기호의 차이를 많아야 min_age_ms 동안만 미루고 그 뒤에는 확정되게 한다"
why = "W3이 한 라운드로 확정하면 순간의 값 하나로 보류가 걸리고(설계 \"한도 위반 2회 연속\"), 한도와 같은 값을 통과시키면 OMS가 감소 전용으로 들어가는 계좌를 워처가 괜찮다고 본다. 어제의 기준으로 일 손실을 판단하면 새 날의 첫 시세 변동이 거짓 보류가 된다. 두 UNIFIED 계좌 중 하나를 고르거나 음수 유지증거금을 읽으면 OMS가 거부하는 보고로 판단한다. W2가 W4의 체결 시각을 쓰지 않으면 updatedTime이 없거나 움직이지 않는 거래소에서 체결이 막 맞은 기호의 차이를 어린 채로 확정한다. 하트비트가 W3·W4를 null로 보내면 OMS 기록에서 두 검사가 사라진다"
level = "단위(sans-IO, 수동 시계)와 통합(loopback 가짜, 실제 시간 하나)"
scope = "엔진 시험 도구(프로세스 안의 모델 거래소에 지갑 계좌 목록과 대본, 포지션과 체결; 시험 저널의 day_base_set·hold_cleared; 시험 도구의 OMS), 가짜 monitor.sock과 실제 oms::Monitor, runtime::checks, runtime::run과 http-fake의 wallet-balance 경로: 시험 9개"
real = "워처의 Engine, W3, W2, W4, runtime::checks, runtime::run, oms::Monitor, rest::Client(종단 시험), ADR-011 형식으로 쓴 저널 파일"
simulated = "Bybit wallet-balance·position/list·execution/list(모델 거래소와 http-fake), OMS(시험 도구), 시계(수동, 종단 시험만 실제)"
faults = "한도보다 10^-8 아래, 한도와 같음, 한 라운드만의 위반, 라운드마다 바뀌는 금액, 잔고 ≤ 0, 유지증거금 0, 기준 100에서 95.00과 94.99, 해제 뒤 이어지는 손실, 오늘의 새 기준, 기준 없음, 어제의 기준, 자정을 넘은 오늘의 기준, UNIFIED 없음·둘, 빈 소수, 음수 유지증거금, 지수, 목록이 아닌 list, 거래소 무응답, updatedTime 없는 기호와 늙은 updatedTime의 기호에 어린 W4 시각, 어느 시각도 없는 기호, 실패하는 W3 라운드, 엔진 전의 키 거절, 다른 검사의 간격으로 도는 W3·W4. 변이 M251~M254와 시험 밖 변이 17개(모두 잡힘, U19a9 보고)"
criterion = "W3의 Mismatch와 확정 줄은 정한 라운드에만 정한 detail로 오고, watcher_differences{W3}·watcher_mismatches_total{W3}·watcher_mismatch_active{W3}와 W3의 성공 시각이 정한 값이며, 읽을 수 없는 답마다 watcher_request_errors_total{wallet-balance, unreadable}이 하나씩 오른다. W2의 확정은 W4의 시각이 2초 늙은 라운드에 정한 detail로 온다. 하트비트 줄의 W3·W4는 그 순간 엔진의 성공 시각과 같다. 종단 시험의 하트비트에 W1~W4 시각이 모두 있다. runtime::checks로 돈 W3·W4의 성공 시각은 +1~+5초에 각자의 간격(W3 2초, W4 5초)으로만 움직인다(검토 1 S1)"
tests = ["watcher/a_margin_rate_at_the_limit_on_two_rounds_alarms", "watcher/a_daily_loss_beyond_todays_base_on_two_rounds_alarms", "watcher/without_todays_base_only_the_margin_rate_is_judged", "watcher/an_unreadable_wallet_fails_the_round", "watcher/a_missing_updated_time_falls_back_to_w4s_last_exec_time", "watcher/w3_and_w4_success_times_reach_the_heartbeat", "watcher/the_runtime_runs_w2_w3_and_w4_and_w2_reads_w4s_exec_times", "watcher/a_key_rejected_at_start_is_exported", "watcher/the_watcher_runs_against_loopback_fakes_end_to_end"]
repro = "cargo test -p watcher --test w3 --test w2 --test heartbeat --test runtime"
supports = "C-WATCH 9부, ADR-031, C-MARGIN"
not_covered = "실제 Bybit wallet-balance의 응답(8자리를 넘는 소수를 보내는지; 워처를 테스트넷에 붙여 돌리지 않았다). 자정부터 OMS의 새 day_base_set까지는 일 손실을 판단하지 않는다(소유자 질문 6). OMS의 유지증거금 여유(MmBuffer) 규칙은 W3에 없다. 워처의 [w3] 한도가 OMS 설정과 같은지는 운영자의 몫이다. 범위를 넘는 곱을 위반으로 보는 규칙은 시험하지 않았다(실제 금액에서는 생기지 않는다; 검토 1 N1). 미래 날의 기준은 판단에서 빼는지 시험하지 않았다(OMS가 쓰지 않는다). W4의 시각은 훑기가 끝날 때(w4_ms마다)만, 많아야 그 훑기의 end로 움직이므로 기본값에서 W2의 차이를 훑기 뒤 약 2초 동안만 미룬다(거래소에서 체결이 이어지는 동안 미루는 것이 아니다)"

[[claim]]
id = "V-WATCH-10"
statement = "W1·W2·W3·W4를 설계 간격(1초, 1초, 2초, 5초)으로 돌린 모의 1분(수동 시계, 실제 rest::Guard를 거친 모델 거래소, 요청 지연 0)에서 5초에 체결 30개를 고르게 주면 대조 요청은 W1 60 + W2 60 + W3 30 + W4 12 = 162개, 초당 2.7 이하이고 차이도 실패한 라운드도 없다. 5초에 100개면 192개(초당 3.2; 정상 상태는 훑기당 4쪽, 초당 3.3)로 설계 예산을 넘지만 W4는 12 훑기를 모두 자기 라운드에서 끝내고 정상 상태의 창은 15초다. 열린 주문 500개(W1 라운드 11쪽)에서는 가드가 10초에 60을 지키며 W1 라운드를 늘리지만 하트비트마다 W1·W2의 나이는 10초 아래다"
why = "완료 기준이 요구하는 대조 예산(2.7 req/s, 설계 §7.5)을 잰다. W4의 겹침과 모든 커서 규칙이 큰 부하에서 그것을 넘는다는 충돌(소유자 질문 1)을 숫자로 보인다. 많은 열린 주문에서 가드가 W1·W2를 게이트의 10초 너머로 늘리면 OMS가 감시 없음으로 거래를 멈춘다"
level = "단위(sans-IO 엔진과 sans-IO 가드, 수동 시계)"
scope = "시험 쪽 스케줄러(10ms 단계, 가드 앞에서 기다리는 요청은 먼저 온 것부터), 엔진 시험 도구의 모델 거래소(열린 주문, 포지션, 체결, 지갑)와 시험 저널: 시험 3개"
real = "워처의 Engine, W1, W2, W3, W4, rest::Guard, ADR-011 형식으로 쓴 저널 파일"
simulated = "Bybit(모델 거래소, 지연 0), OMS(시험 도구), 요청을 내보내는 클라이언트(시험 쪽 스케줄러), 시계(수동)"
faults = "5초에 체결 30개와 100개(고르게, 저널이 같은 단계에 기록), 열린 주문 500개"
criterion = "30/5초: 경로별 60·60·30·12와 합 ≤ 162, 비율 ≤ 2.7, Mismatch·확정·실패한 라운드 0. 100/5초: 2.7 < 비율 ≤ 3.4, W4 훑기 12개가 각자의 라운드 시각에 끝나고 첫 훑기 뒤의 창이 16초 이하, Mismatch 0. 500개: 어느 10초에도 요청 ≤ 60, 첫 하트비트 뒤 모든 하트비트에서 W1·W2의 나이 < 10초, Mismatch 0, W1·W2의 실패한 라운드 0"
