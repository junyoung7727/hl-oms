[[claim]]
id = "V-DOUBT-2"
statement = "'찾을 수 없음'은 전송 만료 + 여유가 지난 뒤의 조회일 때만 주문을 닫는다. 거래소가 만료를 강제하지 않는 설정에서는 절대 닫지 않는다. 결과 불명인 주문은 운영자의 resolve 명령으로 닫힌다. 결과 불명이 아닌 전송 대기 주문에 대한 '찾을 수 없음'은 만료 뒤의 조회라도 무시한다. '찾을 수 없음'으로 닫은 주문이 전송 응답이나 열린 주문 목록에서 열려 있다고 나오면 OpenAfterClose를 제기하고, 그 주문의 체결은 기장하고 FillAfterClose를 제기한다. 접수된 주문에 대한 '찾을 수 없음'은 주문을 닫지 않고 예약을 유지하며, 접수 시각 + 여유 뒤의 조회면 StatusConflict를 제기한다"
why = "너무 일찍 닫으면 그 뒤에 놓인 주문이 예약 없이 체결된다"
level = "단위"
scope = "여유 10초의 경계 양쪽. 실제 프로세스에서는 만료 1.5초 + 여유 0.3초 이전에 닫히지 않음을 시간으로 확인"
real = "oms-core. e2e에서는 oms-node 프로세스와 실제 시계"
simulated = "e2e의 거래소는 simvenue이며 요청 1건을 버린다"
faults = "요청 유실"
criterion = "닫히는 시각이 만료 + 여유 이후인지, 예약이 그때까지 유지되는지"
tests = ["core/not_found_closes_an_in_doubt_order_only_after_expiry_plus_margin", "core/not_found_never_closes_when_the_venue_does_not_enforce_expiry", "core/not_found_is_ignored_while_the_send_is_simply_outstanding", "e2e/a_lost_request_is_closed_only_after_its_send_window", "core/f3_placed_evidence_for_an_order_closed_as_not_placed_is_flagged", "core/f3_a_reappearing_order_is_reported_as_open_after_close", "core/a_fill_after_any_kind_of_close_is_booked_and_flagged", "core/an_acknowledged_order_the_venue_no_longer_knows_is_reported_not_closed"]
