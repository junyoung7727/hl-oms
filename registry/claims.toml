[[claim]]
id = "V-LIVE-3"
statement = "잃음 뒤(또는 내구화된 코어가 그 전략을 보류 중일 때) 거래 소켓의 hello는 Input::Session(Hello)를 control 레인에 넣고, strategy_link_restored가 내구화된 뒤에 답한다: 답이 온 순간 같은 연결의 status(내구화된 기록만)에 보류가 없고 저널 파일에 복구가 있다. 복구가 아직 답을 받지 않은 동안 같은 전략의 hello(다른 연결이든 같은 연결이든)도 복구를 넣으므로 그 답도 앞 복구가 내구화된 뒤에 온다(코어에서는 기록 없는 not held, 커밋 단계가 순서대로 답한다). 큐를 기다리던 잃음은 복구보다 먼저 넣는다(표의 hello가 넣는 순서: lost, hello). 큐가 가득이면 잃음은 버리지 않고 틱마다 다시 넣는다. 재시작 뒤 보류는 저널에서 복원되고 다음 hello가 푼다. 시작할 때는 걸린 일반 주문이 있는 적힌 전략만 무장한다: 프로세스에서 강제 종료(SIGKILL) 뒤 다시 붙지 않으면, 일반·감소 전용 주문이 걸린 a는 시작 5초 뒤 no request for 5000 ms로 잃음이 되고 일반 주문만 취소되며, 감소 전용 주문만 걸린 b는 무장하지 않는다. 걸리지 않은 전략의 hello는 기록하지 않는다. 큐가 가득이라 복구를 넣지 못한 hello는 거절되고 연결을 세지 않으며, 다음 hello가 다시 복구를 넣는다. 재시작 전부터 코어가 보류 중인 전략은 시작 때 다시 잃음으로 알리지 않고 다음 hello가 복구한다. 코어가 보류 중이면 [liveness]에 적히지 않은 전략의 hello도 복구를 넣는다"
why = "전략이 답을 받은 뒤의 첫 일반 주문이 보류로 거절되면 안 되고, 잃음과 복구가 겹쳐도 잃음의 취소가 사라지면 안 된다"
level = "단위, 통합"
scope = "코어 시험, 노드의 표(큐가 가득인 경우 포함), 실제 oms-node·simvenue 프로세스(재시작 한 번)"
real = "서버의 hello 처리, 커밋 단계와 읽기 모델(내구화된 기록만), 저널, 복구"
simulated = "거래소(simvenue), 큐가 가득(표 시험의 주입한 함수)"
faults = "잃음 뒤 hello, 복구가 답을 받기 전의 두 번째 hello, 큐가 가득, 재시작, 강제 종료 뒤 다시 붙지 않음"
criterion = "hello 직후 status의 strategies.a.link.held와 holds, 저널의 strategy_link_restored 수, 표의 계획(lost_first, restore). 넣은 결함과 잡은 시험: 내구화 전 답(M165), 큐가 거절한 잃음을 보낸 것으로 읽음(M166), 기다리던 잃음을 건너뜀(M167), 복구가 답을 받기 전의 hello에 곧바로 답함(M169), 시작에서 무장하지 않음(M170), 감소 전용 주문으로 무장(M171), 노드의 잃음을 무시한 복구와 기다리던 잃음을 넣지 않는 hello(저장소 밖 mut.py)"
