not_covered = "실제 Bybit에 POST를 보낸 적이 없다(키가 없다): Order 권한이 일괄 취소를 허락하는지, 미체결이 없을 때의 답(Q11.7), Content-Type과 바이트가 같은 본문을 거래소가 요구하는지는 확인하지 않았다. 루프는 시험 장치와 실행 시험에서만 실제 Client, 세기 태스크, Inflight와 함께 http-fake에 대해 돌았다. 걸린 연결이 거래소 쪽에서 닫혔는지는 보지 않았다(http-fake가 적지 않음; 끊긴 태스크가 더 보내지 않는 것만 봄). 걸린 포지션 요청의 abort는 이 주장의 시험이 보지 않는다(실행 시험의 몫, V-WATCH-13). 터무니없이 긴 값의 20행은 3,500 단위를 넘을 수 있다(송신기가 나눔). 일괄 취소가 요청 제한에서 기다리는 동안 다른 태스크가 래치·403 멈춤을 걸면 보내지 않은 그 요청을 Failed로 센다(C-WATCH 11부 알려진 한계, 검토 1 N1). 모르는 orderStatus는 열리지 않은 주문으로 읽힌다(스펙의 규칙; 소유자 결정 몫, 검토 1 N2). Dec는 소수 8자리까지만 읽어 9자리 이상의 liqPrice를 모름(거래소가 청산가를 주지 않음)으로 써 원인을 틀리게 말한다(수는 만들지 않는다). KillLoop의 poll 한 번은 열린 요청의 기한 하나만 처리하므로, 오래 poll하지 않은 실행은 지난 기한 하나에 poll 하나씩 따라잡는다(늦어질 뿐 요청 둘이 열리지 않는다). 세기 태스크는 쪽이 돌아온 때의 시계로, 루프는 실행이 그 쪽을 받은 때의 시계로 기한을 옮기므로, 실행이 쪽을 늦게 받으면 루프가 이미 버린 세기가 한 쪽을 더 물을 수 있다(루프의 다음 Inflight::start에 끊긴다)"

[[claim]]
id = "V-WATCH-13"
statement = "[w5]은 probe_ms 1,000(500~5,000)과 silence_ms 10,000(3,000~60,000)을 받고 [kill]이 있으면 silence_ms ≥ 3 × probe_ms + 3 × request_timeout_ms + 1,000이어야 한다(잃은 탐침 하나도, 틈 한계보다 짧은 워처의 멈춤 하나도 건강한 OMS를 킬하지 않게). [kill]은 marker(OMS의 규칙: 절대 경로, .. 없음, 가리키는 곳이 data_dir 밖, 디렉터리가 있음)와 oms_unit([A-Za-z0-9:_.@-] 1~255자, .service로 끝남, -로 시작하지 않음)이 필수이고 systemd system|user와 stop_wait_ms 10,000(1,000~120,000)을 받으며, mainnet은 [kill] 없이 시작하지 않고 testnet은 warn 한 줄을 남긴다. sans-IO W5는 [kill]이 없으면 Off, arm 전에는 탐침도 쏨도 없고, Armed와 Rearming에서 앞 탐침을 낸 때부터 probe_ms마다 탐침 하나를 내되 둘을 함께 열지 않으며, 낸 시각 + request_timeout_ms + 1,000 ms 때나 뒤에 답 없는 탐침은 실패이고, 탐침의 답은 온 때 받으며(기한 정각이라도 poll이 적용하기 전이면), 열리지 않은 탐침의 답은 버리고, 2xx JSON에 16자리 16진수 core.instance_id인 답만 정상이다. Armed에서 now − last_good_ms ≥ silence_ms이고 last_good_ms 때나 뒤에 낸 탐침이 실패했을 때만 Fire를 한 번 내고 Killing에서는 탐침이 없다. 두 시각이 2 × probe_ms + request_timeout_ms보다 멀면 W5가 가진 시각을 모두 그 틈만큼 옮기고 warn 한 줄을 남긴다(보지 못한 시간은 침묵이 아니다). kill_ended 뒤에는 정상 응답 하나가 Armed로 돌리고, 정지를 빚졌으면 그 응답이 OwedHalt 하나를 내며(진행 중에는 둘째가 없음) latched나 already latched로 시작하는 답이면 늦은 정지 P1과 Armed, 그 밖에는 빚이 남고 첫 실패에만 늦은 정지 실패 P1, 실패 뒤의 래치는 해소 줄을 단다. clock::Steady는 안쪽 시계가 뒤로 가도 앞서 준 값보다 작은 값을 주지 않고 그 뒤의 진행은 그대로 더하며 앞으로 뛴 걸음은 지나가게 하고 모든 읽는 쪽에 한 시간선을 준다. oms::admin_kill은 연결 하나에 hello 다음 watcher_kill {detail}을 보내 답마다 timeout_ms, 전체 2 × timeout_ms 안에 result나 이유를 준다. stop::Stopper는 정확히 <systemctl> [--user] --no-ask-password stop -- <oms_unit>을 stdin·stdout null, stderr 비차단 파이프로 띄우고, 틱마다 try_wait만 하며 끝난 뒤에만 stderr를 4 KiB까지 기다리지 않고 읽어, 0이면 Stopped, 다른 끝은 exit <code>: <첫 줄>이나 signal <n>, 주입된 시계의 기한 때나 뒤에 아직 돌면 죽이고 Unconfirmed, 그 뒤의 틱이 거둔다. crates/watcher/src의 글자에 Command::new는 stop.rs에 하나뿐이다. 킬 순서 kill::Kill(U19b3b, sans-IO)은 K1 WriteMarker(기한 2,000 ms, 실패나 기한에도 계속, 늦은 결과는 버림) → K2 Halt(기한 2 × request_timeout_ms + 1,000 ms; latched·already latched·재무장 답만 정지; 열린 시도의 답은 기한 정각이라도 poll 전이면 받고 닫힌 시도의 답은 버림) → K2가 정지하지 못했을 때만 K3 StopUnit(now + stop_wait_ms; 지나면 Unconfirmed, 늦은 결과는 버림) → KillLoop::start의 순서로 내고, 첫 CancelAll과 시작 알림은 그 뒤에만 나온다. 머리는 W5의 침묵, 원래 시계의 마지막 정상 응답 KST(없으면 이 프로세스에서 없음), 킬 마커(씀·이미 있음, 경로를 확인하지 않았으면 그 말, 쓰지 못함(<kind>), 시간 초과), OMS 정지(watcher_kill → <답>, 또는 watcher_kill 실패(<이유>) → systemctl stop <unit>: 정지됨·실패·정지 확인 못 함)를 말하고 K2가 실패하고 멈춤이 확인되지 않으면 X8 줄을 달며, 자유 문구는 글자 경계에서 200 UTF-16 단위로 잘리고(BMP 밖 글자는 2단위) 제어 문자가 없어 머리는 침묵 10초에서 가장 길 때 1,029 단위이고 침묵의 초 문구 글자 하나마다 1단위 늘어 가장 길 때 1,048 단위다(래치한 답도 같이 자름). 루프를 시작할 때 halt_owed = !halted && !(stopped && marker_in_place)이고 marker_in_place는 Written·AlreadyPresent와 marker_checked다; StopOutcome은 Latched·StoppedMarked·StoppedUncheckedMarker·StoppedUnmarked·Unconfirmed이고 마지막 알림의 줄과 Ended의 halt_owed가 같다. 빚이 있는 동안 루프에서 앞 시도가 끝난 때(답이 온 때나 기한, 답 없는 K2의 기한 포함)부터 5,000 ms마다 Halt를 다시 내되 둘을 함께 열지 않고(워처 키가 래치되어도), 루프가 끝날 때 열린 시도는 닫으며(halt_open 없음, 늦은 답은 버림, Ended의 halt_owed는 참), 래치한 답은 LateHalt 알림 하나, 빚 없음, 마지막 줄 Latched와 재시도 끝을 준다. Kill::abort는 루프 전이면 그때까지의 머리(끝나지 않은 단계는 진행 중)와 일괄 취소 전 줄, 포지션 조회 안 함 줄의 알림 하나와 Ended(aborted, halt_owed)를, 루프 안이면 루프의 중단을 준다. clock::Steady 위의 Kill은 원래 시계가 킬 전과 루프 중에 60초 뒤로 가도 일괄 취소·재시도·진행 알림을 진행 기준으로 제때 내고, 마커 문구와 머리의 시각은 원래 시계다. kill::write_marker는 무엇이든 있으면 AlreadyPresent로 건드리지 않고, 없으면 자기 임시 이름(옛 것은 먼저 지움)에 0600으로 써 sync_all, hard_link, 임시 이름 지움, 디렉터리 sync_all 뒤 Written, 오류는 Failed(<io 종류>); 문구는 512바이트, detail은 1,024바이트 이하로 글자 경계에서 자르고 OMS의 read_kill_marker는 그 파일에서 marker: <문구>를 읽는다. 실행(U19b3c)은 시작 확인이 끝난 때 W5를 무장하고 그 뒤 모든 단계에서 틱마다 돌린다. [kill]이 있으면 node.kill_marker가 워처의 마커와 같은 파일(가리키는 곳으로 비교)을 가리키지 않는 상태 답(configured false 포함)에 시작을 거부한다(종료 코드 2, 시작 거부 P1, 같은 파일을 가리키는 링크는 됨). W5가 쏘면 마커를 쓰고, watcher_kill을 보내고(답 없는 시도는 K2 기한에 태스크를 끊어 연결을 닫음), 그것이 래치하지 못했을 때만 systemctl stop을 돌린 뒤에야 첫 일괄 취소를 보내며, 루프를 Inflight로 돌려 남은 주문·5xx 일괄 취소·5xx 세기에도 0건 확인까지 round_ms마다(어느 1초에도 둘 이하, 보낸 일괄 취소마다 세기 하나) 되풀이한다. 빚진 정지는 루프 중 5초마다 다시 보내 돌아온 OMS를 킬 동안 래치하고(watcher_kill 하나, 늦은 정지 알림 하나, 마지막 알림 OMS는 래치됨, 워처 키가 10010으로 래치되어 일괄 취소가 없어도), 킬 동안 엔진은 라운드도 하트비트도 내지 않고 검사 나이는 계속 오르며, 끝나면 엔진이 다시 돌고 정상 응답 하나 뒤 W5가 다시 무장한다. 시계가 루프 중 60초 뒤로 가도 다음 일괄 취소는 round_ms + 한 걸음 안에 나간다. OMS가 내려간 채 시작한 워처도 침묵 뒤 킬하고 시작 알림은 이 프로세스에서 없음과 경로 확인 못 함을 말하며, 실행이 남긴 마커는 0600 일반 파일이고 임시 파일이 남지 않는다. 킬 알림마다 포지션 묶음이 붙는다. 루프 뒤 정지를 빚진 킬 다음 OMS가 다시 답하면 watcher_kill 하나를 보내고(K2의 기한, 답이 없으면 늦은 정지 실패 P1 하나, 래치하면 늦은 정지 P1과 해소, W5가 다시 지킴), 시작 뒤 탐침 답의 마커 경로가 다르면 marker_path P1과 함께 마커를 제자리로 세지 않아 그때의 킬이 정지를 빚으며, 킬 중의 종료는 중단 알림 하나로 끝나고 그 뒤 일괄 취소가 없고 systemctl 클라이언트를 죽이지 않으며, 킬이 끝난 바로 뒤의 종료도 포지션 읽기를 기다리던 마지막 알림을 조회 안 함 줄과 함께 보내고, 킬 중의 시작 거부는 중단 알림 다음 거부 P1과 종료 코드 2이고 정지를 빚졌으면(루프 전 K1~K3 중이면 빚으로 봄) 그 전에 watcher_kill 하나(나가 있는 것이 있으면 그것)를 보내 결과를 거부 P1에 적는다. 600초 동안 조회가 실패해도 [s, s + 600 s]의 메시지는 12개 이하이고, 킬의 모든 메시지가 포지션 묶음이나 조회 실패나 조회 안 함 줄을 가지며, 기한 뒤에 답한 포지션 읽기는 시간 초과이고 다음 쪽을 묻지 않는다. 루프 전에 중단된 킬의 Ended는 halt_owed = true다. K2의 detail은 W5: /api/status gave no good answer for <s> s; watcher <name>이고, 루프 중 재시도·루프 뒤 빚진 정지·거부 전 정지의 detail은 W5: 늦은 정지: watcher <name>의 킬이 OMS 래치나 정지를 확인하지 못함이다. 클라이언트의 요청 가드는 clock::Steady를 읽어 시계가 뒤로 간 걸음이 가득 찬 창을 그만큼 늘리지 않고, 서명의 시각은 원래 시계다. 킬 알림은 한 번에 하나씩 낸 순서대로 가고, 16개를 넘게 기다리면 가장 오래 기다린 진행 알림만 버리며 시작·마지막·늦은 정지 알림은 버리지 않는다. 킬 중 이미 나간 엔진 요청의 답이 내는 다음 쪽·상태 요청·watcher_mismatch는 보내지 않고 불일치 P1은 보낸다. 두 틱 사이에 끝난 K3의 정지는 K3 기한 정각의 틱에도 정지됨으로 알린다. 루프 뒤의 빚진 정지는 새 킬을 시작하지 않고, 시작 뒤 탐침 답의 마커 경로가 다시 맞으면 marker_path를 해소한다. 거부 P1의 늦은 정지: 뒤에는 래치한 답만 그대로 적고 다른 답과 오류는 실패(<이유>)로 적으며, 거부가 watcher_kill을 기다리는 동안 SIGTERM이 오면 종료가 이겨 중단 알림 하나만 가고 거부 P1 없이 종료 코드 0이며, 그동안 잡아 두었다 놓은 루프의 답에 실행이 쉬지 않고 돌지 않는다"
why = "W5가 너무 일찍 쏘거나 정상이 아닌 답을 정상으로 읽으면 건강한 OMS를 킬하거나 죽은 OMS를 놓친다. 시작 확인 전에 무장하면 확인되지 않은 계좌로 일괄 취소가 나간다. 워처 자신이 멈춘 시간을 침묵으로 세면 워처가 굶을 때마다 건강한 OMS를 킬하고, 시계가 뒤로 간 만큼 W5와 킬을 잡으면 사라진 OMS의 주문을 아무도 취소하지 않는다. 킬 뒤 곧바로 다시 무장하면 워처가 멈춘 OMS를 10초마다 다시 킬하고, 빚진 정지를 잊으면 systemd가 다시 띄웠거나 멈추기만 했던 OMS가 래치 없이 거래한다. 멈춤 프로그램의 인자가 다른 단위를 담거나 --를 빼면 워처의 결함이 호스트의 결함이 되고, stderr를 막으며 읽으면 단일 스레드 실행의 틱이 멈춘다. mainnet의 워처가 [kill] 없이 돌면 OMS가 죽었을 때 아무도 취소하지 않는다. 첫 일괄 취소가 마커나 정지보다 먼저 나가면 다시 시작한 OMS가 래치 없이 거래하고, 정지된 OMS를 멈추면 쓸데없이 단위를 멈추며, 정지 실패 뒤 멈추지 않으면 살아 있는 OMS가 래치 없이 주문한다. 마커 쓰기나 정지 응답을 기다리면 걸린 디스크나 소켓이 취소를 막고, 있는 마커를 바꾸면 운영자나 앞 킬의 사유를 잃는다. 경로를 확인하지 않은 마커를 제자리로 치거나 빚진 정지를 루프 뒤에만 보내면 돌아온 OMS가 래치 없이 거래한다. 머리의 문구를 자르지 않으면 64 KiB 답 하나가 알림을 여러 메시지로 쪼갠다"
level = "단위(sans-IO W5, 손으로 준 시각과 Steady 위의 수동 시계; 설정의 순수 검증; Steady의 두 스레드)와 통합(oms::admin_kill과 시험의 UnixListener, w5::good_answer와 http-fake의 /api/status, stop::Stopper와 OMS_TEST_DIR 아래의 셸 스크립트, 실제 프로세스와 실제 시간); 단위(sans-IO Kill, 손으로 준 시각과 Steady 위의 수동 시계)와 통합(kill::write_marker와 OMS_TEST_DIR 아래의 실제 파일, spawn_blocking; watcher-conformance에서 OMS 자신의 read_kill_marker); 통합(runtime::run과 loopback http-fake의 Bybit·/api/status·텔레그램·VM, 시험의 admin.sock·monitor.sock, OMS_TEST_DIR 아래의 가짜 systemctl, 시험 디렉터리의 마커, 수동 시계와 실제 시간의 walk_kill)"
