[[claim]]
id = "V-BYBIT-READ-1"
statement = "Bybit 게이트웨이의 조회 일곱 가지는 읽기만 하고, 통째로 읽을 수 있는 응답만 입력으로 넘긴다. 쪽 넘김은 커서가 비고 쪽이 덜 찼을 때만 끝으로 보고, 다 찬 쪽에 커서가 없거나 커서가 그대로이거나 쪽이 20을 넘으면 스냅숏(열린 주문, 포지션, 증거금 보고)을 넘기지 않는다. 주문 상태는 우리 orderLinkId의 행만 보고 realtime, 기간 없는 주문 내역, 코어가 주문을 받은 시각 − 1분부터 7일의 주문 내역 셋 다에 없을 때만 StatusNotFound(첫 조회 전 시각)를 낸다. 체결은 since − 2분부터 7일 이하의 창으로 읽고(창 사이 1ms 겹침, 중복 키는 한 번), 한 번에 30쪽까지 읽고 다 읽은 창까지만 선언한 채 멈추며(오류 아님), 창을 다 읽은 뒤에만 그 끝 직전까지 FillsSynced를 내며, 끝을 알 수 없는 창은 반으로 나누고, 읽을 수 없는 행에서 멈춘다. 실행 행은 execType 표 하나로 Fill(우리 주문이면 order_id, 아니면 외부 체결), Funding, PositionChange(adl, takeover, delivery, settle), UnclassifiedExecution이 된다. 증거금 보고는 totalEquity, totalMaintenanceMargin, totalMarginBalance(U17d), positionIM, 계좌 증거금 모드, 정수 레버리지, maxLeverage로 만들고 한 값이라도 못 읽으면 MarginReportInvalid다. accountMMRate는 보고를 바꾸지 않는다. 이 코드에는 주문 생성·정정·단건 취소 요청이 없다. 설정은 Bybit에서 REGULAR_MARGIN 밖의 계좌 모드 허용을 거절한다. 조회용 REST 응답은 접속 단계 오류만 NotSent로 본다. retCode 10003·10004·10005·10007·10010·33004와 HTTP 401은 키 거부이고 다시 보내지 않는다. 10006과 HTTP 429는 요청 한도다. 10002는 시각 창 밖이다. 10016, HTTP 5xx, 읽을 수 없는 본문, retCode 없는 본문은 응답 없음이다. 그 밖의 0 아닌 retCode는 그 코드의 거부다. 키와 비밀은 데이터 디렉터리 밖의 소유자 전용(0600) 일반 파일에서만 읽고(심볼릭 링크는 거절), Debug 출력에 비밀이 없다. 체결 창의 끝은 지금 − fills_lag_ms다. 체결 키는 <symbol>:<execId>다. 주문 상태의 최종 누적 수량(cum)은 cumExecQty로 채운다. 주문 상태는 New·PartiallyFilled(열림), Filled, Cancelled, Rejected만 해석하고 조건부 주문 상태와 그 밖의 값에서는 결론을 내지 않는다"
why = "Bybit 계좌를 대조할 때 반쯤 읽은 응답으로 포지션·열린 주문을 틀리게 보거나, 닫힌 주문을 500건 한도·서비스 재시작 때문에 없다고 보거나, 펀딩·ADL을 체결로 기장하지 않는다는 전제"
level = "단위"
scope = "loopback 가짜 HTTP 서버(http-fake)에 문서 모양의 응답을 경로별로 준비, 시험 24개"
real = "venue::bybit의 query, exec, rest(서명한 GET), config 검증"
simulated = "Bybit REST 응답(문서 예시를 본뜬 손으로 쓴 JSON)"
faults = "남의 주문 행, 조건부 주문 상태, 다 찬 마지막 쪽, 움직이지 않는 커서, 끝없는 커서, 10016·HTTP 500·502, 읽을 수 없는 행·숫자·소수 9자리, 소수 레버리지, PORTFOLIO_MARGIN, maxLeverage 0, 계좌 유지증거금·증거금 잔고 없음과 못 읽음, 헤지 모드 행, 겹치는 창의 같은 실행"
criterion = "만든 VenueInput 전체(값까지), 보낸 요청의 경로·질의·순서·개수, 창의 시작·끝 시각, 소스에 주문 요청 경로가 없음"
tests = ["node-unit/venue::bybit::exec::tests::a_trade_of_our_order_is_a_fill_of_that_order", "node-unit/venue::bybit::exec::tests::a_trade_of_an_order_that_is_not_ours_is_an_external_fill", "node-unit/venue::bybit::exec::tests::a_funding_row_is_cash_and_never_a_fill", "node-unit/venue::bybit::exec::tests::each_venue_made_execution_type_is_a_position_change_of_its_kind", "node-unit/venue::bybit::exec::tests::every_other_execution_type_is_unclassified", "node-unit/venue::bybit::exec::tests::a_row_that_cannot_be_read_is_an_error_not_an_input", "node-unit/venue::bybit::query::tests::the_status_of_our_order_is_read_from_the_open_order_view", "node-unit/venue::bybit::query::tests::an_order_missing_from_the_open_order_view_is_looked_up_in_the_history", "node-unit/venue::bybit::query::tests::an_order_is_not_found_only_when_neither_view_has_it", "node-unit/venue::bybit::query::tests::a_status_answer_about_another_order_or_of_a_kind_we_never_send_concludes_nothing", "node-unit/venue::bybit::query::tests::the_status_table", "node-unit/venue::bybit::query::tests::open_orders_are_read_through_every_page", "node-unit/venue::bybit::query::tests::a_snapshot_whose_last_page_cannot_be_told_gives_no_input", "node-unit/venue::bybit::query::tests::positions_are_signed_by_side", "node-unit/venue::bybit::query::tests::the_margin_report_maps_the_unified_account", "node-unit/venue::bybit::query::tests::a_margin_answer_that_cannot_be_read_as_a_whole_is_refused_as_a_whole", "node-unit/venue::bybit::query::tests::the_account_mm_rate_field_is_not_used_for_the_judgment", "node-unit/venue::bybit::query::tests::the_venue_setting_and_the_account_mode_are_read_as_they_are", "node-unit/venue::bybit::query::tests::fills_are_read_in_windows_of_at_most_seven_days_each_declared_synced", "node-unit/venue::bybit::query::tests::a_row_that_cannot_be_read_stops_the_sync_before_its_window_is_declared", "node-unit/venue::bybit::query::tests::fills_follow_the_cursor_and_a_window_whose_last_page_cannot_be_told_is_split", "node-unit/venue::bybit::query::tests::a_long_gap_is_synced_over_several_queries_within_the_page_budget", "node-unit/venue::bybit::query::tests::the_gateway_has_no_order_request", "node-unit/config::tests::a_bybit_configuration_loads_and_each_unsafe_value_is_refused", "node-unit/venue::bybit::rest::tests::other_answers_have_their_own_class", "node-unit/venue::bybit::rest::tests::every_auth_code_is_a_rejected_key_after_one_request", "node-unit/venue::bybit::rest::tests::the_credentials_file_must_be_owner_only_and_the_secret_never_prints"]
repro = "cargo test -p oms-node --lib venue::bybit"
supports = "C-GW(Bybit 열), C-MARGIN, ADR-028"
not_covered = "실제 Bybit 응답(문서 예시만 본떴다, 테스트넷 미실행, U-01 허가됨). 빈 커서가 마지막 쪽이라는 것, startTime·endTime이 끝값을 포함하는지, maker 체결의 orderLinkId, execFee의 maker 리베이트 부호, 펀딩·ADL 행이 실행 목록에 실리는지(T15)는 문서에 없다. 조회의 요청 한도(U17). 스트림과 노드 연결은 V-BYBIT-STREAM-1. maxLeverage는 프로세스당 한 번만 읽는다(교차 계좌에서는 어떤 규칙도 쓰지 않는다). 주문 내역 기간이 생성 시각과 갱신 시각 중 무엇을 거르는지, 2분보다 늦게 실리는 실행 행, 변경 직후의 늦은 포지션 응답(ADR-028 §8)"

[[claim]]
id = "V-BYBIT-STREAM-1"
statement = "Bybit 게이트웨이는 시작 확인이 통과하고 막힘이 없을 때만 비공개 스트림에 접속하고, auth(GET/realtime + 만료 시각의 서명, 만료 = 지금 + recv_window)가 확인된 뒤 order.linear·execution.linear를 구독하며, 구독이 확인된 뒤에만 Link를 올린다. 접속마다 세션 번호가 커진다. ping 뒤 ping 간격 안에 pong이 없거나(코어 입력 큐를 기다린 시간은 빼고), 소켓이 닫히거나, 읽을 수 없는 행이나 symbol 없는 행이 오거나, 연결 중 막힘(IP 변경, 키 거부, IP 차단)이 생기면 Link를 내리고, 키 거부와 IP 변경이 아니면 다시 붙는다. 인증 거부, 조회의 키 거부 코드, IP 변경 뒤에는 재시작까지 접속도 요청도 하지 않는다. HTTP 403(REST든 스트림 업그레이드든) 뒤에는 멈춤 시간 동안 REST 요청과 스트림 접속이 없고, 끝나면 다시 붙는다. 구독 거부와 응답 없는 인증은 키 거부가 아니라 다시 시도하고, 인증 응답 전에는 구독을 보내지 않는다. 연결이 올라가 첫 pong을 받았으면 재연결 기다림은 처음 값으로 돌아가고, pong 전에 끊기면 기다림이 계속 는다. 설정한 종목의 주문 행은 OrderStatus(Stream), 실행 행은 실행 분류표를 거쳐 받은 시각이 실린 입력이 되고 다른 종목의 행은 넘기지 않는다. 주문과 취소는 V-BYBIT-ORDERS-1. 시작 확인은 키가 서브계정(isMaster = false)이고 설정의 sub_account_uid의 것이며 쓰기 가능하고 ContractTrade의 Order·Position 권한과 지금의 공인 IP를 포함한 바인딩 IP를 가질 때만 통과한다. 계좌는 REGULAR_MARGIN이고 unifiedMarginStatus가 3–6이어야 한다. 종목마다 settleCoin = USDT이고 단방향(positionIdx = 0)이어야 한다. 하나라도 어긋나면 막고, 시작 확인은 GET만 보내 거래소 설정을 바꾸지 않는다. 공인 IP는 시작할 때와 ip_check_secs마다 https인 ip_echo_url로 읽어 키의 IP와 비교한다. IP 확인의 통과는 시작 확인의 막힘을 풀지 않는다(막힘은 출처마다 따로다). 읽을 수 없는 메시지와 data 목록이 없는 order·execution 토픽 메시지도 끊고 다시 붙는 사유다"
why = "Bybit 연결이 확인되지 않은 키·계좌·구독으로 올라오지 않고, 조용히 죽은 연결을 살아 있다고 보지 않으며, 거부된 키나 차단된 IP로 요청을 계속 보내지 않는다는 전제"
level = "통합"
scope = "loopback 가짜 웹소켓 서버(auth·subscribe·ping 응답을 시험이 고른다)와 가짜 HTTP 서버(REST, IP 확인), 짧게 줄인 시간, 코어 쪽 소비를 멈출 수 있는 입력 큐, 시험 18개"
real = "venue::bybit::gateway(시작 확인·IP 반복, 스트림 반복, 조회, 멈춤), stream, checks, query, exec, rest, venue::start(명령·조회 반복), InputQueues"
simulated = "Bybit 비공개 스트림과 REST(문서 모양의 손으로 쓴 JSON), 공인 IP 확인 서비스, 시간(ping 150ms, 멈춤 600ms)"
faults = "격리 계좌, pong 없음, 읽을 수 없는 실행 행, symbol 없는 행, 소켓 끊김, 인증 거부, 응답 없는 인증, 구독 거부, 연결 중 IP 변경, 조회의 HTTP 403, 스트림 업그레이드의 HTTP 403, 조회의 33004, 거래하지 않는 종목의 행, 가득 찬 코어 입력 큐, 거듭된 재연결 실패, 구독 직후 매번 오는 읽을 수 없는 메시지"
criterion = "코어에 간 입력 전체(Link 순서·세션 번호·사유, 상태·체결 값), 가짜 서버가 받은 메시지와 요청의 순서·개수, 접속 수, 막힘 이유"
tests = ["node-unit/venue::bybit::stream::tests::the_sent_messages_have_the_documented_shapes", "node-unit/venue::bybit::stream::tests::frames_are_read_by_their_documented_fields", "node-unit/venue::bybit::stream::tests::an_order_row_becomes_a_stream_status_of_our_order_or_of_a_foreign_one", "node-unit/venue::bybit::gateway::tests::the_link_comes_up_after_the_checks_auth_and_subscribe_and_stream_rows_become_inputs", "node-unit/venue::bybit::gateway::tests::the_stream_does_not_connect_while_a_boot_check_fails", "node-unit/venue::bybit::gateway::tests::a_missing_pong_takes_the_link_down_and_the_reconnect_is_a_new_session", "node-unit/venue::bybit::gateway::tests::an_unreadable_row_or_a_closed_socket_takes_the_link_down_and_it_comes_back", "node-unit/venue::bybit::gateway::tests::a_refused_stream_auth_blocks_until_the_restart_and_nothing_is_sent_after", "node-unit/venue::bybit::gateway::tests::a_refused_subscription_never_brings_the_link_up_and_is_retried", "node-unit/venue::bybit::gateway::tests::an_ip_change_while_up_takes_the_link_down_for_good", "node-unit/venue::bybit::gateway::tests::an_ip_ban_stops_every_request_for_the_pause_then_the_link_comes_back", "node-unit/venue::bybit::gateway::tests::a_key_rejected_by_a_query_takes_the_link_down_for_good", "node-unit/venue::bybit::gateway::tests::a_403_on_the_stream_upgrade_pauses_every_request_then_the_link_comes_up", "node-unit/venue::bybit::gateway::tests::no_subscription_goes_out_before_the_auth_answer_and_a_silent_auth_is_retried", "node-unit/venue::bybit::gateway::tests::a_row_without_a_symbol_takes_the_link_down", "node-unit/venue::bybit::gateway::tests::time_spent_waiting_on_a_full_core_queue_does_not_count_against_the_pong", "node-unit/venue::bybit::gateway::tests::the_reconnect_waits_start_over_after_a_link_that_came_up", "node-unit/venue::bybit::gateway::tests::a_link_that_fails_before_its_first_pong_keeps_the_waits_growing", "node-unit/venue::bybit::checks::tests::each_wrong_account_fact_blocks", "node-unit/venue::bybit::checks::tests::requests_from_an_address_the_key_is_not_bound_to_are_an_auth_block", "node-unit/venue::bybit::checks::tests::a_unified_status_outside_3_to_6_or_missing_blocks", "node-unit/venue::bybit::checks::tests::the_boot_checks_pass_on_the_configured_account", "node-unit/venue::bybit::checks::tests::a_later_ip_change_blocks_and_an_auth_block_is_not_cleared", "node-unit/config::tests::a_bybit_configuration_loads_and_each_unsafe_value_is_refused", "node-unit/venue::bybit::checks::tests::a_passing_ip_recheck_does_not_lift_a_failed_boot_check"]
repro = "cargo test -p oms-node --lib venue::bybit"
supports = "C-GW(Bybit 열), C-LINK, ADR-028"
not_covered = "실제 Bybit 스트림(테스트넷에 붙여 돌리지 않았다), TLS 접속(시험은 ws://), 인증 실패 응답의 실제 모양(문서에 없다), 재연결 뒤 놓친 메시지를 거래소가 다시 주는지(T4), 비거래 실행이 스트림에 실리는지(T15), 노드 바이너리를 kind = bybit로 띄우는 끝에서 끝까지의 시험(V-BYBIT-NODE-1, failpoints 빌드의 시험용 연결 주소로), 상태 API의 gateway.block 출력(코드 검토만), 참조 가격(V-BYBIT-REFPX-1), 주문 전송(V-BYBIT-ORDERS-1), 정리 스위치의 10초 규칙(V-KILL-1)"

[[claim]]
id = "V-BYBIT-ORDERS-1"
statement = "Bybit 게이트웨이는 주문과 취소마다 결과 하나를 돌려주고 REST 요청을 많아야 하나 보내며 다시 보내지 않는다. 생성은 orderLinkId = 우리 고객 주문번호, category linear, Limit, 단방향(positionIdx 0)으로 보내고 보낸 본문에 서명한다. 요청 시각 + recv_window + 1초가 expires_at보다 늦거나, 막힘이 있거나, 거래하지 않는 종목이거나, 접속이 되지 않으면 보내지 않고 NotSent다. retCode 0은 생성이면 orderId가 있을 때만 Placed(Open, 누적 수량 없음), 취소면 Confirmed. 오류 문서의 0 아닌 코드는 UNKNOWN_CODES가 아니면 Rejected, 그 밖의 모든 응답(문서에 없는 코드, 2xx가 아닌 HTTP, 시간 초과, 끊김, 읽을 수 없는 본문)은 Unknown이다. HTTP 403과 retCode 10018은 IP 차단 멈춤을, HTTP 401과 키 거부 retCode는 키 거부를 건다. 요청은 자리를 잡은 때부터 응답 + 1초까지(응답이 없으면 요청 시각 + recv_window + 1초 + 1초까지) 세므로 보낸 때와 응답(또는 마지막 도착 가능 시각) 사이 어디에 도착하든 어느 1초에도 주문은 8개, 주문과 취소는 합쳐 10개를 넘지 않고, 주문이 8개를 다 써도 취소는 바로 나가며, 차면 기다린다(버리지 않는다). 아무 바이트도 나가지 않은 요청은 자리를 바로 돌려준다. 시작 확인은 설정의 px_tick·qty_step이 거래소 tickSize·qtyStep의 배수가 아니면 막고, 로컬 시계가 거래소보다 500ms 넘게 앞설 수 있으면(시작 확인 전, IP 확인 주기마다, 막힌 동안 10초마다, 왕복 250ms 넘는 측정은 판정 안 함) 생성만 막고 취소와 스트림은 막지 않는다. 서명은 hex(HMAC_SHA256(secret, timestamp + api_key + recv_window + payload))이고 payload는 GET이면 키 순서로 정렬해 보내는 질의 문자열, POST면 보내는 본문 그대로이며, 질의 값은 인코딩하지 않고 뜻을 바꾸는 문자가 있으면 보내지 않는다"
why = "결과를 모르는 주문을 거부로 보거나 다시 보내 두 번 놓지 않고, 만료 뒤에 처리될 수 있는 주문을 보내지 않으며, 거래소 요청 한도를 넘어 IP 차단을 부르지 않는다는 전제"
level = "통합"
scope = "loopback 가짜 HTTP 서버(경로별 응답: 답, 끊김, 무응답, 오류 상태), 고정한 시계, 오류 문서의 코드 번호 목록(2026-11-21), 시각을 입력으로 받는 한도 규칙, 시험 27개"
real = "oms-core::rate, venue::bybit::{answer, orders, rest, checks, gateway}, venue::start(명령 반복)"
simulated = "Bybit REST(문서 모양의 손으로 쓴 JSON), 시간(창 시험은 시각 입력, 9번째 주문 시험은 실제 1초)"
faults = "응답 없음(무응답, 끊김, 502, 읽을 수 없는 본문), 접속 거부, 만료가 1µs 모자람, 기다린 뒤 생긴 막힘, 잔고 부족 거부, orderLinkId 중복, IP 불일치 코드, HTTP 401, HTTP 403, orderId 없는 접수, 취소 대상 없음, 거래하지 않는 종목, 1초에 9번째 주문, 0.3초 걸린 응답 8개, 접속 거부 20번, 거꾸로 간 시계, 앞선 로컬 시계, 느린 시계 응답(252ms), 시계 막힘 중의 취소, 시계 확인의 403, 읽을 수 없는 거래소 시각, 10018, 거래소 단위보다 촘촘한 설정 단위, 읽을 수 없는 단위"
criterion = "코어에 간 결과(종류, 이유, venue_oid, 상태), 가짜 서버가 받은 요청의 경로·개수·본문·서명 머리글, 막힘 이유, 한도 규칙이 돌려준 시각, 지연(0–0.4초)과 임의 도착의 일정 2만 번에서 도착 기준 어느 1초든 주문 ≤ 8·전체 ≤ 10"
tests = ["core/rate::tests::the_ninth_order_in_a_second_waits_while_two_cancels_still_go_out", "core/rate::tests::the_window_slides_with_each_request", "core/rate::tests::cancels_may_take_the_reserve_and_then_block_orders_too", "core/rate::tests::a_clock_that_goes_back_does_not_free_a_slot", "core/rate::tests::a_request_counts_until_one_window_after_it_finished", "core/rate::tests::no_rolling_second_of_arrivals_holds_more_than_the_limits", "node-unit/venue::bybit::answer::tests::every_documented_code_has_exactly_one_class", "node-unit/venue::bybit::answer::tests::anything_but_a_documented_refusal_is_unknown", "node-unit/venue::bybit::answer::tests::code_zero_is_accepted_with_its_object_from_rest_or_ws", "node-unit/venue::bybit::orders::tests::a_create_is_one_signed_limit_order_and_its_ack_is_an_open_order", "node-unit/venue::bybit::orders::tests::an_expiry_inside_the_window_plus_one_second_sends_nothing", "node-unit/venue::bybit::orders::tests::a_block_after_the_wait_sends_nothing", "node-unit/venue::bybit::orders::tests::no_answer_is_unknown_and_nothing_is_sent_twice", "node-unit/venue::bybit::orders::tests::a_dead_venue_is_not_sent", "node-unit/venue::bybit::orders::tests::refusals_are_rejected_and_the_key_and_ip_answers_have_their_effects", "node-unit/venue::bybit::orders::tests::a_cancel_goes_by_client_id_and_has_the_same_classes", "node-unit/venue::bybit::orders::tests::the_ninth_create_in_a_second_waits_while_a_cancel_goes_out", "node-unit/venue::bybit::orders::tests::the_send_time_rule_is_exact_at_the_bound", "node-unit/venue::bybit::orders::tests::a_slot_without_an_answer_counts_until_its_last_arrival_plus_a_second", "node-unit/venue::bybit::checks::tests::a_local_clock_ahead_by_more_than_half_a_second_blocks", "node-unit/venue::bybit::checks::tests::a_slow_clock_answer_proves_nothing", "node-unit/venue::bybit::checks::tests::the_clock_slot_blocks_creates_only", "node-unit/venue::bybit::gateway::tests::a_local_clock_ahead_of_the_venue_keeps_orders_home_but_not_cancels_or_the_link", "node-unit/venue::bybit::gateway::tests::a_ban_met_by_the_clock_check_ends_the_round", "node-unit/venue::bybit::gateway::tests::an_order_and_a_cancel_each_go_out_once_over_rest_and_get_one_result", "node-unit/venue::bybit::gateway::tests::nothing_goes_out_while_blocked_or_for_an_untraded_symbol", "node-unit/venue::bybit::checks::tests::steps_off_the_venue_steps_block_and_unreadable_steps_are_unchecked", "node-unit/venue::bybit::sign::tests::the_strings_to_sign_are_the_venues_examples", "node-unit/venue::bybit::sign::tests::signatures_match_independent_hmac_values", "node-unit/venue::bybit::sign::tests::a_venue_cursor_is_sent_as_is_and_other_characters_are_refused", "node-unit/venue::bybit::rest::tests::a_get_is_signed_over_the_query_string_it_sends", "node-unit/venue::bybit::rest::tests::a_post_is_signed_over_the_exact_body_it_sends"]
repro = "cargo test -p oms-core --lib rate && cargo test -p oms-node --lib venue::bybit"
supports = "C-GW(Bybit 열: G-1, G-2, G-3, G-4, G-5, 요청 한도), ADR-028 §7d"
not_covered = "실제 Bybit 주문 응답과 코드의 실제 뜻(T6, 테스트넷 미실행, U-01 허가됨), WS Trade와 REST의 한도 공유(T8), WS Trade 경로(V-BYBIT-TRADE-1), 참조 가격(V-BYBIT-REFPX-1)과 노드 끝에서 끝까지(V-BYBIT-NODE-1), 저널 flush 실패 때 요청 0(V-BYBIT-NODE-1, 커밋 단계가 명령을 내구화 뒤에만 넘기는 것은 V-COMMIT 계열이 가상 거래소로 보인다), 감시자·다른 프로세스가 같은 UID로 보내는 요청(세지 않는다), 접속 단계 오류가 바이트를 내보내지 않았다는 가정(A-08), 접수된 취소가 적용되지 않는 경우(U18b·U19), 운영 중 틱·수량 단위 변경"

[[claim]]
id = "V-BYBIT-TRADE-1"
statement = "Bybit 게이트웨이는 주문과 취소를 WS Trade(/v5/trade)로 보내고, REST로는 WS Trade 연결 작업이 그 요청의 아무 바이트도 쓰지 않았을 때(인증된 연결 없음, 쓰기 전 막힘)만, 막힘을 다시 본 뒤 같은 한도 자리와 같은 요청 시각으로 보낸다. 요청은 두 경로를 합쳐 많아야 한 번 나가고 한도 자리는 경로와 상관없이 하나다(1초 안의 9번째 생성은 경로가 섞여도 기다린다). 요청은 reqId(생성 c + 고객 주문번호, 취소 x + 36진 시도 번호 + 고객 주문번호, 36자 이하), header의 X-BAPI-TIMESTAMP·X-BAPI-RECV-WINDOW, op, REST 본문 하나인 args로 되어 있다. 응답은 REST와 같은 표로 분류하고, 20006·10019·10429는 결과 불명, 10019는 연결을 닫고 다시 열며, 10403과 10018은 IP 차단 멈춤을, 키 거부 코드는 키 거부를 건다. 쓴 요청에 request_timeout_ms 안에 응답이 없거나 그 사이 연결이 내려가면(pong 없음, 끊김, 막힘) 결과 불명이고 어느 경로로도 다시 보내지 않으며, 한도는 요청 시각 + recv_window + 1초 + 1초까지 센다. 늦은 응답은 버린다. 같은 reqId가 기다리는 중이면 다시 쓰지 않는다. WS Trade 연결은 막힘이 없을 때만 IPv4로 접속하고, auth(비공개 스트림의 서명)의 retCode가 0일 때만 올라가며, 0이 아니면 재시작까지 키 거부, 업그레이드의 HTTP 403은 IP 차단 멈춤이다. ping 뒤 간격 안에 pong이 없으면 내려가고, 재연결 기다림은 첫 pong을 받은 연결 뒤에만 처음 값으로 돌아간다. WS Trade는 Link를 움직이지 않는다. 키 거부·IP 차단 응답의 효과는 연결 작업이 다음 쓰기 전에 건다. 기다리는 요청이 없는 늦은 응답도 버리되 그 효과(키 거부)는 건다"
why = "주문 경로가 둘이 되어도 같은 주문이 두 번 놓이지 않고(G-3), 결과를 모르는 요청을 거부나 미전송으로 보지 않으며(G-2), 막힘·차단·거부된 키로 요청을 보내지 않고, 두 경로를 합쳐 거래소 요청 한도를 넘지 않는다는 전제"
level = "통합"
scope = "loopback 가짜 WS Trade 서버(auth·pong·주문 응답을 시험이 고른다: 응답 코드, 침묵, 요청 뒤 끊음, ping 무응답, auth 거부, 업그레이드 403, auth 뒤 읽을 수 없는 메시지)와 가짜 비공개 스트림·가짜 HTTP 서버, 가짜 연결 작업(orders 시험), 막힘을 시험이 정하는 가짜 Host(연결 작업 시험), 짧게 줄인 시간, 시험 23개"
real = "venue::bybit::{trade, orders, answer, gateway}(연결 작업, 경로 고르기, 한도, 분류), oms-core::rate, venue::start(명령 반복)"
simulated = "Bybit WS Trade와 REST(문서 모양의 손으로 쓴 JSON), 시간(ping 150ms, 요청 제한 300ms 또는 5초, 멈춤 600ms)"
faults = "WS Trade 끊김과 복귀, 응답 없는 요청 셋, ping 무응답, 요청을 읽은 뒤 끊김, 20006, 10019, 10429, 10016, 110072, 110007, 10010, 10018, 10403, orderId 없는 접수, 늦은 응답, 기다리는 요청 없는 키 거부 응답, 줄 선 요청 앞의 10403, auth 거부, 업그레이드 403, pong 전에 거듭 끊김, 첫 확인과 REST 사이에 생긴 막힘, 쓰기 직전에 생긴 막힘, 기다리는 중인 reqId, 두 경로에 걸친 1초 9번째 생성, 응답 없는 WS 요청 8개"
criterion = "코어에 간 결과(종류, 이유, venue_oid), 가짜 WS Trade가 받은 메시지(reqId, header, op, args, 주문마다 생성 수)와 가짜 HTTP가 받은 요청의 경로·개수, 막힘 이유, 연결 수와 재연결 간격, 9번째 생성이 나간 시각, Link 입력 수"
tests = ["node-unit/venue::bybit::trade::tests::req_ids_are_unique_per_request_and_fit_the_venue_limit", "node-unit/venue::bybit::trade::tests::a_request_carries_its_id_time_window_op_and_the_rest_body", "node-unit/venue::bybit::trade::tests::the_auth_message_is_the_private_stream_signature", "node-unit/venue::bybit::trade::tests::frames_are_read_by_their_documented_fields", "node-unit/venue::bybit::orders::tests::a_request_goes_over_ws_trade_when_it_is_up_and_not_over_rest", "node-unit/venue::bybit::orders::tests::a_request_not_written_goes_over_rest_once_unless_a_block_came", "node-unit/venue::bybit::orders::tests::a_written_request_without_an_answer_is_unknown_and_not_sent_again", "node-unit/venue::bybit::orders::tests::ws_answers_have_the_rest_classes_and_their_effects", "node-unit/venue::bybit::orders::tests::the_ninth_create_in_a_second_waits_across_both_paths", "node-unit/venue::bybit::orders::tests::a_ws_request_without_an_answer_counts_until_its_last_arrival_plus_a_second", "node-unit/venue::bybit::gateway::tests::orders_go_over_ws_trade_when_it_is_up_over_rest_while_it_is_down_and_back", "node-unit/venue::bybit::gateway::tests::a_silent_ws_trade_makes_every_unanswered_request_unknown_and_nothing_is_sent_again", "node-unit/venue::bybit::gateway::tests::a_ws_trade_that_stops_answering_pings_makes_its_pending_request_unknown", "node-unit/venue::bybit::gateway::tests::a_connection_that_drops_after_reading_the_request_makes_it_unknown", "node-unit/venue::bybit::gateway::tests::answers_20006_and_10019_are_unknown_and_10019_reopens_the_connection", "node-unit/venue::bybit::gateway::tests::a_late_answer_is_dropped", "node-unit/venue::bybit::gateway::tests::a_refused_ws_trade_auth_rejects_the_key_until_the_restart", "node-unit/venue::bybit::gateway::tests::a_ws_ip_limit_answer_starts_the_ban_pause", "node-unit/venue::bybit::gateway::tests::a_403_on_the_ws_trade_upgrade_pauses_every_request", "node-unit/venue::bybit::gateway::tests::ws_trade_reconnect_waits_grow_until_a_pong_then_start_over", "node-unit/venue::bybit::gateway::tests::the_task_writes_nothing_under_a_block_and_no_reqid_twice", "node-unit/venue::bybit::gateway::tests::the_task_applies_a_ban_or_key_answer_before_its_next_write", "node-unit/venue::bybit::tests::endpoints_are_the_documented_hosts"]
repro = "cargo test -p oms-node --lib venue::bybit"
supports = "C-GW(Bybit 열: G-1, G-2, G-3, 주문 경로, 요청 한도), ADR-028 §7e"
not_covered = "실제 WS Trade(테스트넷에 붙여 돌리지 않았다): 응답의 실제 모양(data, header, connId), 실패한 auth와 pong의 실제 모양, 무응답 때 거래소의 동작, reqId 중복의 범위와 기간, WS Trade의 요청 시각 검사가 REST와 같은지(G-4의 가정, ADR-028 §8), WS Trade와 REST의 한도 공유(T8). TLS 접속(시험은 ws://). 노드 끝에서 끝까지는 V-BYBIT-NODE-1. 상태 API의 WS Trade 상태(이 판에 없음)"

[[claim]]
id = "V-BYBIT-REFPX-1"
statement = "Bybit 게이트웨이는 공개 linear 스트림에 거래하는 종목마다 tickers.<symbol>을 구독하고(구독 요청 하나에 토픽 10개까지, 모든 응답이 success: true일 때만 구독됨, 거부되거나 handshake 시간 안에 답이 없는 요청이 하나라도 있으면 pong이 와도 끊고 다시 붙음), 종목마다 그 연결의 스냅숏의 markPrice를 mark로 삼아 RefPrice(px = mark, venue_ts = 메시지 ts의 µs)로 코어에 보낸다. 스냅숏 전의 델타는 버리고, markPrice가 있는 델타는 mark를 바꾸며, markPrice 없는 델타는 든 mark를 그 델타의 ts로 다시 보낸다. 내보냄은 종목마다 ref_price_interval_ms에 많아야 한 번이고(재연결을 넘어 센다) 메시지 없이 다시 보내지 않는다. mark는 연결마다 비운다. 읽을 수 없는 티커 메시지(JSON 아님, type·data·symbol·markPrice·ts 이상, markPrice 없는 스냅숏, 소수 9자리, 0 이하)는 연결을 끊고 다시 붙으며, 거래하지 않는 종목의 메시지는 읽지 않고 버린다. 연결은 막힘이 없을 때만 IPv4로 접속하고, 연결 중 막힘이 생기면 끊고 막힌 동안 다시 붙지 않으며, 업그레이드의 HTTP 403은 IP 차단 멈춤이다. ping 뒤 간격 안에 pong(op = pong, 또는 공개 linear의 op = ping + ret_msg = pong)이 없으면 끊는다. 첫 pong 전에 끊긴 연결은 재연결 대기를 늘리고, 첫 pong 뒤에 끊긴 연결만 대기를 처음으로 되돌린다. 공개 스트림은 Link를 움직이지 않는다. 설정의 ref_price_interval_ms는 1000 이상, ref_price_max_age_us의 절반 이하만 받는다. 시험용 연결 주소 OMS_TEST_BYBIT_WIRING은 다섯 주소의 호스트가 모두 127.0.0.1일 때만 받는다"
why = "가격 범위의 기준이 거래소가 정한 공정 가격이고, 게이트웨이가 앞 연결의 mark를 새 연결에서 다시 보내지 않으며(코어는 마지막으로 받은 가격의 나이를 ref_price_max_age_us로 제한한다. 재연결 직후 간격 안에서는 앞 연결이 보낸 마지막 가격으로 판정될 수 있다), 거래소가 멈춘 종목의 가격을 OMS가 살려 두지 않는다는 전제. 시험용 주소가 실제 거래소나 다른 호스트로 새지 않는다는 전제"
level = "통합"
scope = "loopback 가짜 공개 웹소켓 서버(구독 응답·pong을 시험이 고른다, 공개 linear의 pong 모양)와 가짜 비공개 스트림·가짜 HTTP 서버, 시각을 입력으로 받는 mark 상태, 짧게 줄인 시간(ping 150ms, 간격 300ms), 시험 18개"
real = "venue::bybit::ticker(메시지, mark 상태, 연결 작업), gateway(spawn_tasks, Host, Wiring::of_test), config::validate_bybit, InputQueues"
simulated = "Bybit 공개 스트림(문서 모양의 손으로 쓴 JSON), 시간"
faults = "스냅숏 전 델타, 거래하지 않는 종목, 간격 안의 델타, markPrice 없는 델타, 읽을 수 없는 메시지 16가지, 읽을 수 없는 델타 뒤 재연결, 구독 거부, 구독 무응답(요청 하나, 또는 둘 중 둘째), 첫 pong 전 실패의 반복, pong 없음, 업그레이드 403, 시작 확인 막힘, 연결 중 IP 변경, 종목 12개, 127.0.0.1이 아닌 주소 8가지와 빠진·모르는 키, 간격 0·999·7501ms와 낡음 한도가 작은 설정"
criterion = "코어에 간 입력(RefPrice의 종목·가격·venue_ts, 개수, Link 수), 가짜 서버가 받은 구독 요청의 args와 개수, 접속 수, 막힘 이유, 손으로 적은 기대값"
tests = ["node-unit/venue::bybit::ticker::tests::subscribe_requests_hold_at_most_ten_topics_each", "node-unit/venue::bybit::ticker::tests::frames_are_read_by_their_documented_fields", "node-unit/venue::bybit::ticker::tests::an_unreadable_ticker_frame_is_an_error", "node-unit/venue::bybit::ticker::tests::a_snapshot_then_deltas_give_the_mark_at_most_once_per_interval", "node-unit/venue::bybit::ticker::tests::a_new_connection_knows_no_mark_until_its_snapshot_and_keeps_the_interval", "node-unit/venue::bybit::gateway::tests::the_ticker_mark_becomes_the_reference_price_at_most_once_per_interval", "node-unit/venue::bybit::gateway::tests::an_unreadable_ticker_frame_ends_the_connection_and_the_next_starts_with_no_mark", "node-unit/venue::bybit::gateway::tests::a_refused_ticker_subscription_is_retried", "node-unit/venue::bybit::gateway::tests::an_unanswered_ticker_subscription_ends_the_connection_after_the_handshake_time", "node-unit/venue::bybit::gateway::tests::one_unanswered_subscribe_request_of_two_ends_the_connection", "node-unit/venue::bybit::gateway::tests::a_ticker_connection_that_fails_before_its_first_pong_keeps_the_waits_growing", "node-unit/venue::bybit::gateway::tests::a_missing_ticker_pong_ends_the_connection_and_the_public_pong_keeps_it", "node-unit/venue::bybit::gateway::tests::a_403_on_the_public_upgrade_pauses_every_request", "node-unit/venue::bybit::gateway::tests::the_ticker_stream_connects_only_without_a_block", "node-unit/venue::bybit::gateway::tests::the_ticker_stream_subscribes_ten_topics_per_request", "node-unit/venue::bybit::gateway::tests::the_test_wiring_takes_only_hosts_on_127_0_0_1", "node-unit/venue::bybit::tests::endpoints_are_the_documented_hosts", "node-unit/config::tests::the_bybit_reference_price_interval_is_bounded_by_one_second_and_half_the_freshness_limit"]
repro = "cargo test -p oms-node --lib -- venue::bybit config::tests"
supports = "C-GW(Bybit 열: 참조 가격), ADR-028 §7f"
not_covered = "실제 공개 스트림(테스트넷에 붙여 돌리지 않았다): 구독 거부의 실제 모양, 실제 markPrice의 자릿수, 스냅숏이 구독마다 한 번이라는 것. TLS 접속(시험은 ws://). 델타의 순서 번호(cs)는 읽지 않는다(빠진 델타는 다음 markPrice가 고친다, ADR-028 §8). 연결 하나의 토픽 수 한도. 배포 바이너리에 시험용 주소가 없다는 것(cfg(feature = failpoints), 코드 검토만)"

[[claim]]
id = "V-BYBIT-NODE-1"
statement = "kind = bybit인 oms-node 프로세스(failpoints 빌드, 시험용 연결 주소로 가짜 Bybit에 연결)는 참조 가격이 오기 전 가격 범위가 있는 주문을 RefPriceUnavailable로 거절하고 아무 요청도 보내지 않으며, 공개 스트림의 티커 스냅숏 뒤에는 같은 요청을 받아 WS Trade로 한 번 보내고, 가짜 WS Trade가 그 order.create를 읽을 때 디스크의 저널 파일에 그 주문의 수락 기록이 있다(이 확인은 순서의 증명이 아니다: 기록이 네트워크 왕복보다 먼저 파일에 닿으므로 쓰기 전에 보내도 통과한다. 기록이 내구화된 뒤에만 보낸다는 것은 다음 flush 실패 시험이 증명한다). 새 주문의 저널 flush가 실패하면(OMS_CRASH_AT=sync_error_after_write) 노드는 상태 2로 멈추고 REST와 WS Trade 어느 쪽에도 생성이 닿지 않으며, failpoint 없이 다시 시작하면 그 기록을 찾고 orderLinkId 조회(realtime과 history 두 번이 모두 비었음)로 주문을 '놓이지 않음'으로 닫고, 그래도 생성은 없다. WS Trade가 생성을 읽고 답하지 않으면 주문은 결과 불명(Transport)이 되고, orderLinkId로 묻는 realtime 조회가 열린 주문을 찾아 Working이 되며, 두 경로를 합친 생성은 하나다"
why = "Bybit 게이트웨이를 실제 노드에 붙였을 때 커밋 순서(기록이 내구화된 뒤에만 전송, C-COMMIT, flush 실패 시험)와 결과 불명의 해소(G-2, G-3)가 프로세스 경계를 넘어 지켜진다는 전제. 단위 시험의 가짜 연결 작업이 아니라 실제 바이너리의 연결 전체"
level = "프로세스"
scope = "시험 3개, 각 주문 1건. 노드는 실제 바이너리로 따로 돌고 가짜 REST(http-fake)·비공개 스트림·WS Trade·공개 스트림은 시험 프로세스 안의 loopback 서버. ping 1초, 요청 제한 500ms, 수신 창 1초, 조회 주기 50ms, 정기 열린 주문 조회 60초"
real = "oms-node 프로세스(커밋 단계, 대조기, Bybit 게이트웨이 전체: 시작 확인, 비공개 스트림, WS Trade, 공개 스트림, 조회), 저널 파일, 소켓, 재시작"
simulated = "Bybit REST와 세 웹소켓(문서 모양의 손으로 쓴 JSON), flush 실패는 failpoints 빌드에만 있는 지점, 시험용 주소는 failpoints 빌드에만 있는 환경 변수"
faults = "참조 가격 없음, 저널 flush 실패 뒤 프로세스 정지와 재시작, WS Trade의 무응답"
criterion = "전략이 받은 응답(거절 이유, 수락, 중복), 가짜 WS Trade가 order.create를 읽은 순간 oms_journal::Tail로 읽은 디스크 저널에 OrderAccepted(그 주문 번호와 인스턴스)가 있는지, 가짜 서버가 받은 생성 수(WS Trade, REST POST), orderLinkId가 든 조회 수, 종료 코드, 주문의 phase·doubt·close"
tests = ["pipeline/an_order_waits_for_the_reference_price_and_goes_out_once", "pipeline/a_failed_flush_sends_nothing_and_the_restart_resolves_the_order_as_not_placed", "pipeline/an_unanswered_create_is_found_open_by_its_order_link_id_and_never_sent_again"]
repro = "cargo test -p oms-node --features failpoints --test bybit_node"
supports = "C-GW(Bybit 열), C-COMMIT, ADR-028 §7f"
not_covered = "실제 Bybit(테스트넷에 붙여 돌리지 않았다), TLS(시험은 ws://와 http://), 전원 장애(flush 실패는 프로세스가 살아 있는 경우), 프로세스 강제 종료 중의 WS Trade 전송, 체결과 취소의 끝에서 끝까지, 여러 주문과 요청 한도, 배포 바이너리(failpoints 없음)가 시험용 주소를 읽지 않는다는 것(코드 검토만)"

[[claim]]
id = "V-ALERT-DIRECT-1"
statement = "alert-direct의 송신 스레드는 텔레그램 전송이 처음 다시 보내기(Retry)로 끝난 시도의 시각을 '실패 시작'으로 두고, 텔레그램이 답하면(전달 또는 400·413 거절) 지운다. 보낼 것이 없으면 실패 시작은 생기지 않는다. 둘째 채널을 설정하면 once와 set이 만든 모든 메시지가 같은 분할·같은 한도(50개)의 둘째 보관함에도 통째로 들어가 자기 스레드(alert-second)로 한 번씩 나가고, 넘치면 오래된 것부터 버리고 세어 자기 버림 알림을 보내며, 오류는 그 조각을 두고 그 전송을 끝낸다. 실패 시작에서 second_after_ms(기본 60초)를 넘게 지나면 둘째 채널에만 'Telegram 전송이 N초째 실패함' 알림이 시작 1번, repeat_ms마다 1번, 텔레그램이 다시 답하면 해소 1번 나간다. flush_for는 두 보관함을 모두 기다린다. 둘째 채널이 없으면 스레드도 복사도 없다. 전송 뒤 시간 초과면 같은 조각을 다시 보내므로 텔레그램이 같은 메시지를 두 번 받을 수 있다"
why = "텔레그램이 막혔을 때 그것을 알릴 다른 길(설계 §7.7, D3). U18a2의 OMS 직접 알림이 이 송신기를 쓴다. md-collector와 md-lake는 둘째 채널 없이 쓰므로 동작이 그대로여야 한다"
level = "통합"
scope = "시험 6개(alert 5, second_off 1). 텔레그램은 loopback http-fake(500, 400, 200을 바꿔 가며), 둘째 채널은 시험 안의 가짜(성공, 실패, 300ms 지연). 시계는 시험이 움직인다(+59초, 정확히 +60초, +61초, +5분). flush 주기 20~50ms"
real = "alert-direct의 송신 스레드, 둘째 채널 스레드, 보관함, 반복 규칙, reqwest 클라이언트(loopback HTTP)"
simulated = "텔레그램 Bot API(http-fake), 둘째 채널(시험의 구현), 시계"
faults = "텔레그램 500(계속), 400, 다시 200. 둘째 채널의 계속된 오류와 회복, 느린 둘째 채널"
criterion = "state()의 failing_since_ms와 second 계수(queued, delivered, dropped_total, failures), 가짜 텔레그램이 받은 요청 본문, 가짜 둘째 채널이 받은 문구와 순서, +61초 뒤 1초 안에 알림, 알림이 텔레그램 요청에 없음, /proc/self/task의 스레드 이름"
tests = ["alert/failing_since_set_and_reset", "alert/second_channel_gets_every_message", "alert/second_outbox_bound", "alert/telegram_down_notice_after_60s", "alert/flush_for_waits_for_both", "alert/second_off_by_default", "alert/timeout_keeps_the_part"]
repro = "cargo test -p alert-direct"
supports = "설계 §7.7(둘째 채널, 60초), U18a1 결정"
not_covered = "실제 텔레그램과 실제 둘째 채널 서비스(D3, 정하지 않음). 보낼 것이 없을 때의 텔레그램 장애(탐침 없음, 범위 밖). 둘째 채널이 멈춰 돌아오지 않는 경우(send가 끝나지 않으면 그 스레드가 멈추고 flush_for는 시간 한도까지 기다린다). 프로세스가 끝날 때 둘째 보관함에 남은 것(저장하지 않음). OMS에의 연결은 V-ALERT-1~5(U18a2)"

[[claim]]
id = "V-ALERT-1"
statement = "OMS의 알림 스레드(oms-alert)는 공개된 읽기 모델만 읽으므로, 알림은 그 원인이 된 기록이 내구화된 뒤에만 나간다. 코어가 결정했지만 커밋 단계가 아직 내구화하지 않은 계좌 중지는 보내지 않고, 내구화되면 보낸다. flush에 실패한 묶음의 계좌 중지는 어떤 요청에도 나오지 않고, 그 뒤의 새 요청은 치명 알림 하나뿐이다. 치명 알림은 치명 사유와 마지막 내구 seq만 담고(실패한 묶음의 내용 없음) 치명 래치를 처음 본 때 한 번 나가며, 그 뒤에는 조건을 평가하지 않는다: 유예가 지난 연결 끊김도 시작하지 않고, 읽기 모델에서 사라진 중지도 해소를 보내지 않는다. 평가가 읽기 모델을 읽은 뒤 래치가 걸려 있으면 그 평가는 시작 알림도 set도 하지 않는다. 종료는 래치가 걸려 있으면 받은 종료 코드와 상관없이 치명 알림을 넣고 전송을 기다린다. 프로세스에서: 감소 전용 상태로 들어가는 기록의 flush가 실패하면 노드는 종료 코드 2로 exit_flush_ms + 5초 안에 끝나고, 가짜 텔레그램은 시작 알림과 치명 알림만 받으며(첫 시도 500 뒤 종료 전 전송에서 다시) REDUCING에 관한 것은 없다. 시작 뒤 첫 flush(Boot 기록)가 실패하면 설정이 활성화되기 전이어도 노드는 종료 코드 2로 끝나고, 가짜 텔레그램은 치명 알림 하나만 받는다(종료 전 전송)"
why = "ADR-004의 '내구화 전에는 아무것도 밖으로 나가지 않는다'를 알림도 지켜야 한다. 복구한 노드가 모르는 사건을 사람에게 알리면 운영자가 저널에 없는 상태를 찾게 된다(ADR-029)"
level = "통합"
