not_covered = "실제 거래소에 관한 것 전부: 계좌 가치와 증거금의 계산(T1, T2), 수수료와 펀딩이 어느 잔고에서 나가는지(T3), 감소 전용 주문의 처리(T5, 문서 인용을 가정으로 적었다). 취소가 체결보다 먼저 닿는 것. 주문을 받은 뒤 가격이 움직여 넘은 노출. 청산(모형에 없다). 증거금 구간. 여러 종목. 노드 프로세스를 실제로 며칠 돌리는 것(여러 날 실행은 가상 시간이다). 저널의 디스크 바이트(건수만 센다. 저널은 지워지지 않는다, U-04)와 증거금 기록이 아닌 기록의 수. margin_days의 seed는 표준 실행의 10분의 1이다"

[[claim]]
id = "V-MARGIN-10"
statement = "Hyperliquid 게이트웨이는 문서의 clearinghouseState 응답 예를 증거금 보고 입력으로 옮긴다: 계좌 가치는 marginSummary.accountValue, 포지션마다 종목, 부호 있는 수량, 포지션 가치, 사용 증거금, 증거금 방식, 레버리지, 최대 레버리지. 어느 포지션이든 maxLeverage가 없거나 0이거나 정수가 아니면 보고 전체를 사유와 함께 거부 입력(MarginReportInvalid)으로 바꾸고, 멀쩡한 다른 포지션도 보고하지 않는다. 계좌 가치, 수량, 포지션 가치, 사용 증거금, 레버리지 가운데 하나라도 없거나 읽을 수 없을 때, 증거금 방식이 isolated도 cross도 아닐 때, 포지션 목록이 없을 때도 같다. 어떤 값도 0이나 기본값으로 채우지 않고 어떤 포지션도 건너뛰지 않는다. 설정에 없는 종목의 포지션도 보고에 남는다(번역 함수는 설정된 종목을 받지 않는다). activeAssetData 응답 예는 그 종목의 거래소 설정 입력(증거금 방식, 레버리지)이 된다. 방식이 isolated도 cross도 아니거나, 레버리지가 정수가 아니거나, 응답이 다른 종목의 것이면 입력을 만들지 않는다(설정은 모름으로 남아 그 종목이 막힌다). userAbstraction 응답(문자열 하나)은 글자 그대로 계좌 모드 입력이 된다. 문서에 없는 문자열을 문서에 있는 값으로 바꾸지 않고, 문자열이 아니거나 64자를 넘으면 입력을 만들지 않는다. 세 조회의 요청 본문은 문서의 것과 같다(clearinghouseState, activeAssetData, userAbstraction). 게이트웨이의 요청 예산은 취소를 막지 않으므로 취소 500건 뒤에는 조회가 기다린다: 가득 찬 예산(1200)에서는 700이 남아 증거금 조회가 바로 나가고, 시작 직후(600)에는 100이 남아 10.1초, 빈 예산에서는 15.1초를 기다린다"
why = "증거금 규칙이 읽는 숫자는 모두 이 번역을 거친다. 필드를 하나 잘못 옮기면 규칙이 틀린 값으로 판정한다"
level = "단위"
scope = "게이트웨이의 순수 번역 함수(JSON 응답 → 코어 입력)와 요청 본문 함수. 문서의 응답 예가 입력. 요청 예산은 시각을 시험이 주는 단위 시험"
real = "oms-node(venue/hyperliquid/wire.rs, venue/hyperliquid/mod.rs의 Budget)"
simulated = "응답은 시험이 입력. 거래소에 묻지 않는다"
faults = "maxLeverage 없음, 0, 문자열, null, 음수, 소수, u32 초과, 배열. 소수 필드 없음, 숫자가 아닌 문자열, 빈 문자열, JSON 숫자, null, 지수 표기, NaN, 소수 9자리. 모르는 증거금 방식. 종목 이름 없음. 포지션 목록 없음"
criterion = "C-MARGIN의 'Hyperliquid 조회'. 기대값은 문서 예의 소수를 손으로 1e-8 단위 정수로 적었다. 변이 M67~M76, M79"
tests = ["node-unit/venue::hyperliquid::wire::tests::documented_clearinghouse_state_parses_to_a_margin_report", "node-unit/venue::hyperliquid::wire::tests::missing_zero_or_unparseable_max_leverage_rejects_the_whole_report", "node-unit/venue::hyperliquid::wire::tests::any_unparseable_number_rejects_the_whole_report", "node-unit/venue::hyperliquid::wire::tests::a_position_on_an_unconfigured_coin_is_kept", "node-unit/venue::hyperliquid::wire::tests::documented_active_asset_data_parses_leverage_and_mode", "node-unit/venue::hyperliquid::wire::tests::user_abstraction_values_parse_and_an_unknown_value_stays_unknown", "node-unit/venue::hyperliquid::wire::tests::margin_and_setting_request_json", "node-unit/venue::hyperliquid::tests::a_full_cancel_burst_leaves_the_margin_query_waiting_for_a_known_time"]
repro = "cargo test -p oms-node --lib venue::hyperliquid"
supports = "C-MARGIN"
not_covered = "실제 응답이 문서의 예와 같은지, 필드의 뜻이 유도한 것과 같은지(T1, T2). 어느 userAbstraction 값이 표준 모드인지(T10), 포지션이 없을 때 activeAssetData가 레버리지를 주는지(T11). activeAssetData의 응답 예는 저장소의 조사 문서에 없고 문서와 다시 대조하지 않았다. 게이트웨이가 조회를 실제로 보내는 경로(HTTP)는 시험하지 않는다. HTTP 429일 때의 동작. 거래소가 실제로 세는 weight. 요청 예산을 여러 조회가 다투는 순서와 조회 간격만큼 더 길어지는 대기"

[[claim]]
id = "V-WIRE-ID-1"
statement = "고객 주문번호 형식 Base32Pair는 VenueClientId와 일대일이고 27자(36자 이하, 0-9a-v와 -)이며 같은 입력에 같은 문자열을 내고, 서로 다른 100만 개 주문에 서로 다른 100만 개 문자열을 낸다. 해석은 그 형식이 쓴 문자열만 받는다(대문자·다른 길이·다른 구분자·64비트 초과·16진수 형식은 None). Hex128은 기존 to_hex/parse_hex와 같고, 가상 거래소와 Hyperliquid 게이트웨이는 Hex128을 선언한다"
why = "Bybit orderLinkId로 낸 주문을 우리 것으로 알아보고 남의 주문을 우리 것으로 잘못 읽지 않으며, 기존 두 거래소의 요청은 바뀌지 않는다는 전제"
level = "단위"
scope = "경계값 36쌍, 100만 개 주문(인스턴스 2개 × 50만), 잘못된 문자열 11개"
real = "WireIdForm::encode, WireIdForm::decode, 두 게이트웨이의 WIRE_ID 상수"
simulated = "없음"
faults = "없음"
criterion = "왕복 일치, 길이 27, 문자 집합, 중복 0, 잘못된 문자열 전부 None, 두 상수가 Hex128"
tests = ["core/ids::tests::hex128_is_the_hex_form_of_today", "core/ids::tests::base32_pair_roundtrips_and_fits_an_order_link_id", "core/ids::tests::base32_pair_gives_a_million_distinct_ids", "core/ids::tests::base32_pair_decoding_is_strict", "node-unit/venue::tests::the_gateways_of_today_write_the_hex_form"]
repro = "cargo test -p oms-core --lib ids::tests && cargo test -p oms-node --lib venue::tests"
supports = "C-GW"
not_covered = "Bybit가 이 형식을 실제로 받는지, orderLinkId 재사용·유일성 범위(T1). Bybit 게이트웨이는 아직 없다. 상태 API의 venue_client_id가 Base32Pair로 출력되는 경로는 Bybit 게이트웨이가 생길 때 시험한다(지금은 두 게이트웨이 모두 Hex128이라 출력이 전과 같다)"
