[[claim]]
id = "V-FILL-1"
statement = "체결은 한 번만 기장되고, 접수 응답보다 먼저 와도, 주인을 아직 몰라도, 수량을 넘어도 버려지지 않는다. 기장은 주문의 누적 수량·금액·수수료와 계좌·전략의 포지션을 늘리고, 예약을 체결량과 남은 예약 가운데 작은 쪽만큼 줄인다. 대기 체결이 상한(max_parked_fills, 기본 1,024건)에 이르면 다음 체결은 기다리지 않고 외부 체결로 기장하며 ParkedFillOverflow를 제기한다. 주문과 종목이나 방향이 다른 체결은 그 주문에 기장하지 않고 외부 체결로 계좌에 기장하며 FillFieldConflict를 제기한다"
