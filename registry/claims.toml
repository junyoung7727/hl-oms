not_covered = "실제 텔레그램으로의 시작·정지 알림. Hyperliquid·Bybit 노드 프로세스의 알림(가상 거래소 노드만). 종료 전 전송이 exit_flush_ms를 다 쓰는 경우(시험은 바로 또는 5초 재시도 한 번에 끝난다). 시험 디렉터리가 저장소 안이면 좋은 토큰 파일을 읽는 확인은 그 규칙의 거부를 확인하는 것으로 바뀐다. 설정이 활성화되기 전의 종료 코드 3이 아무것도 보내지 않는 것(코드만, 시험 없음). 게이트웨이 시작·관리 소켓·모니터 소켓·신호 처리기 실패의 시작 실패 알림(거래 소켓 하나로만 시험). 토큰 파일 경로가 설정 Debug와 오류 문장에 보이는 것(C-ALERT 한계, 리뷰 N6). 시험 없음: [alert]가 없으면 시작할 때 warn 한 줄을 남긴다"

[[claim]]
id = "V-HOLD-1"
statement = "증거금 정책이 있으면 워처 불일치와 거래소 변경 아래에서 감소 전용 주문은 통과하고 일반 주문은 거절되며, 킬 래치와 운영자 중지 아래에서는 둘 다 거절된다(TN 표 7-7). 정책이 없으면 모든 보류가 모든 주문을 거절한다. 새 사유 셋은 기존 사유 뒤에 붙어 기존 사유의 순서가 바뀌지 않는다. 프로세스에서: 운영 소켓의 watcher_mismatch 뒤 일반 주문은 Hold(WatcherMismatch)로 거절되고 감소 전용 주문은 받으며, watcher_kill 뒤에는 감소 전용도 Hold(KillLatched)로 거절된다. 워처 입력의 detail은 비지 않고 1 KiB(1024바이트) 이하여야 한다: 노드와 코어가 각각 거절하고 아무것도 기록하지 않는다"
why = "킬 루프는 미체결 0건을 확인해야 끝나므로 어떤 새 주문도 받으면 안 되고, 불일치나 거래소 변경에서는 포지션을 줄이는 길을 막으면 안 된다(설계 R5, Q22)"
level = "단위, 통합"
scope = "보류 사유마다 한 줄(증거금 정책 있음, 신선한 보고, 롱 2), 정책 없음 한 경우, 사유의 순서. 실제 oms-node·simvenue 프로세스 하나(증거금 정책)"
real = "oms-core, oms-node 프로세스(운영 소켓, 코어 스레드, 커밋 단계, 저널), simvenue 프로세스"
simulated = "워처의 입력(시험이 운영 소켓으로 보냄), 거래소(simvenue)"
faults = "같은 입력 두 번, 빈 detail, 1025바이트 detail, 거래 소켓에서의 워처 입력, 모르는 검사 이름"
criterion = "거절 사유 목록에 그 Hold가 있는지, 감소 전용 주문의 접수 여부, holds의 정확한 목록, 저널의 hold_set 개수. 결함(KillLatched가 일반 주문만 막음)을 넣어 잡는 것을 확인했다(M125)"
tests = ["core/the_hold_table_of_table_7_7", "core/the_new_holds_come_last_in_their_order", "core/a_watcher_input_without_a_detail_is_refused", "node-unit/watcher_mismatch_over_the_admin_socket_refuses_plain_orders_only"]
repro = "cargo test -p oms-core --test holds; cargo test -p oms-node --test holds_node watcher"
supports = "C-HOLD의 보류 표와 워처 입력, ADR-030 §7, ADR-008 §7"
not_covered = "실제 거래소. 감시 없음(U18b4)과 전략 연결(U18b3)의 줄. 거래소가 감소 전용 주문의 포지션 확대를 실제로 막는지(T5)"

[[claim]]
id = "V-HOLD-2"
statement = "clear_hold는 고정 코드로 거절한다: 걸려 있지 않음(not_held), 메모 없음(note_required), 이 프로세스의 킬 루프가 답하지 않음(kill_unconfirmed), 코어의 장부에 미체결이 있음(kill_orders_open, 킬 루프의 답이 confirmed든 unsupported든, kill_unconfirmed 다음에 본다), 거래소 변경 뒤 포지션을 아직 읽지 않음(venue_change_pending). 거절은 기록도 명령도 남기지 않는다. 래치 아래에서도 cancel-all은 받고, 거래소가 취소를 확인해 장부가 비면 킬의 해제를 받는다(코어와 가상 거래소 프로세스). 받으면 hold_cleared 하나와, 킬이면 KillStop 하나. 거래소 변경의 해제와 불일치 확인은 따로다. resume은 킬과 워처 불일치를 풀지 않는다. omsctl clear-hold는 세 사유와 메모를 읽는다. 운영자 중지가 없으면 resume은 오류다"
why = "사람만 풀어야 하는 보류가 다른 명령이나 확인 없는 해제로 풀리면 킬 스위치가 뜻을 잃는다(ADR-030, 소유자 질문 2)"
level = "단위"
scope = "코드마다 한 경우와 받는 경우, 거래소 변경의 두 단계, 운영자 중지와 함께 걸린 킬, 열린 주문 둘과 두 가지 답(confirmed, unsupported), 실제 oms-node·simvenue 프로세스에서 걸린 주문 둘과 cancel-all, omsctl 인자"
real = "oms-core, oms-api ctl, oms-node·simvenue 프로세스(가상 거래소의 unsupported 답과 취소)"
simulated = "코어 시험에서 킬 루프의 답(시험이 KillLoopEnded를 넣음), 거래소 포지션 응답, 취소 확인"
faults = "공백뿐인 메모, 같은 해제 두 번, 운영자 중지가 없을 때의 resume"
criterion = "응답 문장의 코드(kill_orders_open은 문장 전체와 개수), 거절 뒤 기록 수와 명령 수가 그대로인지, cancel-all의 응답과 취소 요청 수, 받은 뒤의 이벤트 이름과 명령, holds 목록, status의 open_orders. 넣은 결함과 잡은 시험: kill_unconfirmed 검사 없음(M126, clear_hold_refusals), kill_orders_open 검사 없음(M131, a_kill_is_not_cleared_while_the_book_has_open_orders), resume이 킬도 풂(M134, resume_leaves_kill_and_watcher_mismatch), 메모 검사 없음(M139, clear_hold_refusals)"
tests = ["core/clear_hold_refusals", "core/a_kill_is_not_cleared_while_the_book_has_open_orders", "node-unit/watcher_mismatch_over_the_admin_socket_refuses_plain_orders_only", "core/resume_leaves_kill_and_watcher_mismatch", "api/ctl::tests::clear_hold_parses_its_reason_and_note", "api/tests::wire_examples_of_the_holds"]
repro = "cargo test -p oms-core --test holds clear_hold resume a_kill_is_not; cargo test -p oms-node --test holds_node watcher; cargo test -p oms-api"
supports = "C-HOLD의 clear_hold, ADR-030 §7"
not_covered = "omsctl 실행 파일 자체(본문 함수만, V-HOLD-4의 프로세스 시험에서도 함수로 부른다). 거래소에만 있고 장부에 없는 주문(kill_orders_open은 장부만 센다, C-HOLD 알려진 한계). Hyperliquid·Bybit 노드 프로세스"

[[claim]]
id = "V-HOLD-3"
statement = "킬 래치는 hold_set에서, 그 확인은 kill_loop_ended에서 재실행으로 같은 상태가 되고, 모든 boot가 확인을 지우고 래치의 필드 그대로 Kill 명령을 다시 요청한다. 래치가 없거나 이미 확인된 뒤의 KillLoopEnded는 기록되지 않는다. 모든 게이트웨이 명령은 기록된 이벤트에 command_for를 적용한 것과 같다. 커밋 단계는 Kill을 래치가 내구화된 뒤에만 넘기고, flush가 실패하면 Kill도 응답도 나가지 않으며 다시 시작한 노드에 래치가 없다"
why = "킬 루프의 일괄 취소는 래치가 디스크에 있은 뒤에만 나가야 하고(ADR-004), 앞 프로세스의 확인은 새 프로세스가 모르는 주문을 덮지 않는다(소유자 질문 5)"
level = "단위, 통합"
scope = "코어: 래치, 확인, 재시작, unsupported 확인과 해제, 해제 뒤 재시작. 프로세스 안: 실제 코어 스레드·커밋 스레드·저널 파일로 정상과 flush 실패"
real = "oms-core, oms-node 파이프라인(코어 스레드, 커밋 스레드, 저널 쓰기와 flush), 복구"
simulated = "게이트웨이(명령 채널만 읽음), 저장 장치의 flush 실패(failpoints)"
faults = "재시작, 두 번째 루프 답, flush 실패"
criterion = "명령 목록의 정확한 값, confirmed_at·outcome, 재실행한 상태 = 라이브 상태, 명령을 받은 순간 읽기 모델과 durable_seq, 복구한 상태의 kill. 넣은 결함과 잡은 시험: boot가 확인을 남김(M127), 같은 프로세스의 두 번째 답도 기록(M138, 둘 다 the_kill_latch_and_its_confirmation_…), 커밋 단계가 Kill을 flush 전에 넘김(M130, a_kill_command_leaves_only_after_the_latch_is_durable)"
tests = ["core/the_kill_latch_and_its_confirmation_survive_replay_and_a_boot_asks_for_a_new_loop", "core/every_command_comes_from_command_for_on_a_recorded_event", "pipeline/a_kill_command_leaves_only_after_the_latch_is_durable"]
repro = "cargo test -p oms-core --test holds; cargo test -p oms-node --features failpoints --test pipeline a_kill_command"
supports = "C-HOLD의 킬 명령, C-COMMIT, ADR-030 §7"
not_covered = "Bybit의 실제 킬 루프(U18b2, C-KILL). 게이트웨이 프로세스가 명령을 받은 뒤의 일(가상 거래소의 unsupported 답은 V-HOLD-4)"

[[claim]]
id = "V-HOLD-4"
statement = "킬 마커가 있으면 OMS는 시작할 때 boot 기록 안에서 KillLatched를 걸고(booted, hold_set), 감소 전용을 포함한 어떤 주문도 받지 않으며, 가상 거래소가 unsupported로 답한 뒤 clear_hold kill이 마커를 지운다. 거절된 해제(빈 메모, 다른 사유, not_held, 답을 붙잡아 둔 동안 메모가 있는 kill_unconfirmed)는 마커를 건드리지 않고, 해제 기록의 flush가 실패하면 응답이 없고 노드가 멈추며 마커가 남는다. 그 둘 뒤의 다음 시작은 다시 걸린다. 다음 시작은 걸리지 않고 주문을 받는다. 지우지 못한 마커는 응답이 말하고 다음 시작이 다시 건다. 볼 수 없는 마커 경로(권한)도 건다. 마커 파일은 처음 512바이트를 제어 문자를 바꿔 읽고, 디렉터리·심볼릭 링크도 마커다"
why = "워처가 킬한 사실은 OMS 재시작을 넘어 남아야 하고(U-06), 확인할 수 없는 경로는 킬하지 않았다는 증거가 아니다. 마커를 해제 전에 지우면 래치를 잃을 수 있다"
level = "통합, 단위"
scope = "실제 oms-node·simvenue 프로세스 다섯 개(증거금 정책 하나, failpoints 둘), 재시작 네 번, 권한을 바꾼 디렉터리. 단위: 파일 종류와 내용, 권한 거부, 디렉터리가 아닌 경로"
real = "oms-node 프로세스(시작 순서, 운영 소켓, 코어, 커밋 단계, 저널, 마커 읽기와 지우기), simvenue, omsctl 본문 함수"
simulated = "워처(시험이 마커 파일을 씀), 거래소(simvenue, 일괄 취소 없음), 게이트웨이 답의 지연(OMS_HOLD_KILL_ANSWER), 해제 기록의 flush 실패(OMS_CRASH_ON=clear_hold, sync_error_after_write)"
faults = "읽을 수 없는 디렉터리(0000), 지울 수 없는 디렉터리(0500), 빈 메모의 해제, 두 번째 해제, 확인 전의 해제, 해제 기록의 flush 실패, 거래 소켓의 해제, 재시작"
criterion = "status의 core.kill(출처, 메모, confirmed_at, outcome)과 node.kill_marker, 저널의 boot 기록 이벤트와 kill_loop_ended의 순서, 거절 사유, 마커 파일의 존재, 응답 문장, 종료 코드 2, 저널의 hold_set·hold_cleared 개수. 넣은 결함과 잡은 시험: stat 오류를 마커 없음으로 읽음(M128, node::tests::a_marker_that_cannot_be_examined_latches), 해제를 코어에 넘기기 전에 늘 마커를 지움(M129, 빈 메모 해제 뒤의 마커 검사), 메모가 있을 때만 코어가 결정하기 전에 지움(M132, kill_unconfirmed 거절 시험. 리뷰가 찾은, 앞의 시험을 모두 통과하던 결함), M129와 같은 결함을 flush 실패 시험만으로(M133)"
tests = ["core/the_kill_marker_latches_in_the_boot_record", "core/a_second_trigger_keeps_the_first_note", "node-unit/a_kill_marker_at_boot_refuses_every_order_until_clear_hold_kill_removes_it", "pipeline/a_clear_refused_kill_unconfirmed_leaves_the_marker_and_the_next_start_latches", "pipeline/a_clear_whose_record_fails_to_flush_leaves_the_marker_and_the_next_start_latches", "node-unit/an_unremovable_marker_is_reported_and_latches_the_next_boot", "node-unit/a_marker_path_that_cannot_be_examined_latches", "node-unit/node::tests::the_kill_marker_is_whatever_is_at_its_path", "node-unit/node::tests::a_marker_that_cannot_be_examined_latches"]
repro = "cargo test -p oms-node --test holds_node; cargo test -p oms-node --features failpoints --test crash_points a_clear_; cargo test -p oms-node --lib node::tests; cargo test -p oms-core --test holds marker"
supports = "C-HOLD의 킬 마커, ADR-030 §7, U-06"
not_covered = "root로 실행한 시험(권한 시험 셋은 건너뛴다). 해제가 내구화된 뒤 마커를 지우기 전의 중단(그 사이의 중단 시험은 없다. 내구화 전에 지우지 않는다는 것은 flush 실패 시험과 M133이 보인다). 실행 중 마커(범위 밖). Bybit·Hyperliquid 노드 프로세스"

[[claim]]
id = "V-HOLD-5"
statement = "거래소 변경 보류는 새 이벤트 없이 venue_position_changed, unclassified_execution_noted, 종류가 venue_position_change인 mismatch_raised(넘침 경로)에서 apply가 건다. 그래서 U13b의 이벤트 목록은 그대로이고, U18b 전에 쓴 저널에 이 셋 중 하나가 있으면 재실행한 상태에 보류가 있다. 다른 종류의 불일치는 걸지 않는다. 불일치를 확인해도 보류는 남는다. 각 보류는 한 번만 걸리고 두 번째 원인은 첫 메모를 바꾸지 않는다. 워처 불일치 입력은 걸려 있지 않으면 hold_set 하나를 쓰고 'held'로, 걸려 있으면 아무것도 쓰지 않고 'already held'로 답한다. 워처 킬 입력은 걸려 있지 않으면 hold_set 하나를 쓰고 'latched'로, 걸려 있으면 아무것도 쓰지 않고 'already latched'로 답한다"
why = "불일치 확인 한 번으로 바뀐 포지션을 보지 않고 일반 주문이 흐르면 안 된다. 보류가 결정에 있으면 옛 저널의 재실행이 그것을 잃는다"
