simulated = "Bybit(시작만 한 loopback 가짜, 요청 없음), Telegram(loopback 가짜, mainnet 노드의 시작 실패 알림만 받음)"
faults = "127.0.0.1 밖의 호스트(이름, localhost, 127.0.0.2, ::1, 0.0.0.0, 사용자 부분에 숨긴 호스트), https·ws 체계, 포트 없음, 사용자 부분·질의·조각, 모르는·빠진 필드, JSON이 아닌 값, 상대·.. 경로·없는·디렉터리·실행 비트 없는 systemctl, 실제 /usr/bin/systemctl·/bin·/usr/local/bin의 systemctl·/bin/sh, 그 링크와 /usr/bin 디렉터리 링크와 시험 스크립트의 링크, mainnet(순수 판단과 노드 프로세스), 변수 없음, 자격 파일 없음. 변이 M389~M399와 저장소 밖 mut.py의 W1~W13, O1~O6, H1·H2"
criterion = "거부마다 기대한 한 줄(변수 없음: 'this build is for tests: WATCHER_TEST_ENDPOINTS is required', 'a failpoints build talks only to loopback fakes: OMS_TEST_BYBIT_WIRING is required', 'a failpoints build sends alerts only to a loopback fake: OMS_TEST_TELEGRAM_API is required'; mainnet: 'a test build never runs on mainnet', 'a failpoints build never runs on mainnet'); 받은 배선의 끝점이 배선의 값과 같고 Endpoints::of의 값과 다르다. 배선 없는 failpoints 노드와 loopback 배선의 mainnet failpoints 노드는 종료 코드 3과 각자의 줄로 끝나고 로그에 자격 파일이 없으며 가짜 Bybit는 요청을 받지 않는다. failpoints 빌드의 start_alerts는 test_api 없이 그 줄로 거부하고 loopback 주소로는 시작한다. 기본 빌드 --version의 stdout이 정확히 'watcher <버전>\\n'"
tests = ["watcher/a_wiring_off_127_0_0_1_is_refused", "watcher/a_test_build_refuses_mainnet", "watcher/a_test_build_without_wiring_is_refused", "watcher/a_good_wiring_gives_every_endpoint_from_the_wiring", "watcher/unknown_and_missing_fields_are_refused", "watcher/the_systemctl_must_be_an_absolute_executable_file", "watcher/the_default_build_prints_no_test_endpoints", "node-unit/venue::bybit::gateway::tests::a_test_wiring_on_mainnet_is_refused", "node-unit/venue::bybit::gateway::tests::a_failpoints_build_without_wiring_is_refused", "node-unit/venue::bybit::gateway::tests::the_test_wiring_takes_only_hosts_on_127_0_0_1", "node-unit/alerts::tests::a_failpoints_build_without_a_test_api_is_refused", "node-unit/node::tests::a_failpoints_start_alerts_without_a_test_api_starts_no_sender", "pipeline/a_failpoints_node_without_test_wiring_refuses_its_gateway", "pipeline/a_failpoints_node_refuses_mainnet_even_with_a_loopback_wiring"]
repro = "cargo test -p watcher --test test_endpoints --test test_endpoints_default; cargo test -p oms-node --lib -- venue::bybit::gateway::tests alerts::tests; cargo test -p oms-node --features failpoints --lib node::tests::a_failpoints_start_alerts; cargo test -p oms-node --features failpoints --test bybit_node a_failpoints_node_"
supports = "C-WATCH, C-GW, ADR-031, ADR-028"
not_covered = "배포하는 빌드에 이 고리가 없다는 것은 cfg에 기댄다(워처 main.rs의 #[cfg(feature = \"test-endpoints\")] 호출, OMS gateway.rs spawn과 node.rs start_alerts의 cfg(feature = \"failpoints\"))이고 검토로 읽는다. 기본 oms-node를 OMS_TEST_BYBIT_WIRING과 함께 띄우는 시험은 없다(실제 호스트가 필요하거나 게이트웨이 전에 실패하는 설정이라 아무것도 보이지 않는다). 시험 빌드 워처 바이너리를 띄우는 시험은 이 단계에 없다: main.rs의 거부(종료 코드 2와 그 줄)와 --version의 ' test-endpoints'는 손으로 돌려 본 것뿐이고 합동 시험 J0이 맡는다. failpoints 노드의 start_alerts 호출 자리는 프로세스 시험이 없다(거부가 빠진 노드는 실제 Bot API로 보낼 수 있어 띄우지 않는다): failpoints 빌드의 단위 시험이 start_alerts를 직접 부르고(activate 전이라 아무것도 보내지 않는다), 이 시험은 failpoints 빌드에만 있어 xtask verify의 node-unit 묶음(기능 없는 --lib)은 돌리지 않는다(CI의 'Test (failpoints)'와 게이트가 돌린다). 워처 systemctl 규칙은 실제 파일·그 링크·시스템 디렉터리를 막을 뿐, 실제 systemctl의 복사본이나 그것을 부르는 스크립트(시험 쪽의 새 코드)는 막지 못한다. 워처 URL 규칙은 http://0x7f.1:<포트>처럼 127.0.0.1로 풀리는 다른 표기와 앞 공백을 받고(모두 127.0.0.1), 기본 포트를 적은 http://127.0.0.1:80은 포트 없음으로 거부한다. OMS_TEST_TELEGRAM_API의 규칙은 127.0.0.1이 아니라 loopback 주소 전체다(기존 규칙 그대로)"
