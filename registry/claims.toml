[[claim]]
id = "V-MARGIN-6"
statement = "운영자의 해제(clear-reduce)는 계좌가 감소 전용 상태가 아니면 NotReducing으로, 증거금 보고가 30초보다 오래됐으면 MarginUnavailable로, 사유가 비었으면 NoteRequired로 거절되고, 거절은 아무것도 기록하지 않는다. 받아들인 해제는 한 입력 안에서 마지막 보고의 계좌 가치를 새 기준 금액으로 정하고(day_base_set, set_by: operator) 감소 전용 상태를 끝낸다(reducing_cleared). 정확히 30초 된 보고는 신선하다. 그 뒤 새 기준 94에서 94와 89.30은 걸리지 않고 89.29는 다시 걸린다. 두 번째 해제는 NotReducing이다. 기준 재설정(rebase-day)은 신선한 보고와 사유가 있을 때 마지막 보고의 계좌 가치와 그 날짜(기준보다 앞선 날짜라도)를 기준 금액으로 정하고, 감소 전용 상태는 건드리지 않는다. 기준 재설정 없이 출금하면 그만큼이 손실로 읽힌다(100에서 6을 출금하면 걸린다). 마지막 보고에서 유지증거금 여유 조건이 참이면(어느 규칙으로 들어왔든) 해제는 MmBufferActive로 거절되고, 이 조건은 사유보다 먼저 본다. 포지션이 선 위로 돌아온 보고(가치 200, 최대 레버리지 40에서 3.00) 뒤에는 해제된다. 거절 응답 문자열은 사유 코드(not_reducing, margin_unavailable, mm_buffer_active, account_mm_active, note_required)로 시작한다. 공백뿐인 사유는 빈 것으로 본다. 기준 재설정의 사유는 이벤트에 없고 같은 저널 기록의 입력에 남는다"
why = "해제는 위험을 다시 여는 유일한 길이다. 오래된 숫자로, 또는 사유 없이 풀리면 손실 한도가 뜻을 잃는다"
level = "단위"
scope = "운영자 입력 ClearReduce와 RebaseDay, 그 거절 사유, 이벤트 day_base_set(운영자)과 reducing_cleared"
real = "oms-core"
simulated = "보고는 시험이 입력"
faults = "없음"
criterion = "C-MARGIN의 '해제와 기준 재설정'. 기대값은 손으로 적었다"
tests = ["core/clear_reduce_is_refused_when_stale_or_without_a_note_or_when_not_reducing", "core/clear_reduce_rebases_the_day_and_a_further_loss_latches_again", "core/rebase_day_sets_the_base_and_leaves_the_latch_alone", "core/a_withdrawal_without_rebase_reads_as_a_loss", "core/clear_reduce_is_refused_while_the_mm_condition_holds"]
repro = "cargo test -p oms-core --test margin"
supports = "C-MARGIN"
not_covered = "운영자의 판단이 옳은 것. 입금이 가린 손실(100, 입금 10, 손실 14는 걸리지 않는다: 시험이 그대로 보여 준다). 잘못 걸린 유지증거금 여유 래치에서 나가는 길(없다: 조건이 참으로 읽히는 동안에는 해제할 수 없고 강제 옵션이 없다). 시험 없음: 조건이 여럿 어긋나면 해제는 not_reducing, margin_unavailable, mm_buffer_active, account_mm_active, note_required 순으로, 기준 재설정은 margin_unavailable, note_required 순으로 처음 것 하나만 답한다(사유보다 먼저 보는 두 조건만 시험이 본다). 시험 없음: 정책이 없으면 보고가 신선할 수 없어 해제와 기준 재설정은 margin_unavailable로 거절되고(감소 전용 상태가 아니면 해제는 not_reducing) 정책을 다시 켜야 풀 수 있다. 시험 없음: 해제도 기준의 날짜를 그 보고의 날짜로 둔다(앞선 날짜라도). 시험 없음: 기준 재설정은 유지증거금 여유 조건과 계좌 유지증거금률 조건을 보지 않는다"

[[claim]]
id = "V-MARGIN-7"
statement = "증거금 정책이 있고 링크가 올라와 있을 때, 마지막으로 받은 증거금 보고의 조회 시각에서 60초가 넘게 지나면 틱이 감소 전용 표시가 없고 취소 요청이 없는 모든 열린 주문에 Rule(MarginStale) 이름으로 취소 요청을 한 번 낸다. 정확히 60초에는 내지 않는다. 감소 전용 표시가 있는 주문은 그대로 둔다. 아무 상태도 걸리지 않는다. 나이는 마지막 보고의 조회 시각과 현재 링크 세션이 올라온 시각 가운데 늦은 것에서 재고, 링크가 올라와 있는 동안 정책이 켜지면 그 설정 기록의 시각에서 잰다"
why = "증거금 보고를 못 받는 동안에는 일 손실도 유지증거금 여유도 판정하지 못한다. 그동안 걸려 있는 일반 주문이 체결되면 보지 못하는 채로 위험이 는다"
level = "단위"
scope = "틱 안의 cancel_requested(by: Rule(MarginStale)), cancel_sent"
real = "oms-core"
simulated = "보고와 거래소 통보, 시각은 시험이 입력"
faults = "보고가 끊긴 링크"
criterion = "C-MARGIN의 '보고 끊김 취소'. 기대값은 손으로 적었다"
tests = ["core/report_stale_past_the_cancel_limit_cancels_each_plain_order_once", "core/stale_age_starts_at_link_up_when_no_report_has_arrived", "core/stale_cancel_is_silent_while_the_link_is_down_or_the_policy_is_off", "core/stale_cancel_does_not_reissue_an_exhausted_cancel", "core/a_fresh_report_after_a_stale_episode_restores_acceptance_without_a_latch", "core/a_forward_clock_jump_reads_the_report_as_stale_and_cancels", "core/stale_age_starts_at_policy_activation_when_the_link_is_already_up"]
repro = "cargo test -p oms-core --test margin"
supports = "C-MARGIN"
not_covered = "포지션(그대로 남는다). 감소 전용 주문. 링크가 내려가 있는 동안(아무것도 취소하지 않는다). 취소가 체결보다 먼저 닿는다는 것. 틱이 오는 간격만큼 늦을 수 있다. 노드 프로세스를 거친 시험은 없다(임의 순서의 실행은 sim::profile_margin_lossy가 본다)"

[[claim]]
id = "V-MARGIN-8"
statement = "증거금 정책이 있으면, 받은 증거금 보고의 포지션 가운데 포지션 가치가 0보다 큰 것의 격리 증거금이 (유지증거금률 + 0.25 %p) × 포지션 가치보다 작으면 계좌가 감소 전용 상태로 들어가고 규칙은 MmBuffer로 남는다. 최대 레버리지 40, 포지션 가치 200에서 3.00은 걸리지 않고 2.99는 걸린다. 유지증거금률은 그 포지션의 최대 레버리지(같은 보고의 값)로 1 / (2 × 최대 레버리지)이다: 최대 레버리지 25, 가치 200에서 4.50은 걸리지 않고 4.49는 걸리며, 최대 레버리지 50에서는 2.50이 걸리지 않는다. 한 종목의 포지션이 걸려도 래치는 계좌 전체에 하나다: 다른 종목에 걸려 있는 일반 주문이 Rule(MmBuffer) 이름으로 취소되고, 모든 종목의 새 일반 주문이 Hold(Reducing)으로 거절되며, 감소 전용 주문은 받는다. 교차 증거금 포지션은 판정하지 않는다(그 종목은 VenueSetting 차단에 걸린다). 래치에는 먼저 건 규칙이 남는다: 일 손실로 들어간 뒤의 유지증거금 여유 판정도, 그 반대도 아무것도 내지 않고 바꾸지 않는다. 한 보고가 둘 다 걸면 유지증거금 여유를 먼저 판정하므로 MmBuffer가 남는다. 받은 보고는 도착했을 때 이미 30초보다 오래됐어도 판정한다(조회 뒤 40초에 기록된 보고의 2.99도 건다). 비교는 나눗셈 없는 정확한 곱으로 한다: 가장 큰 금액·최대 레버리지·여유에서도 넘침이 결과를 뒤집지 않고(곱이 i128에 들어가지 않으면 선 아래로 본다), 선 바로 옆에서 반올림이 결과를 뒤집지 않는다. 포지션 가치가 0 이하인 포지션은 판정하지 않는다. 설정에 없는 종목의 포지션도 판정한다. 음수 증거금은 언제나 선 아래다. detail은 「position <종목>: isolated margin <증거금> is below the maintenance margin at maximum leverage <최대 레버리지> plus <여유> bps of the position value <가치>」다"
why = "격리 포지션이 청산에 가까운 계좌에 일반 주문을 더 받으면 위험이 는다. 판정은 거래소가 준 보고만 읽으므로 OMS 장부의 오류가 이 규칙을 끄지 못한다"
level = "단위"
scope = "이벤트 reducing_entered(rule: mm_buffer)와 상태 reducing"
real = "oms-core"
simulated = "보고는 시험이 입력"
faults = "없음"
criterion = "C-MARGIN의 '유지증거금 여유'. 기대값은 손으로 적었다"
tests = ["core/isolated_margin_below_mmr_plus_buffer_enters_reducing", "core/mmr_follows_the_max_leverage_of_each_position", "core/a_trigger_on_one_instrument_blocks_plain_orders_on_all", "core/a_cross_position_is_not_judged_by_the_mm_rule", "core/reducing_records_the_rule_that_tripped_first", "core/an_old_report_on_arrival_is_still_judged_by_the_mm_rule", "core/mm_comparison_is_exact_at_extreme_values"]
repro = "cargo test -p oms-core --test margin"
supports = "C-MARGIN"
not_covered = "거래소의 격리 포지션 marginUsed가 그 포지션의 자산이라는 것(T1. 틀리면 규칙이 양쪽으로 틀릴 수 있다). 증거금 구간(T9: 유지증거금률은 보고의 최대 레버리지 하나로만 계산한다). 규칙은 청산 가격의 0.13~0.37 % 앞에서 걸리고(BTC, 거래소 2배) 5초 간격의 조회가 그 사이를 건너뛸 수 있다. 새 보고를 받지 못하는 동안에는 판정하지 않는다. 시험 없음: 걸리는 포지션이 여럿이면 보고에 먼저 적힌 것 하나가 detail에 남는다"

[[claim]]
id = "V-MARGIN-13"
statement = "증거금 정책에 account_mm_rate_max_bps가 있으면, 받은 증거금 보고의 교차 계좌 유지증거금이 0보다 크고 유지증거금 × 10 000 ≥ 한도 × 증거금 잔고일 때 계좌가 감소 전용 상태로 들어가고 규칙은 AccountMm(status의 account_mm)으로 남으며, 같은 입력에서 열린 일반 주문마다 Rule(AccountMm) 취소를 낸다(감소 전용 주문은 남는다). 한도 5000에서 잔고 1000: 499.99는 걸리지 않고 500은 건다. 한도 1에서 잔고 100: 0.00999999는 아니고 0.01은 건다. 잔고 0 이하에 유지증거금이 있으면 어느 한도에서도 건다. 유지증거금 0은 잔고가 얼마든(0, 음수 포함) 걸지 않는다. 가장 큰 금액에서도 나눗셈 없이 정확히 비교한다. 한도가 있는데 account_mm이 없거나 유지증거금이 음수인 보고는 통째로 MarginReportRejected이고 마지막 정상 보고가 나이를 먹는다. 한도가 없으면 같은 보고를 기록하고 숫자를 판정하지 않는다. 래치에는 먼저 건 규칙이 남는다(일 손실 뒤의 계좌 규칙도, 그 반대도 아무것도 내지 않는다). 한 보고가 여럿을 걸면 유지증거금 여유, 계좌 유지증거금률, 일 손실 순이다. clear-reduce는 마지막 보고에서 조건이 참이면 어느 규칙이 걸었든 account_mm_active로 거절된다. status는 마지막 보고의 두 숫자를 보이고 없으면 키가 없다. account_mm 없는 보고와 한도 없는 정책은 저널에 바이트를 남기지 않고(기록 스키마 2 그대로), 이 필드 전의 기록은 없음으로 읽히며, 두 종류의 저널 모두 재생·재결정·디스크 복구(verify --re-decide)에서 실시간 상태와 같다. 한도는 1..=9999다. 노드 설정은 Bybit에서 증거금 정책이 있으면 한도를 요구하고 Hyperliquid와 가상 거래소에서는 거부한다. Bybit 게이트웨이는 totalMaintenanceMargin과 totalMarginBalance를 보고에 싣고, 둘 중 하나라도 없거나 문자열 소수가 아니면 응답 전체가 MarginReportInvalid이며, accountMMRate는 무슨 값이든(없어도) 보고를 바꾸지 않는다. 그 거부 사유는 「account_mm is missing: …」와 「account_mm: maintenance margin … is negative」다. detail은 「account maintenance margin <유지증거금> is at or above <한도> bps of the margin balance <잔고>」다"
why = "교차 계좌에는 격리 포지션이 없어 유지증거금 여유 규칙이 걸리지 않는다. 계좌가 청산에 가까울 때 일반 주문을 더 받지 않고 걸려 있는 일반 주문을 거둔다는 전제(U17d, 소유자 질문의 기본값 50 %)"
level = "단위"
scope = "oms-core 시험 11개, 디스크 저널 복구 시험 1개, loopback 가짜 HTTP 서버(http-fake)의 wallet-balance 응답 시험 3개, 설정 시험 1개"
real = "oms-core 판단·적용·재생·설정 검증, oms-journal 쓰기와 oms-node recovery::recover·verify, venue::bybit::query, oms-node 설정 검증"
simulated = "증거금 보고(시험이 입력), Bybit REST 응답(문서의 필드 이름으로 손으로 쓴 JSON)"
faults = "숫자 없는 보고, 음수 유지증거금, 잔고 0·음수, 가장 큰 금액, 필드 없음·빈 문자열·JSON 숫자·숫자 아닌 문자열, accountMMRate의 여러 값과 없음, 한도 0·10000"
criterion = "C-MARGIN의 '계좌 유지증거금률'. 기대값은 손으로 적었다. 변이 20가지를 넣어 모두 잡았다(ADR-028 §9)"
tests = ["core/rate_just_below_the_limit_does_not_latch_and_at_the_limit_latches_with_the_cancels", "core/the_limit_is_judged_exactly_at_one_basis_point", "core/a_margin_balance_of_zero_or_below_with_maintenance_latches", "core/no_maintenance_margin_latches_nothing_whatever_the_balance", "core/the_comparison_is_exact_at_the_largest_amounts", "core/a_report_without_account_mm_is_rejected_under_the_limit_and_recorded_without_it", "core/the_latch_is_not_replaced_by_a_later_rule", "core/clear_reduce_is_refused_while_the_account_rate_is_at_or_above_the_limit", "core/status_shows_the_account_numbers_and_the_rule", "core/journals_with_and_without_account_mm_replay_to_the_live_state", "core/the_limit_is_one_to_9999_bps", "node-unit/margin_reports_with_and_without_account_mm_recover_to_the_live_state", "node-unit/venue::bybit::query::tests::the_margin_report_maps_the_unified_account", "node-unit/venue::bybit::query::tests::a_margin_answer_that_cannot_be_read_as_a_whole_is_refused_as_a_whole", "node-unit/venue::bybit::query::tests::the_account_mm_rate_field_is_not_used_for_the_judgment", "node-unit/config::tests::the_account_mm_limit_is_required_on_bybit_and_refused_elsewhere"]
repro = "cargo test -p oms-core --test account_mm; cargo test -p oms-node --test record_schema; cargo test -p oms-node --lib -- venue::bybit::query config::"
supports = "C-MARGIN, ADR-018 §7의 11, ADR-028 §7g"
not_covered = "실제 Bybit 응답의 두 필드와 accountMMRate의 형식(테스트넷에 붙여 돌리지 않았다). totalMaintenanceMargin이 거래소의 청산 판정과 같은 숫자라는 것. 5000 bps가 적당하다는 것(판단). 5초 간격의 조회가 건너뛰는 급한 가격 변화, 새 보고를 받지 못하는 동안의 판정. 노드 프로세스를 거친 진입과 omsctl의 account_mm_active 응답(Bybit 노드 시험은 증거금 정책 없이 돈다). 잘못 걸린 래치는 조건이 참인 동안 해제로 풀 수 없다. 시험 없음: 도착했을 때 이미 30초보다 오래된 보고도 이 규칙으로 판정한다. 시험 없음: 마지막 보고에 account_mm이 없으면 해제의 계좌 유지증거금률 조건은 거짓이다(한도가 없는 경우는 시험이 본다)"

[[claim]]
id = "V-MARGIN-12"
statement = "시뮬레이션의 가상 거래소는 계좌 가치를 자기 모형으로 계산한다: 현금 + 포지션 × 기준 가격. 체결은 낸 값과 수수료만큼, 펀딩은 그 금액만큼 현금을 줄이고, 가격 변화는 포지션 가치를 바꾼다. 손으로 푼 예(입금 100, 100에 0.5 매수와 수수료 0.01, 가격 104, 펀딩 0.1 %)에서 계좌 가치는 99.99, 101.99, 101.938이다. 가격이 움직이지 않아도 수수료와 펀딩만으로 계좌가 기준 금액보다 5 %를 넘게 내려가면 감소 전용 상태로 들어간다(100에서 95.00은 아니고 94.99는 들어간다). 가상 거래소는 포지션을 키우거나 반대쪽으로 넘기는 감소 전용 주문을 거절하고, 걸려 있는 감소 전용 주문은 남은 포지션만큼만 체결한 뒤 나머지를 취소한다. 증거금 정책을 켠 임의 순서의 실행(체결, 가격 변화, 펀딩, 운영자 해제, 그리고 margin_lossy에서는 보고 유실·지연·무응답, 링크 단절, 재시작)의 매 입력 뒤에: 받아들인 일반 주문은 신선한 보고가 있었고 노출이 계좌 가치의 2배 이내이거나 노출을 올리지 않았다. 감소 전용 상태에 들어가면 열려 있는 일반 주문마다 취소 요청이 있고, 그 상태인 동안 일반 주문은 받아들여지지 않는다. 감소 전용 상태는 증거금 보고로만 들어가고 운영자의 해제로만 끝난다(재시작, 새 UTC 날, 회복된 계좌 가치는 끝내지 않는다). 보고가 한도보다 오래 끊긴 뒤의 틱이 끝나면 열려 있는 일반 주문마다 취소 요청이 있다. 증거금 정책이 없는 기존 프로파일 일곱 개는 seed 다섯 개씩 main(84db0f9)에서 기록한 것과 같은 저널을 쓴다. 가상 시간 50시간짜리 실행(margin_days: UTC 자정 1시간 전에 시작해 자정을 세 번 넘고, 그 사이에 재시작, 링크 단절, 손실, 출금과 입금, 운영자의 해제와 기준 재설정이 섞인다)에서도 위 검사가 매 입력 뒤에 성립하고, 기록된 보고가 그 전의 기준 금액보다 5 %를 넘게 낮으면 그 보고가 새 날의 기준을 정하는 보고여도 계좌는 감소 전용 상태가 되고, 저널의 기준 금액은 실행마다 자정을 정확히 세 번 넘고, 재시작과 새 날은 감소 전용 상태를 끝내지 않는다. 정해진 순서 하나(자정을 넘는 20초의 조회 끊김 동안 100에서 6 출금, 재시작, 자정 두 번 더)에서 새 날의 첫 보고 94는 상태를 걸고 나서 기준이 되고, 저널에는 날마다 기준이 하나다(100, 94, 100, 99). 저널의 증거금 기록(입력이 증거금 보고인 기록)은 조회 한 번에 하나를 넘지 않는다: 조용한 하루는 조회 17 280번에 기록 17 280건이고, 50시간 실행에서 기록 수는 조회 수 이하이고 같은 조회의 답은 두 번 기록되지 않는다"
why = "일 손실 규칙은 거래소가 말한 계좌 가치만 읽는다. 시뮬레이션이 그 값을 체결·가격·수수료·펀딩에서 스스로 만들어야 규칙을 임의 순서의 실행에서 볼 수 있다. 예제 시험이 생각하지 못한 순서(취소 중의 진입, 재시작 직후의 보고, 앞지른 늦은 보고)는 여기서만 나온다"
level = "시뮬레이션"
scope = "가상 거래소의 증거금 모형(단위 3건). 프로파일 margin_calm, margin_lossy: 실행당 1500단계, 한 종목, 두 전략, 계좌 100, 증거금 시계는 계약 기본값의 50분의 1(조회 100 ms, 신선도 600 ms, 끊김 취소 1.2초), UTC 자정을 한 번 넘는다. 프로파일 margin_days: 가상 시간 50시간, 증거금 시계는 계약 기본값(조회 5초, 신선도 30초, 끊김 취소 60초), UTC 자정을 세 번 넘는다. 활동은 묶음으로 오고 그 사이 5초~10분은 타이머만 돈다. seed는 표준 실행의 10분의 1(최소 2개). 기존 프로파일 7개 × seed 5개의 저널 해시"
real = "oms-core의 판단과 상태"
simulated = "거래소와 그 증거금 모형(우리 모형이고 거래소의 문서화된 산술이 아니다), 저널과 커밋 게이트, 게이트웨이, 네트워크, 전략, 운영자, 시계"
faults = "margin_calm: 없음. margin_lossy: lossy의 네트워크 장애, 링크 단절 0.3 %/단계, 재시작 0.2 %/단계, 증거금 조회 무응답 0.5~2.5초, 늦은 응답, 포지션 증거금을 0으로 말하는 거래소. margin_days: margin_lossy의 장애(링크 단절 0.2 %/단계, 재시작 0.1 %/단계, 실행당 약 15 000단계), 증거금 조회 무응답 1분~1시간과 자정 둘 중 하나를 넘는 무응답, 두 번 도착하는 증거금 응답 5 %, 출금과 입금, 운영자의 기준 재설정"
criterion = "모형은 손으로 푼 예의 값. 실행은 검사 leverage-gate, margin-fresh, reducing-cancel, reducing-accept, reducing-entry, reducing-release, stale-cancel, daily-loss(노출과 손실은 세계가 코어의 장부와 보고에서 따로 계산한다)와 V-SIM-1, V-SIM-2의 검사. 프로파일이 각 규칙에 닿았는지는 seed 40개부터 확인한다(margin_days는 흔한 것은 4개부터, 자정에 관한 것은 40개부터). 저널 해시는 main에서 기록한 상수와 비교한다. 여러 날 실행의 기대값(기준 금액, 17 280)은 손으로 적었다. 변이 M89~M100"
tests = ["sim/world_account_value_follows_fills_price_fees_and_funding", "sim/a_loss_made_only_of_fees_and_funding_enters_reducing", "sim/world_refuses_a_reduce_only_order_that_would_grow_the_position", "sim/profile_margin_calm", "sim/profile_margin_calm_reducing_invariant", "sim/profile_margin_calm_release_invariant", "sim/profile_margin_lossy", "sim/existing_profiles_give_the_same_run_with_margin_off", "sim/profile_margin_days_crosses_three_utc_days_with_restarts", "sim/margin_journal_records_stay_within_one_per_poll"]
repro = "cargo test -p oms-sim --test sim -- world_ a_loss_made profile_margin margin_journal existing_profiles --nocapture   (실패 시: OMS_SIM_PROFILE=<이름> OMS_SIM_SEED=<n>)"
supports = "C-MARGIN"
not_covered = "실제 거래소에 관한 것 전부: 계좌 가치와 증거금의 계산(T1, T2), 수수료와 펀딩이 어느 잔고에서 나가는지(T3), 감소 전용 주문의 처리(T5, 문서 인용을 가정으로 적었다). 취소가 체결보다 먼저 닿는 것. 주문을 받은 뒤 가격이 움직여 넘은 노출. 청산(모형에 없다). 증거금 구간. 여러 종목. 노드 프로세스를 실제로 며칠 돌리는 것(여러 날 실행은 가상 시간이다). 저널의 디스크 바이트(건수만 센다. 저널은 지워지지 않는다, U-04)와 증거금 기록이 아닌 기록의 수. margin_days의 seed는 표준 실행의 10분의 1이다"

[[claim]]
id = "V-MARGIN-10"
statement = "Hyperliquid 게이트웨이는 문서의 clearinghouseState 응답 예를 증거금 보고 입력으로 옮긴다: 계좌 가치는 marginSummary.accountValue, 포지션마다 종목, 부호 있는 수량, 포지션 가치, 사용 증거금, 증거금 방식, 레버리지, 최대 레버리지. 어느 포지션이든 maxLeverage가 없거나 0이거나 정수가 아니면 보고 전체를 사유와 함께 거부 입력(MarginReportInvalid)으로 바꾸고, 멀쩡한 다른 포지션도 보고하지 않는다. 계좌 가치, 수량, 포지션 가치, 사용 증거금, 레버리지 가운데 하나라도 없거나 읽을 수 없을 때, 증거금 방식이 isolated도 cross도 아닐 때, 포지션 목록이 없을 때도 같다. 어떤 값도 0이나 기본값으로 채우지 않고 어떤 포지션도 건너뛰지 않는다. 설정에 없는 종목의 포지션도 보고에 남는다(번역 함수는 설정된 종목을 받지 않는다). activeAssetData 응답 예는 그 종목의 거래소 설정 입력(증거금 방식, 레버리지)이 된다. 방식이 isolated도 cross도 아니거나, 레버리지가 정수가 아니거나, 응답이 다른 종목의 것이면 입력을 만들지 않는다(설정은 모름으로 남아 그 종목이 막힌다). userAbstraction 응답(문자열 하나)은 글자 그대로 계좌 모드 입력이 된다. 문서에 없는 문자열을 문서에 있는 값으로 바꾸지 않고, 문자열이 아니거나 64자를 넘으면 입력을 만들지 않는다. 세 조회의 요청 본문은 문서의 것과 같다(clearinghouseState, activeAssetData, userAbstraction). 게이트웨이의 요청 예산은 취소를 막지 않으므로 취소 500건 뒤에는 조회가 기다린다: 가득 찬 예산(1200)에서는 700이 남아 증거금 조회가 바로 나가고, 시작 직후(600)에는 100이 남아 10.1초, 빈 예산에서는 15.1초를 기다린다. 종목 이름에서 식별자 규칙에 맞지 않는 글자는 _로 바꾼다(PURR/USDC는 PURR_USDC, @107은 _107). 게이트웨이가 스스로 세는 요청 예산은 최대 1200이고 시작할 때 600이며 초당 20씩 차고, 조회는 300(주문 몫 200, 취소 몫 100)을 남길 수 있을 때만 나가며 취소는 예산과 상관없이 나간다"
why = "증거금 규칙이 읽는 숫자는 모두 이 번역을 거친다. 필드를 하나 잘못 옮기면 규칙이 틀린 값으로 판정한다"
level = "단위"
scope = "게이트웨이의 순수 번역 함수(JSON 응답 → 코어 입력)와 요청 본문 함수. 문서의 응답 예가 입력. 요청 예산은 시각을 시험이 주는 단위 시험"
real = "oms-node(venue/hyperliquid/wire.rs, venue/hyperliquid/mod.rs의 Budget)"
simulated = "응답은 시험이 입력. 거래소에 묻지 않는다"
faults = "maxLeverage 없음, 0, 문자열, null, 음수, 소수, u32 초과, 배열. 소수 필드 없음, 숫자가 아닌 문자열, 빈 문자열, JSON 숫자, null, 지수 표기, NaN, 소수 9자리. 모르는 증거금 방식. 종목 이름 없음. 포지션 목록 없음"
criterion = "C-MARGIN의 'Hyperliquid 조회'. 기대값은 문서 예의 소수를 손으로 1e-8 단위 정수로 적었다. 변이 M67~M76, M79"
tests = ["node-unit/venue::hyperliquid::wire::tests::documented_clearinghouse_state_parses_to_a_margin_report", "node-unit/venue::hyperliquid::wire::tests::missing_zero_or_unparseable_max_leverage_rejects_the_whole_report", "node-unit/venue::hyperliquid::wire::tests::any_unparseable_number_rejects_the_whole_report", "node-unit/venue::hyperliquid::wire::tests::a_position_on_an_unconfigured_coin_is_kept", "node-unit/venue::hyperliquid::wire::tests::documented_active_asset_data_parses_leverage_and_mode", "node-unit/venue::hyperliquid::wire::tests::user_abstraction_values_parse_and_an_unknown_value_stays_unknown", "node-unit/venue::hyperliquid::wire::tests::margin_and_setting_request_json", "node-unit/venue::hyperliquid::tests::a_full_cancel_burst_leaves_the_margin_query_waiting_for_a_known_time", "node-unit/venue::hyperliquid::wire::tests::odd_coin_names_are_mapped_not_dropped"]
repro = "cargo test -p oms-node --lib venue::hyperliquid"
supports = "C-MARGIN"
not_covered = "실제 응답이 문서의 예와 같은지, 필드의 뜻이 유도한 것과 같은지(T1, T2). 어느 userAbstraction 값이 표준 모드인지(T10), 포지션이 없을 때 activeAssetData가 레버리지를 주는지(T11). activeAssetData의 응답 예는 저장소의 조사 문서에 없고 문서와 다시 대조하지 않았다. 게이트웨이가 조회를 실제로 보내는 경로(HTTP)는 시험하지 않는다. HTTP 429일 때의 동작. 거래소가 실제로 세는 weight. 요청 예산을 여러 조회가 다투는 순서와 조회 간격만큼 더 길어지는 대기"

[[claim]]
id = "V-WIRE-ID-1"
statement = "고객 주문번호 형식 Base32Pair는 VenueClientId와 일대일이고 27자(36자 이하, 0-9a-v와 -)이며 같은 입력에 같은 문자열을 내고, 서로 다른 100만 개 주문에 서로 다른 100만 개 문자열을 낸다. 해석은 그 형식이 쓴 문자열만 받는다(대문자·다른 길이·다른 구분자·64비트 초과·16진수 형식은 None). Hex128은 to_hex와 같은 문자열을 내고 소문자 16진수만 해석하며, 가상 거래소와 Hyperliquid 게이트웨이는 Hex128을 선언하고 보내는 번호를 그 형식으로 만든다"
why = "Bybit orderLinkId로 낸 주문을 우리 것으로 알아보고 남의 주문을 우리 것으로 잘못 읽지 않으며, 기존 두 거래소의 요청은 바뀌지 않는다는 전제"
level = "단위"
scope = "경계값 36쌍, 100만 개 주문(인스턴스 2개 × 50만), 잘못된 문자열 Base32Pair 11개·Hex128 4개"
real = "WireIdForm::encode, WireIdForm::decode, 두 게이트웨이의 WIRE_ID 상수"
simulated = "없음"
faults = "없음"
criterion = "왕복 일치, 길이 27, 문자 집합, 중복 0, 잘못된 문자열 전부 None, 두 상수가 Hex128"
tests = ["core/ids::tests::hex128_is_the_hex_form_of_today", "core/ids::tests::base32_pair_roundtrips_and_fits_an_order_link_id", "core/ids::tests::base32_pair_gives_a_million_distinct_ids", "core/ids::tests::base32_pair_decoding_is_strict", "node-unit/venue::tests::the_gateways_of_today_write_the_hex_form"]
repro = "cargo test -p oms-core --lib ids::tests && cargo test -p oms-node --lib venue::tests"
supports = "C-GW"
not_covered = "Bybit가 이 형식을 실제로 받는지, orderLinkId 재사용·유일성 범위(설계 TN의 testnet 항목 T1, ADR-018의 T1과 다름). 상태 API의 venue_client_id가 Base32Pair로 출력되는 경로(Bybit 노드)는 시험하지 않았다. 게이트웨이가 거래소 응답을 읽을 때 쓰는 parse_hex는 대문자도 받는다(바꾸지 않음)"

[[claim]]
id = "V-VENUE-EXEC-1"
statement = "펀딩 입력은 포지션·주문·예약·체결 수를 바꾸지 않고 한 번만 기록된다. 거래소 포지션 변경은 부호 있는 수량을 계좌와 미귀속 장부에 더하고 VenuePositionChange 불일치로 일반 주문을 막으며(감소 전용은 통과) 재생 뒤에도 남는다. 분류 못 한 실행은 기장 없이 UnclassifiedExecution 불일치로 막는다. 변경 뒤 그보다 늦게 물은 현재 세션의 포지션 응답 중 그 종목에 열린 주문과 대기 체결이 없을 때의 첫 응답이 다르면 PositionAdjusted(snapshot_after_venue_change) 한 건으로 맞추고 같으면 VenueChangeSettled만 남기며(열린 주문이 있는 동안은 맞추지 않아 오는 중인 체결을 두 번 세지 않는다), 저널만으로 계산한 포지션이 거래소 값과 같다. 분류 못 한 실행의 키는 같은 키로 나중에 온 체결의 기장을 막지 않는다. 운영자 조정은 reason 없이 스키마 1과 같은 바이트로 쓰인다"
why = "Bybit의 펀딩·ADL·청산 인수가 포지션이나 체결을 틀어지게 하지 않고, 사람이 볼 때까지 노출을 늘리지 않으며, 감시자 W2가 저널 합만으로 포지션을 비교할 수 있다는 전제"
level = "단위"
scope = "종목 하나, 전략 하나, 시험 9개"
real = "oms-core 판단(decide)과 적용(apply), 재생"
simulated = "거래소 입력(시험이 직접 만든 VenueInput)"
faults = "같은 실행의 재전달, 변경보다 먼저 물은 포지션 응답, 지난 세션의 응답, 아직 도착하지 않은 우리 체결, 분류 못 한 실행 뒤 같은 키의 체결"
criterion = "이벤트 이름 목록, 계좌·미귀속·전략 포지션, 미확인 불일치 종류, 차단과 주문 거절 사유, 재생한 코어와 실시간 코어의 같음, 저널 합 = 거래소 포지션, 직렬화 문자열"
tests = ["core/a_funding_payment_is_cash_only_and_booked_once", "core/a_venue_position_change_is_booked_flagged_and_holds_plain_orders", "core/an_unclassified_execution_holds_plain_orders", "core/the_next_positions_answer_after_a_change_is_the_position_of_record", "core/a_positions_answer_equal_to_the_journal_settles_without_an_adjustment", "core/a_positions_answer_of_an_old_session_does_not_end_the_wait", "core/an_operator_adjustment_is_written_as_in_schema_1", "core/the_wait_does_not_end_while_an_order_of_ours_can_still_fill", "core/an_unclassified_key_does_not_block_a_later_fill_with_the_same_key"]
repro = "cargo test -p oms-core --test venue_changes"
supports = "C-FILL, C-MISMATCH"
not_covered = "Bybit 실행 행의 실제 모양(testnet T15). 게이트웨이의 execType 분류표는 V-BYBIT-READ-1이 보고, 분류한 입력을 이 코어에 넣는 끝에서 끝까지의 시험은 없다(두 시험이 같은 VenueInput 모양에서 만난다). 펀딩 합계는 어떤 한도에도 들어가지 않는다. 불일치가 [OMS P1]로 가는 경로(U14). 거래소가 응답 시각 기준으로 일관된다는 가정"

[[claim]]
id = "V-SCHEMA-2-1"
statement = "이 빌드는 기록 스키마 2를 쓰고 1과 2를 읽는다. 기록 스키마 1로 쓴 저널(체결, 운영자 조정, 정지 포함)을 복구하면 실시간 코어와 같은 상태(다이제스트 포함)가 되고, 그 뒤에 스키마 2로 이어 쓴 기록은 새 세그먼트에 들어가며, 두 세그먼트를 함께 복구해도 실시간 상태와 같고 --re-decide 검사도 통과한다"
why = "기록 형식을 올려도 그 전에 쓴 저널이 그대로 다시 읽힌다는 전제"
level = "통합"
scope = "기록 스키마 1 세그먼트 하나와 스키마 2 세그먼트 하나, 시험 때 만든 저널(커밋하지 않음)"
real = "oms-journal 쓰기·복구, oms-node recovery::recover와 verify, oms-core"
simulated = "입력(시험이 직접 만든 Input)"
faults = "없음"
criterion = "복구한 코어 = 실시간 코어, 다이제스트 같음, 스키마 1 기록을 두 번 나눠 써도 세그먼트 1개이고 스키마 2를 쓰면 2개, verify 기록 수"
tests = ["node-unit/this_build_writes_schema_2_and_reads_1_and_2", "node-unit/a_schema_1_journal_and_a_schema_2_tail_replay_to_the_live_state"]
repro = "cargo test -p oms-node --test record_schema"
supports = "C-JOURNAL"
