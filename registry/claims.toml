[[claim]]
id = "V-GATE-1"
statement = "모니터링 게이트는 기록 시각으로 판단한다(250 ms 틱, 엄격한 >): 하트비트가 0초에 오고 끊기면 30.0초까지 감시됨, 30.25초에 monitor_changed{false}, 그보다 60초 넘은 첫 틱(90.5초)에 걸린 일반 주문의 취소를 한 번 요청하고(규칙 unmonitored) 그 뒤 틱은 더 묻지 않는다. 5초마다 오는 하트비트에서 W1이나 W2가 0초에 멈추면 10초의 하트비트(정확히 10초)는 감시됨, 15초의 하트비트가 닫고, 하트비트가 계속 와도 취소는 닫은 기록보다 60초 넘은 첫 틱에 온다. 검사의 나이는 그것을 알린 하트비트의 시각에서 잰다. W3·W4는 기록할 뿐 판정하지 않는다. 알려진 한계(리뷰 1 M1): 기록 시각이 멈춘 동안(호스트 시계가 뒤로 감) 틱 2,400개에도 monitor_changed와 취소가 없고, 옛 시계로 찍은 W1·W2의 하트비트는 받아들여져 게이트가 열린 채이며, 새 시계로 590초 뒤에 찍힌 하트비트는 게이트를 닫는다. 감소 전용 주문은 취소하지 않고, 연결이 내려가 있는 동안은 묻지 않으며, 다한 취소는 다시 묻지 않는다. 프로세스에서: W2가 11초 전인 하트비트가 곧바로 닫고, 거래소의 일반 주문은 10초(unmonitored_cancel_us) 전에는 남고 그 뒤 규칙으로 취소되며 감소 전용 주문은 남는다. 감시 안 됨인 채 이유만 바뀌면 기록하지 않고 since도 그대로다"
