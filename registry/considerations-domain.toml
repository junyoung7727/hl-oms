[[item]]
id = "D-CONC-01"
layer = "domain"
area = "동시성"
consideration = "스레드 사이에 공유하는 상태마다 동기화 근거가 설명돼 있는가"
necessity = "설명되지 않은 공유 상태는 경합의 원인이다"
sources = ["BRIEF", "RUST"]
applicability = "적용"
reason = "코어 밖에 스레드 셋과 비동기 런타임이 있다"
handling = "스레드 사이에 공유하는 상태: 입력 큐(`Mutex`+`Condvar`), 읽기 모델(`RwLock`, writer는 커밋 스레드 하나), 구독자 목록(`Mutex`), 치명 사유(`Mutex`), 전략별 빈도 버킷(`Mutex`), 게이트웨이의 종목 표(`RwLock`)·요청 예산(`Mutex`)·연결(`Mutex`, 가상 거래소)·응답 대기 표(`Mutex`, 가상 거래소), 원자 변수(치명 표시, 스냅샷 요청, 내구 순번 표시, 계수기, 게이트웨이의 세션과 nonce). 원자 변수 중 정확성에 관여하는 것은 nonce(CAS로 단조 증가)와 치명 표시(한 번 서면 내려가지 않음)다. 잠금을 쥔 채 다른 잠금을 잡는 곳은 읽기 모델 → 구독자 목록 한 방향뿐이다. 직접 작성한 lock-free 구조와 unsafe는 없다"
design = "결정"
impl = "구현"
verify = "부분"
adr = ["ADR-012"]
contracts = []
code = ["crates/oms-node/src/queues.rs", "crates/oms-node/src/published.rs", "crates/oms-node/src/util.rs"]
claims = ["V-OVL-1", "V-COMMIT-1"]
open = "동시성 모델 검사 도구(loom 등)를 쓰지 않았다. 근거: 공유 구조가 표준 라이브러리의 잠금뿐이고 잠금 순서가 한 방향(읽기 모델 → 구독자 목록)이다. 잠금을 쥔 채 await하거나 다른 잠금을 반대 순서로 잡는 곳이 없다는 것은 코드 검토로만 확인했다. 영향: 잠금 순서를 어기는 변경을 도구가 잡지 못한다. 해소: loom이나 잠금 순서 검사를 도입한다. 단계: 공유 상태가 늘 때."

[[item]]
id = "D-CONC-02"
layer = "domain"
area = "동시성"
consideration = "비동기 태스크가 취소돼도 데이터가 사라지거나 반쯤 처리된 상태가 남지 않는가"
necessity = "`select!`에서 버려진 분기가 메시지를 잃을 수 있다"
sources = ["RUST", "BRIEF"]
applicability = "적용"
reason = "tokio 문서: mpsc `send`를 select!에 쓰면 메시지를 잃고, `write_all`은 취소 안전하지 않다"
handling = "`select!`는 세 곳에 있다. (1) 로컬 API의 줄 읽기 대 연결 종료 신호 대 hello 시간 제한: 읽기는 `fill_buf`/`consume` 기반이라 버려져도 버퍼가 남고, 다른 분기가 이기면 연결을 버린다. (2) Hyperliquid 스트림의 수신 대 ping 타이머: 수신은 `StreamExt::next`. (3) 프로세스 종료 신호 대 치명 표시. 거래소 입력의 전달(`push_venue`)과 소켓 쓰기는 select! 안에 두지 않았다. 구독 전달 태스크는 연결이 끝날 때 중단시킨다"
design = "결정"
impl = "구현"
verify = "부분"
adr = []
contracts = ["C-API", "C-GW"]
code = ["crates/oms-node/src/server.rs", "crates/oms-node/src/venue/hyperliquid/mod.rs"]
claims = ["V-API-3"]
open = "취소 시점을 겨냥한 시험이 없다. 코드 검토에 의존한다. 영향: 취소 시점에만 나타나는 결함이 드물게 생길 수 있다. 해소: 연결 끊김과 종료를 겨냥한 프로세스 시험을 늘린다(구독자 정리는 V-API-3으로 추가했다). 단계: 배포 전."

[[item]]
id = "D-CONC-03"
layer = "domain"
area = "동시성"
consideration = "종료와 과부하에서 스레드가 서로를 기다리며 멈추지 않는가"
necessity = "제한 큐로 이어진 단계는 순환 대기가 생기면 영원히 멈춘다"
sources = ["PRACTICE"]
applicability = "적용"
reason = "단계들이 상한 있는 큐로 이어져 있어 순환 대기가 생길 수 있다"
handling = "대기 방향은 한쪽이다: 진입 → 입력 큐 → 코어 → 커밋 → 게이트웨이 명령 큐. 게이트웨이는 결과를 venue 입력 큐로 넣고 그 큐가 차면 기다린다. 이 고리는 venue 큐(4096)와 명령 큐가 동시에 가득 차야 닫힌다. 진행 중 전송 상한(64)이 명령 큐를 채우지 못하게 한다"
design = "결정"
impl = "구현"
verify = "부분"
adr = ["ADR-010", "ADR-012"]
contracts = ["C-OVERLOAD"]
code = ["crates/oms-node/src/pipeline.rs"]
claims = ["V-OVL-2", "V-PERF-2"]
open = "취소 명령은 진행 중 전송 상한에 들지 않는다. 열린 주문 전부에 취소가 동시에 걸리면 명령 큐 크기(상한 합 + 64) 안에 들어가도록 잡았지만, 재시도가 겹치는 극단은 분석하지 않았다. 영향: 명령 큐가 차면 커밋 스레드가 기다려 응답이 늦어진다. 유실은 없다. 해소: 취소 폭주와 느린 거래소를 겹친 시험. 단계: 배포 전."

