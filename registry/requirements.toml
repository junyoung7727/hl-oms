# 요구사항 R01~R15. 이 저장소의 정본 요구다.
# 원문: TradingSystem/docs/architecture/FIA-OMS-model.md §3(저장소 밖)의 표를 그대로 옮겼다. source 열은 동기와 범위이고, 식 자체가 FIA 조항이라는 뜻은 아니다.
# logic: 코어와 가짜(가상 거래소, 시뮬레이션, loopback 가짜 Bybit)로 이 요구를 확인하는 주장.
# bybit: 실제 Bybit(테스트넷)에 보내서 확인하는 주장. 이 칸의 주장은 시험이 모두 `bybit-testnet` 묶음에 있어야 한다(생성기가 확인한다). 어떤 가짜도 이 칸에 넣지 않는다.
# untested: 이 요구에 속하는 규칙인데 시험이 없는 것. 지운 계약 문서에서 옮겨 왔다. 시험이 생기면 주장으로 옮기고 여기서 지운다.
# gap: 확인하지 않은 범위. 손으로 적는다. 결과(통과 여부)는 적지 않는다.

