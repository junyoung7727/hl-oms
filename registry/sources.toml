[[source]]
id = "ISO25010"
title = "ISO/IEC 25010:2023 Product quality model"
version = "2판, 2023-11 (2011판은 폐지)"
role = "품질 분류 모델"
accessed = "초록, 수명주기 정보, 미리보기(목차·서문·도입·적용 범위). 3~4절 본문은 읽지 못했다(유료)."
secondary = "하위 특성 40개의 목록과 정의는 iso25000.com에서 가져왔다(2차 자료)."
caution = "누락 점검용 분류 축으로만 쓴다. 준수나 인증을 주장하지 않는다. Safety가 금전 손실을 포함하는지는 본문 미확인."
detail = "docs/research/standards-sources.md"

[[source]]
