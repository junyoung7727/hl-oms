title = "FIX Order State Changes"
version = "FIX Latest EP284, 2023-11 (57쪽)"
role = "참조 의미"
accessed = "PDF 전체를 추출했으나 정독한 것은 1~2장, 3.1 개요, 시나리오 B.1.b–f, C.3.c, D.2.d, E.1.b, F.1.a–b, G.1.a, G.1.c, J.1.a–b, J.1.d다. 나머지 시나리오 묶음(A, C.1–2, D.1, H, I, K, L)은 제목만 봤다. 세션 계층 표준은 3.1.13, 4.8.4, 4.8.7, 4.9만."
caution = "대상 거래소는 FIX가 아니다. 취소 중 체결, 종결 뒤 정정 같은 사례의 존재 근거로만 쓴다."
