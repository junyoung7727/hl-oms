[[source]]
id = "HL-DOCS"
title = "Hyperliquid 공식 문서 (GitBook)"
version = "버전 표기 없음. 2026-10-02에 54쪽을 내려받음"
role = "프로토콜 계약"
accessed = "websocket, nonce, rate limit, tick/lot, 오류, 서명 쪽은 전부. exchange 쪽은 부분(서두, order, cancel, cancelByCloid, scheduleCancel, modify 등 주문 관련 액션만). info 쪽은 부분(openOrders, userFills, userFillsByTime, userRateLimit, orderStatus, historicalOrders, meta, clearinghouseState 등 perp 관련만. spot·vault·staking은 읽지 않음). Discord와 Telegram 공지는 읽지 않았다."
caution = "문서에 없는 동작은 가정하지 않는다. 문서 자체에 모순이 있다(주문의 sz 의미, 페이지 크기)."
detail = "docs/research/hyperliquid-protocol.md"

