<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMS 대시보드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="banner">
  <div id="runkind" class="runkind unknown">확인 중</div>
  <div id="bannerfacts" class="facts"></div>
</header>
<nav id="nav">
  <a href="#/items" data-screen="items">고려사항·결정</a>
  <a href="#/behaviour" data-screen="behaviour">동작 탐색</a>
  <a href="#/orders" data-screen="orders">주문 추적</a>
  <a href="#/verify" data-screen="verify">검증 현황</a>
  <a href="#/ops" data-screen="ops">운영 상태</a>
  <span class="legend">
    <span class="tag observed">관측</span>
    <span class="tag inferred">추론</span>
    <span class="tag expected">기대</span>
    <span class="tag unknown">미확인</span>
    <a href="#/legend">뜻</a>
  </span>
</nav>
<main id="main"><p class="muted">불러오는 중</p></main>
<footer>
  읽기 전용 화면이다. 중지·재개·취소·확인·조정은 운영 소켓(<code>omsctl --socket …/admin.sock</code>)으로만 하고 저널에 남는다.
</footer>
<script src="app.js"></script>
</body>
</html>
