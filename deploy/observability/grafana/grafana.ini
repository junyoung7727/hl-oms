; Grafana for dashboards D2 (market-data collection) and D3 (system).
; Not installed by this repository: docs/operations/observability.md §12.
; Grafana shows only: alerts come from vmalert and Alertmanager.

[server]
; 192.0.2.1 = placeholder (RFC 5737 TEST-NET-1, never assigned here): write this PC's Tailscale address
http_addr = 192.0.2.1
http_port = 3000

[paths]
data = /mnt/nvme/observability/grafana
plugins = /mnt/nvme/observability/grafana/plugins
provisioning = /etc/hl-oms-obs/grafana/provisioning

[security]
admin_password = $__file{/etc/hl-oms/grafana-admin-password}
disable_gravatar = true

[auth.anonymous]
enabled = false

[unified_alerting]
enabled = false

[alerting]
enabled = false

; No call home.
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[plugins]
preinstall_disabled = true
public_key_retrieval_disabled = true

[log]
mode = console
