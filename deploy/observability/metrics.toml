# The metric catalogue of the deployment check (ADR-035 D7): every metric
# name a rule or a dashboard uses is a row here, a metric of the pinned qdp
# list contracts/lake/xrepo/metrics.json, or a `record` of a rule file.
#
# [[metric]]: a metric hl-oms pushes. `source` is the file that contains the
# name as a string literal (rule R2); the check fails when it does not.
# [[stack]]: a metric of the observability stack itself, read from the
# tools' /metrics at the versions given (scraped by victoriametrics/scrape.json;
# ALERTS is written by vmalert). Not installed.

[[metric]]
name = "lake_l0_open_files"
labels = ["venue"]
source = "crates/md-collector/src/obs.rs"

