[package]
name = "md-collector"
description = "The market-data collector (one process per venue, writes L0 stage-1 files) and the md-lake seal/verify binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "md-collector"
path = "src/bin/md-collector.rs"

[[bin]]
name = "md-lake"
path = "src/bin/md-lake.rs"

[dependencies]
md-core = { path = "../md-core" }
md-bybit = { path = "../md-bybit" }
md-feed = { path = "../md-feed" }
md-lake = { path = "../md-lake" }
alert-direct = { path = "../alert-direct" }
obs-push = { path = "../obs-push" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros"] }
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
http-fake = { path = "../http-fake" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }

[lints]
workspace = true
