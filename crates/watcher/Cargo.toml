[package]
name = "watcher"
description = "Independent watcher of the OMS (U19a): own journal reader, own sets and own Bybit client. Depends on no oms-* or md-* crate (tools/ci/watcher_independent.sh)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "watcher"
path = "src/main.rs"

[dependencies]
crc32fast = "1.5.2"
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "time", "net", "io-util", "sync", "macros", "signal"] }
toml = "1.1.6"

[dev-dependencies]
http-fake = { path = "../http-fake" }
tokio = { version = "1.53.1", features = ["rt", "time", "macros"] }

[lints]
workspace = true
