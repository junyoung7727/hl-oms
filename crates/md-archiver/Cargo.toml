[package]
name = "md-archiver"
description = "Builds the L1 Parquet tables from sealed L0 files (lake contract section 3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "md-archiver"
path = "src/bin/md-archiver.rs"

[dependencies]
md-core = { path = "../md-core" }
md-bybit = { path = "../md-bybit" }
md-lake = { path = "../md-lake" }
serde_json = { workspace = true }
parquet = { version = "60.1.0", default-features = false, features = ["zstd"] }
rustix = { version = "1.1.5", features = ["fs"] }

[lints]
workspace = true

[dev-dependencies]
hex = "0.4.3"
sha2 = "0.11.0"
zstd = "0.13.5"
