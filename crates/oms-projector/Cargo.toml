[package]
name = "oms-projector"
description = "Reads the OMS journal without its lock, up to the durable sequence, and pushes oms_* metrics and one log line per event to VictoriaMetrics and VictoriaLogs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "oms-projector"
path = "src/main.rs"

[dependencies]
oms-core = { workspace = true }
oms-journal = { workspace = true }
obs-push = { path = "../obs-push" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1.6"
tokio = { version = "1.53.1", features = ["rt", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
http-fake = { path = "../http-fake" }

[lints]
workspace = true
