[package]
name = "obs-push"
description = "Bounded, non-blocking push to VictoriaMetrics (/api/v1/import) and VictoriaLogs (/insert/jsonline): drop-oldest queues, retry, own thread."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = { workspace = true }
tokio = { version = "1.53.1", features = ["rt", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
http-fake = { path = "../http-fake" }

[lints]
workspace = true
