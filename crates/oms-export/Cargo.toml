[package]
name = "oms-export"
description = "Writes the lake's trading tables (orders, fills, events; lake contract section 4) from the OMS journal, read without its lock up to the durable sequence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "oms-export"
path = "src/main.rs"

[dependencies]
oms-core = { workspace = true }
oms-journal = { workspace = true }
oms-projector = { path = "../oms-projector" }
md-archiver = { path = "../md-archiver" }
md-lake = { path = "../md-lake" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1.6"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
http-fake = { path = "../http-fake" }
parquet = { version = "60.1.0", default-features = false, features = ["zstd"] }

[lints]
workspace = true
