[package]
name = "md-feed"
description = "Venue connection and resync driver: in-process order book, stale flag and market_ref for the strategy and the collector."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
md-core = { path = "../md-core" }
serde_json = { workspace = true }
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "query"] }

[dev-dependencies]
md-bybit = { path = "../md-bybit" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }

[lints]
workspace = true
