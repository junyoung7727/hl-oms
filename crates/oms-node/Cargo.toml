[package]
name = "oms-node"
description = "The OMS process: sequencer, commit gate, local API, venue gateways, recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oms-core = { workspace = true }
oms-journal = { workspace = true }
oms-api = { workspace = true }
oms-sim = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros", "fs"] }
toml = "1.1.6"
rustix = { version = "1.1.5", features = ["fs", "process"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
# Hyperliquid gateway
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
k256 = { version = "0.14.0", features = ["ecdsa"] }
sha3 = "0.12.0"
rmp-serde = "1.3.1"
hex = "0.4.3"

[lints]
workspace = true

[features]
# Compiles in the journal-failure hook used by tests/pipeline.rs. Never
# enabled for the binary that is deployed.
failpoints = []

[[test]]
name = "pipeline"
required-features = ["failpoints"]

[[test]]
name = "crash_points"
required-features = ["failpoints"]

[dev-dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }
