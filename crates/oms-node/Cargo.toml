[package]
name = "oms-node"
description = "The OMS process: sequencer, commit gate, local API, venue gateways, recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oms-core = { workspace = true }
oms-journal = { workspace = true }
oms-api = { workspace = true }
oms-sim = { workspace = true }
# Direct Telegram alerts (C-ALERT, ADR-029)
alert-direct = { path = "../alert-direct" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros", "fs"] }
toml = "1.1.6"
rustix = { version = "1.1.5", features = ["fs", "process"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
# Hyperliquid gateway
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
k256 = { version = "0.14.0", features = ["ecdsa"] }
sha3 = "0.12.0"
rmp-serde = "1.3.1"
hex = "0.4.3"
# Bybit gateway (RSA keys: ring and base64, already in Cargo.lock; ADR-034)
hmac = "0.13.0"
sha2 = "0.11.0"
ring = "0.17"
base64 = "0.23"

[lints]
workspace = true

[features]
# Compiles in the journal-failure hook used by tests/pipeline.rs and
# tests/crash_points.rs, the Bybit endpoint hook OMS_TEST_BYBIT_WIRING
# used by tests/bybit_node.rs, and the Telegram endpoint hook
# OMS_TEST_TELEGRAM_API (C-ALERT). Never enabled for the binary that is
# deployed.
failpoints = []

[[test]]
name = "pipeline"
required-features = ["failpoints"]

[[test]]
name = "crash_points"
required-features = ["failpoints"]

[[test]]
name = "bybit_node"
required-features = ["failpoints"]

[dev-dependencies]
http-fake = { path = "../http-fake" }
rustix = { version = "1.1.5", features = ["fs", "process"] }
